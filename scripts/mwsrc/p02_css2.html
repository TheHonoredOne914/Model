<style>
/* ---------- battle / question card ---------- */
.battle-top{display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap}
.streak{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:.76rem;font-weight:800;color:var(--text2)}
.streak.hot{color:var(--gold2);border-color:rgba(227,176,79,.4);background:var(--goldsoft)}
.battle-top .spacer{flex:1}
.sess{font-size:.74rem;font-weight:700;color:var(--muted);letter-spacing:.5px}
.qcard{position:relative;background:var(--card);border:1px solid var(--line2);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow);overflow:hidden;animation:popIn .4s cubic-bezier(.22,1,.36,1)}
.qcard::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--wc),transparent 85%)}
.qcard .q-sigil{position:absolute;right:-20px;bottom:-26px;width:170px;height:170px;opacity:.05;pointer-events:none}
.q-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.q-meta .qcount{margin-left:auto;font-size:.7rem;font-weight:700;color:var(--muted);letter-spacing:.6px}
.paper-note{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:13px;background:var(--goldsoft);border:1px solid rgba(227,176,79,.22);font-size:.82rem;color:var(--gold2);font-weight:600;margin-bottom:16px}
.paper-note .pn-ico{flex-shrink:0;font-size:1rem}
.qtext{font-size:1.14rem;line-height:1.65;font-weight:500}
.qtext .mfrac,.qtext sup,.qtext sub{line-height:1}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px 15px;border-radius:15px;
  background:var(--card2);border:1.5px solid var(--line);text-align:left;font-size:1rem;font-weight:600;color:var(--text);
  transition:border-color var(--t-fast),transform var(--t-fast),background var(--t-fast);animation:riseFade .4s ease backwards}
.opt:nth-child(2){animation-delay:.05s}.opt:nth-child(3){animation-delay:.1s}.opt:nth-child(4){animation-delay:.15s}
.opt:hover{border-color:var(--line2);transform:translateY(-1.5px)}
.opt:active{transform:scale(.985)}
.opt .key{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:.74rem;font-weight:800;background:var(--raise);border:1px solid var(--line);color:var(--muted);flex-shrink:0;transition:var(--t-fast)}
.opt.correct{border-color:var(--good);background:var(--goodsoft)}
.opt.correct .key{background:var(--good);color:#08130c;border-color:transparent}
.opt.wrong{border-color:var(--bad);background:var(--badsoft)}
.opt.wrong .key{background:var(--bad);color:#1c0a0d;border-color:transparent}
.opt[disabled]{pointer-events:none;opacity:.82}
.opt.reveal{border-color:var(--info);background:var(--infosoft)}
.ansrow{display:flex;gap:10px;margin-top:18px}
.ansrow input{flex:1;min-height:54px;padding:12px 16px;border-radius:15px;border:1.5px solid var(--line2);
  background:var(--bg2);color:var(--text);font-size:1.08rem;font-weight:600;transition:var(--t-fast)}
.ansrow input::placeholder{color:var(--muted);font-weight:500}
.ansrow input:focus{outline:none;border-color:var(--gold);box-shadow:var(--glow)}
.checkbtn{min-width:118px}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.tf .opt{justify-content:center;min-height:58px;font-size:1.05rem}
.feedback{margin-top:16px;border-radius:16px;padding:16px;animation:riseFade .3s ease;border:1px solid}
.feedback.ok{background:var(--goodsoft);border-color:rgba(99,199,143,.35)}
.feedback.no{background:var(--badsoft);border-color:rgba(224,112,127,.35)}
.feedback .fb-head{font-weight:800;font-size:.98rem}
.feedback.ok .fb-head{color:var(--good)} .feedback.no .fb-head{color:var(--bad)}
.feedback .fb-actions{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
.xp-pop{position:fixed;z-index:90;font-weight:800;color:var(--gold2);font-size:1rem;pointer-events:none;animation:riseFade .3s ease, xpFloat 1s ease .3s forwards;text-shadow:0 2px 10px rgba(0,0,0,.5)}
@keyframes xpFloat{to{opacity:0;transform:translateY(-42px)}}
.q-foot{display:flex;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.hintbox{margin-top:12px;padding:12px 14px;border-radius:13px;background:var(--infosoft);border:1px solid rgba(143,183,207,.25);font-size:.86rem;color:var(--text2);animation:riseFade .3s ease}
.hintbox b{color:var(--info)}
.combo{position:fixed;z-index:95;left:50%;top:26%;transform:translateX(-50%);font-family:var(--font-d);font-weight:750;font-size:1.7rem;color:var(--gold2);text-shadow:0 4px 24px rgba(227,176,79,.45);pointer-events:none;animation:comboIn .9s cubic-bezier(.22,1,.36,1) forwards}
@keyframes comboIn{0%{opacity:0;transform:translateX(-50%) scale(.5)}25%{opacity:1;transform:translateX(-50%) scale(1.12)}70%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-30px) scale(.95)}}
/* ---------- story (solution) deck ---------- */
.deck{margin-top:16px;border-radius:var(--r-md);border:1px solid var(--line2);background:var(--bg2);overflow:hidden;animation:riseFade .32s ease}
.deck .dk-head{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line);font-size:.72rem;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:var(--wc)}
.deck .dk-head .dk-close{margin-left:auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--raise);border:1px solid var(--line);font-size:.85rem}
.deck .dk-body{padding:16px}
.givfind{display:grid;gap:8px;margin-bottom:14px}
.gf{padding:11px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.gf small{display:block;font-size:.62rem;font-weight:800;letter-spacing:1.6px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.gf .gv{font-size:.94rem;font-weight:600}
.concept-chip{padding:11px 14px;border-radius:12px;background:var(--wc-soft);border:1px solid var(--line2);font-size:.9rem;font-weight:700;color:var(--text);margin-bottom:14px}
.concept-chip small{display:block;font-size:.62rem;font-weight:800;letter-spacing:1.6px;color:var(--wc);text-transform:uppercase;margin-bottom:3px}
.steps{display:grid;gap:9px}
.step{display:flex;gap:12px;padding:13px 15px;border-radius:13px;background:var(--card);border:1px solid var(--line);animation:riseFade .34s ease backwards}
.step .sn{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:.72rem;font-weight:800;background:var(--wc-soft);color:var(--wc);flex-shrink:0;margin-top:1px}
.step .st{font-size:.94rem;color:var(--text)}
.dk-ctrl{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.dk-ctrl .dk-count{margin-left:auto;font-size:.72rem;font-weight:700;color:var(--muted)}
.finalans{margin-top:12px;padding:16px;border-radius:14px;background:linear-gradient(150deg,var(--goodsoft),transparent);border:1px solid rgba(99,199,143,.4);text-align:center}
.finalans small{display:block;font-size:.64rem;font-weight:800;letter-spacing:2.4px;color:var(--good);text-transform:uppercase;margin-bottom:5px}
.finalans .fa{font-family:var(--font-d);font-size:1.5rem;font-weight:750;color:var(--text)}
.mistake{margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--badsoft);border:1px solid rgba(224,112,127,.25);font-size:.84rem;color:var(--text2)}
.mistake b{color:var(--bad)}
/* ---------- boss arena ---------- */
.boss-gate{border-radius:var(--r-lg);border:1px solid var(--line2);background:var(--card);padding:26px 22px;text-align:center;box-shadow:var(--shadow)}
.boss-gate .bg-sigil{width:92px;height:92px;margin:0 auto 14px;opacity:.9}
.boss-gate h3{font-size:1.5rem}
.boss-gate .bg-name{font-size:.8rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--wc);margin-top:4px}
.boss-gate p{color:var(--text2);font-size:.9rem;max-width:44ch;margin:10px auto 0}
.gatebar{height:9px;border-radius:99px;background:var(--raise);overflow:hidden;margin:16px auto 8px;max-width:300px}
.gatebar b{display:block;height:100%;background:linear-gradient(90deg,var(--wc),var(--gold2));border-radius:99px;transition:width .6s ease}
.arena{position:relative;border-radius:var(--r-lg);border:1px solid var(--line2);background:
  radial-gradient(600px 320px at 50% -10%,var(--wc-soft),transparent 70%),var(--bg1);
  padding:20px;box-shadow:var(--shadow);overflow:hidden;text-align:center}
.arena .rounds{display:flex;justify-content:center;gap:7px;margin-bottom:14px}
.arena .rd{width:26px;height:8px;border-radius:99px;background:var(--raise);transition:var(--t-med)}
.arena .rd.won{background:var(--good);box-shadow:0 0 10px rgba(99,199,143,.5)}
.arena .rd.lost{background:var(--bad)}
.monster-stage{position:relative;height:196px;display:grid;place-items:center}
.monster-stage .mwrap{width:190px;height:190px;animation:breathe 3.6s ease-in-out infinite;filter:drop-shadow(0 18px 26px rgba(0,0,0,.45))}
.monster-stage.hit .mwrap{animation:hitFlash .5s ease}
@keyframes hitFlash{0%{transform:scale(1)}30%{transform:scale(.94) translateX(-5px);filter:drop-shadow(0 0 20px rgba(224,112,127,.7)) brightness(1.5)}100%{transform:scale(1)}}
.monster-stage .mshadow{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:130px;height:16px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.5),transparent)}
.boss-nameplate{display:inline-flex;align-items:center;gap:9px;padding:8px 18px;border-radius:999px;background:var(--card);border:1px solid var(--line2);font-family:var(--font-d);font-weight:650;font-size:1.02rem}
.boss-nameplate small{font-size:.62rem;font-weight:800;letter-spacing:2px;color:var(--wc);text-transform:uppercase;font-family:var(--font-b)}
.boss-hp{max-width:340px;margin:14px auto 0}
.boss-hp .hp-num{display:flex;justify-content:space-between;font-size:.68rem;font-weight:800;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:5px}
.boss-hp .hp-bar{height:12px;border-radius:99px;background:var(--raise);overflow:hidden;border:1px solid var(--line)}
.boss-hp .hp-bar b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--bad),var(--gold2));transition:width .55s cubic-bezier(.22,1,.36,1)}
.boss-hurt{animation:hpShake .4s ease}
.vs-line{margin:14px 0 4px;font-size:.72rem;font-weight:800;letter-spacing:2.4px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:12px}
.vs-line::before,.vs-line::after{content:"";flex:1;height:1px;background:var(--line2)}
.boss-q .qtext{font-size:1.06rem}
.victory{position:relative;text-align:center;padding:30px 20px;animation:popIn .5s cubic-bezier(.22,1,.36,1)}
.victory .v-crest{width:120px;height:120px;margin:0 auto 16px;animation:glowPulse 2.6s infinite}
.victory h2{font-size:2rem}
.victory .v-sub{color:var(--text2);margin-top:8px}
.victory .loot{display:flex;justify-content:center;gap:10px;margin:18px 0;flex-wrap:wrap}
.defeat h2{color:var(--bad)}
/* ---------- progress ---------- */
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{padding:15px 13px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--line);text-align:center}
.badge .bi{font-size:1.7rem;margin-bottom:6px}
.badge.got{border-color:rgba(227,176,79,.35);background:linear-gradient(160deg,var(--goldsoft),var(--card) 80%)}
.badge .bn{font-size:.8rem;font-weight:800}
.badge .bd{font-size:.68rem;color:var(--muted);margin-top:3px}
.badge.locked{opacity:.45;filter:grayscale(1)}
.ringrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.ringcell{padding:12px 6px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--line);text-align:center}
.ringcell svg{width:52px;height:52px}
.ringcell .rl{font-size:.62rem;font-weight:700;color:var(--text2);margin-top:5px;letter-spacing:.3px}
/* ---------- modal / sheet ---------- */
.sheet-veil{position:fixed;inset:0;background:rgba(5,6,10,.66);backdrop-filter:blur(6px);z-index:60;display:none;align-items:flex-end;justify-content:center;animation:riseFade .25s ease}
.sheet-veil.open{display:flex}
.sheet{width:min(560px,100%);max-height:82dvh;overflow-y:auto;background:var(--bg1);border:1px solid var(--line2);border-radius:26px 26px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));animation:sheetUp .34s cubic-bezier(.22,1,.36,1)}
@keyframes sheetUp{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{font-size:1.3rem;margin-bottom:4px}
.sheet .sh-sub{color:var(--muted);font-size:.82rem;margin-bottom:16px}
.theme-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.theme-card{position:relative;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--card);text-align:left;transition:var(--t-fast)}
.theme-card:active{transform:scale(.97)}
.theme-card.sel{border-color:var(--gold);box-shadow:var(--glow)}
.theme-card .sw{display:flex;gap:5px;margin-bottom:9px}
.theme-card .sw i{width:22px;height:22px;border-radius:8px;border:1px solid rgba(255,255,255,.12)}
.theme-card .tn{font-weight:800;font-size:.88rem}
.theme-card .td{font-size:.7rem;color:var(--muted);margin-top:2px}
.theme-card .tick{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:8px;background:var(--gold);color:#221a08;display:none;place-items:center;font-size:.72rem;font-weight:900}
.theme-card.sel .tick{display:grid}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border:none}
.set-row .sl{font-weight:700;font-size:.92rem}
.set-row .sd{font-size:.74rem;color:var(--muted);margin-top:2px}
.switch{width:52px;height:30px;border-radius:99px;background:var(--raise);border:1px solid var(--line2);position:relative;transition:var(--t-fast);flex-shrink:0}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:var(--t-med)}
.switch.on{background:var(--goldsoft);border-color:var(--gold)}
.switch.on i{left:25px;background:var(--gold)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:99;padding:12px 20px;border-radius:14px;background:var(--card2);border:1px solid var(--line2);box-shadow:var(--shadow);font-size:.88rem;font-weight:700;animation:sheetUp .3s ease;max-width:88vw;text-align:center}
/* ---------- responsive ---------- */
@media (max-width:560px){
  .screen{padding:14px 13px calc(26px + env(safe-area-inset-bottom))}
  .qcard{padding:18px 16px}
  .qtext{font-size:1.05rem}
  .ringrow{grid-template-columns:repeat(2,1fr)}
  .theme-row{grid-template-columns:1fr}
  .monster-stage{height:172px}.monster-stage .mwrap{width:160px;height:160px}
  .world-hero h2{font-size:1.6rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
/* ---------- math rendering ---------- */
.mfrac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:-0.55em;margin:0 2px;font-size:.94em}
.mfrac .fn{padding:0 5px;border-bottom:1.6px solid currentColor;line-height:1.25}
.mfrac .fd{padding:0 5px;line-height:1.25}
.sqrt{border-top:1.5px solid currentColor;padding:1px 4px 0 2px;margin-left:1px}
.deg{vertical-align:super;font-size:.72em}
</style>
</head>
