<script>
/* ============ LEARN: CONCEPT SCROLLS + WIDGETS ============ */
const LEARN={
coord:[
 {t:"Two Numbers, One Spot",b:`Every point on the plane has an address: <b>(x, y)</b> — how far across, then how far up. The x-axis runs east, the y-axis runs north, and where they cross sits the <b>origin (0, 0)</b>.<span class="fx">P(3, −2) → 3 right, 2 down</span>The signs of x and y decide the <b>quadrant</b>: I (+,+) · II (−,+) · III (−,−) · IV (+,−) — anticlockwise from the north-east.`,rem:"Coordinates are ALWAYS (x, y) — across first, up second. Sign = direction.",ex:"<b>Dhruva drops a beacon at (−3, 4)</b> — 3 west, 4 north → Quadrant II. The map can never lose him now."},
 {t:"Mirror Waters (Reflections)",b:`Reflect across the <b>y-axis</b> → x flips sign: (x, y) → (−x, y).<br>Reflect across the <b>x-axis</b> → y flips: (x, y) → (x, −y).<span class="fx">(5, −3) over y-axis → (−5, −3)</span>The axis acts like a still lake — the point and its reflection stand at equal distances on opposite shores.`,rem:"Only ONE coordinate changes — the one matching the mirror axis keeps the other hostage.",ex:"<b>Nullbeard hides at P(4, −7)</b>. His mirror-twin across the y-axis waits at (−4, −7). Same y — same latitude!"},
 {t:"How Far Between Two Points?",b:`Moving only along grid lines (like city streets): <b>grid distance = |x₂ − x₁| + |y₂ − y₁|</b>.<br>Absolute difference = distance, never negative.<span class="fx">A(2, 3) → B(6, 3): |6−2| = 4 units</span>Same row → only |Δx|. Same column → only |Δy|. That's how a robot with no diagonals plans its shortest route.`,rem:"Distance on a grid = |change in x| + |change in y|. No diagonals allowed.",ex:"<b>A cleaning bot rolls A(3,1) → B(−3,8)</b>: |−3−3| + |8−1| = 6 + 7 = <b>13 units</b>."},
 {t:"The Midpoint Isle",b:`The point exactly halfway between A(x₁, y₁) and B(x₂, y₂) is the <b>average of the averages</b>:<span class="fx">Midpoint = ( (x₁+x₂)/2 , (y₁+y₂)/2 )</span>Think of it as the balance point of a seesaw holding both towns.`,rem:"Midpoint = mean of x's, mean of y's. Averages are friendly like that.",ex:"<b>A(2, −4), B(8, 2)</b> → midpoint = (10/2, −2/2) = <b>(5, −1)</b>. Camp exactly between."}],
linear:[
 {t:"What is a Linear Equation?",b:`An equation where the unknown appears only to the <b>first power</b> — no x², no √x. Its graph is always a perfectly straight line.<span class="fx">2x + 5 = 13  →  x = 4</span>Solving = keeping the seesaw balanced: whatever you do to one side, do to the other.`,rem:"Linear = degree 1. One unknown, one straight-line soul.",ex:"<b>x − 7 = 3</b>: push the 7 across (it flips to +7) → x = 10. Balance preserved."},
 {t:"Two Variables, Infinite Answers",b:`Equations like <b>2x + 3y = 12</b> have not one solution but an <b>infinite line</b> of them. Pick any x, y follows the law.<span class="fx">x = 0 → y = 4 · x = 3 → y = 2 · x = 6 → y = 0</span>Plot those three — they sit on one straight line. That's why it's called <b>linear</b>.`,rem:"A solution of 2-variable equation = a PAIR (x, y) that satisfies it. Always verify both.",ex:"<b>Is (2, 3) on 2x + 3y = 13?</b> 2(2) + 3(3) = 4 + 9 = 13 ✓. Yes — Dhruva plots it."},
 {t:"Slope (m): The Line's Attitude",b:`In <b>y = mx + c</b>: m is the <b>slope</b> — how fast y climbs as x walks forward. c is where the line crosses the y-axis.<span class="fx">y = 2x + 1 → m = 2, c = 1</span>m > 0: climbing east. m < 0: diving east. m = 0: flat, lazy horizon. Bigger |m| = steeper mood.`,rem:"y = mx + c. m = steepness, c = y-axis entrance point.",ex:"<b>y = −3x + 12</b>: starts at 12, drops 3 per step east. At x = 4 it hits zero — the x-axis intercept."}],
number:[
 {t:"The Number Family Tree",b:`<b>Natural → Whole → Integers → Rational</b>: each family swallows the previous. Rationals = anything writable as p/q (q ≠ 0): ¾, −5, 0.333…<br>Then the rebels: <b>irrationals</b> — √2, π — decimals that never repeat, never end.<span class="fx">Every point on the number line = exactly ONE real number</span>`,rem:"All rationals are real. All irrationals are real. Together = the whole line.",ex:"<b>Is 0.101001000… rational?</b> The 1s march further apart forever — no repeating block → <b>irrational</b>."},
 {t:"√2: The First Rebel",b:`The Greeks proved √2 cannot be p/q. Sketch of the proof: if √2 = p/q in lowest terms, then p² = 2q², so p is even → p = 2k → q² = 2k² → q is even too. Both even? Contradiction!<span class="fx">√2 is irrational — forever p/q-proof</span>`,rem:"If a prime² divides p², the prime divides p. That's the sword in this proof.",ex:"<b>Same logic kills √3, √5, √7…</b> Any prime under a root refuses to be rational."},
 {t:"Laws of Exponents",b:`Powers follow five mighty laws:<span class="fx">aᵐ × aⁿ = aᵐ⁺ⁿ · aᵐ ÷ aⁿ = aᵐ⁻ⁿ<br>(aᵐ)ⁿ = aᵐⁿ · a⁰ = 1 · a⁻ⁿ = 1/aⁿ</span>They work for ALL a ≠ 0 — integers, fractions, even irrational bases.`,rem:"Multiplying powers = adding exponents (same base!). Dividing = subtracting.",ex:"<b>2⁵ × 2³ = 2⁸ = 256</b>. And 7⁰? One — even the biggest power collapses to 1 at exponent zero."},
 {t:"Taming Recurring Decimals",b:`0.333… = 1/3 exactly. For fancier repeats use algebra: let x = 0.4̄7̄ (47 repeating), multiply by 100 to shift one full block, subtract, divide.<span class="fx">100x − x = 47.4747… − 0.4747… = 47<br>99x = 47 → x = 47/99</span>Every recurring decimal is secretly rational.`,rem:"One repeating digit of length d → multiply by 10^d, subtract, divide by (10^d − 1).",ex:"<b>x = 0.9̄</b>: 10x − x = 9.9̄ − 0.9̄ = 9 → x = 1. Yes — 0.999… IS exactly 1."}],
identity:[
 {t:"The Area Picture of (a + b)²",b:`Draw a square of side (a+b). It splits into 4 fields: a², ab, ab, b².<span class="fx">(a + b)² = a² + 2ab + b²</span>Not memorised — SEEN. The two ab rectangles are the middle term's reason for existing.`,rem:"(a+b)² = a² + 2ab + b². The 2ab is TWO rectangles, never a² + b².",ex:"<b>(x + 5)² = x² + 10x + 25</b>. Middle term = 2·x·5 — the two corridors around the x² field."},
 {t:"The Difference Trick: (a − b)²",b:`Same square, but cut a b-strip out. What's left still equals a² − 2ab + b² — the middle term turns <b>negative</b> because you remove two overlapping strips.<span class="fx">(a − b)² = a² − 2ab + b²</span>Watch the sign: the middle term keeps the sign of the expanded bracket.`,rem:"(a−b)² = a² − 2ab + b². It is NOT a² − b². The b² survives, positive.",ex:"<b>(x − 4)² = x² − 8x + 16</b>. Middle = −2·x·4."},
 {t:"Difference of Squares",b:`a² − b² factors beautifully:<span class="fx">a² − b² = (a + b)(a − b)</span>Picture: a² square minus b² corner = an L-shape that rearranges into a (a+b) × (a−b) rectangle. This identity computes mental maths at lightning speed.`,rem:"Sum × difference = difference of squares. The middle term vanishes.",ex:"<b>51 × 49 = (50+1)(50−1) = 2500 − 1 = 2449</b>. Dhruva multiplies faster than the market crier."},
 {t:"Cubes & The Factor Sword",b:`The cube family extends the pattern:<span class="fx">(a + b)³ = a³ + 3a²b + 3ab² + b³<br>a³ + b³ = (a + b)(a² − ab + b²)<br>a³ − b³ = (a − b)(a² + ab + b²)</span>Factorisation reverses expansion — spot the pattern, split the expression, solve faster.`,rem:"a³ ± b³ always factors. The trinomial partner keeps the OPPOSITE signs balanced.",ex:"<b>x³ − 27 = (x − 3)(x² + 3x + 9)</b>. Spot 27 = 3³, unsheathe the factor sword."}],
circle:[
 {t:"Anatomy of a Circle",b:`<b>Chord</b>: segment joining two points on the circle. <b>Diameter</b>: the king chord — through the centre. <b>Arc</b>: a piece of the rim. <b>Sector</b>: pizza slice. <b>Semicircle</b>: half, cut by the diameter.<span class="fx">d = 2r · C = 2πr = πd · A = πr²</span>`,rem:"Chord's endpoints ON the circle; diameter passes through centre — the longest chord.",ex:"<b>r = 7 cm</b> → C = 2·(22/7)·7 = <b>44 cm</b>, A = (22/7)·49 = <b>154 cm²</b>."},
 {t:"Equal Chords, Equal Angles",b:`The Sanctum's first law: <b>equal chords subtend equal angles at the centre</b> — and the reverse. Longer chord → bigger central angle. The centre sees everything fairly.<span class="fx">AB = CD ⇔ ∠AOB = ∠COD</span>`,rem:"Chord length ↑ ⇒ central angle ↑. Equal ⇔ equal, both directions.",ex:"<b>∠AOB = 70°⇄ CD also sees 70°</b>. Orbweaver's web is perfectly just."},
 {t:"The Angle-at-the-Rim Law",b:`The oldest law: <b>the angle at the centre is double the angle at the rim</b>, standing on the same arc.<span class="fx">∠AOB = 2∠ACB</span>Corollary: angles in the <b>same segment</b> are equal. And the crown jewel: an angle in a <b>semicircle is always 90°</b> — because the central angle is 180°.`,rem:"Centre = 2 × rim (same arc). Semicircle angle = 90°, no exceptions, forever.",ex:"<b>∠AOB = 120°</b> → C on the rim, same arc → ∠ACB = <b>60°</b>. Every single time."}],
measure:[
 {t:"Fencing & Flooring",b:`<b>Perimeter</b> = boundary = fencing/cost of border. <b>Area</b> = surface = flooring/painting/cost of field.<span class="fx">Rectangle: P = 2(l + b), A = l × b<br>Triangle: A = ½ × base × height<br>Circle: P = 2πr, A = πr²</span>Read word problems like a landlord: boundary money → perimeter, carpet money → area.`,rem:"Fence → perimeter. Paint/tile/grass → area. Half the exam is just knowing which.",ex:"<b>Field 30 m × 20 m</b>: fence = 2(30+20) = <b>100 m</b>. Grass at ₹5/m²: 600 × 5 = <b>₹3000</b>."},
 {t:"Heron's Formula",b:`No height? No problem. With sides a, b, c compute the semi-perimeter, then:<span class="fx">s = (a + b + c)/2<br>A = √( s(s−a)(s−b)(s−c) )</span>Heron's gift: area from three sides alone — the surveyor's spell of the Measurelands.`,rem:"s is HALF the perimeter. Subtract each side from s — multiply all four factors — square-root.",ex:"<b>13, 14, 15</b>: s = 21 → A = √(21·8·7·6) = √7056 = <b>84 units²</b>."},
 {t:"Same Border, Different Kingdoms",b:`Figures with <b>equal perimeters can hold wildly different areas</b> — and equal areas can demand very different fences. A 10×10 square: P = 40, A = 100. A 4×16 rectangle: P = 40, A = 64. The square is the greedy shape.<span class="fx">Square wins the area contest at fixed perimeter</span>`,rem:"Perimeter ≠ area. Never compare one using the other.",ex:"<b>Two plots, same 44 m fence</b>: 11×11 square → 121 m²; 4×18 → 72 m². Choose the square, farmer Dhruva."}],
chance:[
 {t:"Probability = Fair Counting",b:`For equally likely outcomes:<span class="fx">P(E) = favourable outcomes ÷ total outcomes</span>It lives between 0 (impossible) and 1 (certain). P(E) + P(not E) = <b>1</b> — always. Count carefully and the Kingdom cannot cheat you.`,rem:"0 ≤ P ≤ 1. Not 50%, not 200% — a fraction of the whole. And P + P̄ = 1.",ex:"<b>Die: P(prime) = 3/6 = ½</b> — primes {2,3,5}. Fatespinner nods."},
 {t:"One Die, Many Questions",b:`A fair die: 6 faces, each probability 1/6.<span class="fx">P(even) = 3/6 · P(>4) = 2/6 · P(≤6) = 1</span>Events can overlap — P(3 or even) counts 3 once, not twice: 3 + 3 − 1 = 5 outcomes → 5/6.`,rem:"'Or' means count the union once. Overlaps get subtracted.",ex:"<b>P(not 6) = 5/6</b> — the complement trick: 1 − 1/6. Fastest spell in the Kingdom."},
 {t:"Two Coins & The Sample Space",b:`Toss two coins — the sample space is <b>HH, HT, TH, TT</b>: four worlds, equally likely. HT and TH are different worlds!<span class="fx">P(exactly one head) = 2/4 = ½<br>P(at least one head) = 3/4</span>Write the space, count honestly, win.`,rem:"Two coins ≠ one coin twice the same. HT and TH are separate citizens.",ex:"<b>P(same face) = 2/4 = ½</b> — only HH and TT agree with themselves."}],
pattern:[
 {t:"Arithmetic Progressions: The Staircase",b:`Each step adds the same <b>d</b>.<span class="fx">a, a+d, a+2d, …<br>aₙ = a + (n−1)d</span>First term a, common difference d — that's the whole DNA. Term 50 = a + 49d. Count the jumps, not the posts.`,rem:"aₙ = a + (n−1)d — the (n−1) is the classic trap. 10th term = a + 9d.",ex:"<b>3, 7, 11, …</b>: a = 3, d = 4 → a₁₀ = 3 + 9(4) = <b>39</b>. No listing needed."},
 {t:"Geometric Progressions: The Ladder",b:`Each step <b>multiplies by r</b>.<span class="fx">a, ar, ar², ar³, …<br>aₙ = a·rⁿ⁻¹</span>Powers explode upward (r > 1), fade to nothing (0 < r < 1) — rice on the chessboard, bacteria in the dish, the Phantom's spiral.`,rem:"GP position = exponent + 1. 3rd term carries r².",ex:"<b>2, 6, 18, …</b>: r = 3 → a₅ = 2·3⁴ = <b>162</b>. Five steps, 81× growth."},
 {t:"Sums & The Clever Gauss",b:`AP sum, twice:<span class="fx">Sₙ = n/2 [2a + (n−1)d] = n/2 (first + last)</span>Little Gauss summed 1…100 instantly: pair 1+100, 2+99… = 50 pairs × 101 = 5050. Pairing is the heart of the formula.`,rem:"Sₙ = (number of terms) × (mean of first & last). The mean does the lifting.",ex:"<b>Sum of 2, 5, 8, …, 30 terms</b>: S = 15(2·2 + 29·3) = 15 × 91 = <b>1365</b>."}]
};
/* ============ WIDGETS ============ */
const WIDGETS={
coord(box,w){
  box.innerHTML=`<div class="wk-title">Tap the sea — plant Dhruva's flag</div>
  <svg id="wg-grid" viewBox="0 0 220 220" style="width:100%;max-width:300px;display:block;margin:0 auto;cursor:crosshair">
   <rect width="220" height="220" fill="var(--bg1)" rx="10"/>
   <g stroke="var(--line2)">${[0,1,2,3,4].map(i=>`<line x1="${20+i*45}" y1="10" x2="${20+i*45}" y2="210"/><line x1="10" y1="${20+i*45}" x2="210" y2="${20+i*45}"/>`).join("")}</g>
   <line x1="110" y1="10" x2="110" y2="210" stroke="var(--text2)" stroke-width="1.6"/>
   <line x1="10" y1="110" x2="210" y2="110" stroke="var(--text2)" stroke-width="1.6"/>
   <text x="202" y="106" font-size="9" fill="var(--muted)">x</text><text x="114" y="18" font-size="9" fill="var(--muted)">y</text>
   <g id="wg-flag" opacity="0"><line x1="0" y1="0" x2="0" y2="-14" stroke="var(--gold)" stroke-width="2.5"/><path d="M0 -14 L11 -10.5 L0 -7Z" fill="var(--gold)"/><circle r="3.4" fill="var(--gold)"/></g>
  </svg>
  <div class="wrow" style="justify-content:center;margin-top:10px"><span class="wstat" id="wg-read">tap a point…</span></div>`;
  const svg=$("#wg-grid",box),flag=$("#wg-flag",box),read=$("#wg-read",box);
  svg.addEventListener("click",e=>{
    const r=svg.getBoundingClientRect(),pt=svg.createSVGPoint();pt.x=(e.clientX-r.left)*220/r.width;pt.y=(e.clientY-r.top)*220/r.height;
    const p=pt.matrixTransform(svg.getScreenCTM().inverse());
    const gx=Math.round((p.x-20)/45),gy=-Math.round((p.y-20)/45);
    if(Math.abs(gx)>2||Math.abs(gy)>2)return;
    flag.setAttribute("transform",`translate(${20+gx*45},${20-gy*45})`);flag.setAttribute("opacity","1");
    const q=gx>0?(gy>0?"I":"IV"):(gy>0?"II":"III");
    read.innerHTML=`P(${gx}, ${gy}) · Quadrant ${gx===0||gy===0?"axis":q}`;SFX.tap();
  });
},
linear(box){
  box.innerHTML=`<div class="wk-title">Bend the line to your will</div>
  <svg id="wg-lin" viewBox="0 0 240 240" style="width:100%;max-width:280px;display:block;margin:0 auto">
   <rect width="240" height="240" fill="var(--bg1)" rx="10"/>
   <g stroke="var(--line2)">${Array.from({length:11},(_,i)=>`<line x1="${20+i*20}" y1="10" x2="${20+i*20}" y2="230" opacity=".5"/><line x1="10" y1="${20+i*20}" x2="230" y2="${20+i*20}" opacity=".5"/>`).join("")}</g>
   <line x1="120" y1="10" x2="120" y2="230" stroke="var(--text2)" stroke-width="1.6"/><line x1="10" y1="120" x2="230" y2="120" stroke="var(--text2)" stroke-width="1.6"/>
   <line id="wg-line" x1="10" y1="120" x2="230" y2="120" stroke="var(--gold)" stroke-width="3.4" stroke-linecap="round"/>
  </svg>
  <div class="wrow" style="justify-content:center;margin-top:8px">
   <label style="font-size:.8rem;font-weight:700">m <input type="range" id="wg-m" min="-4" max="4" value="1" step="1" style="width:110px"></label>
   <label style="font-size:.8rem;font-weight:700">c <input type="range" id="wg-c" min="-8" max="8" value="0" step="1" style="width:110px"></label>
   <span class="wstat" id="wg-eq">y = 1x + 0</span></div>`;
  const draw=()=>{const m=+$("#wg-m",box).value,c=+$("#wg-c",box).value,l=$("#wg-line",box);
    const y=v=>120-c*10-v*m*10;l.setAttribute("x1",10);l.setAttribute("y1",Math.max(8,Math.min(232,y(-5.5))));
    l.setAttribute("x2",230);l.setAttribute("y2",Math.max(8,Math.min(232,y(5.5))));
    $("#wg-eq",box).textContent=`y = ${m}x ${c<0?"−":"+"} ${Math.abs(c)}`;SFX.tap()};
  $("#wg-m",box).oninput=draw;$("#wg-c",box).oninput=draw;
},
number(box){
  box.innerHTML=`<div class="wk-title">Walk the infinite line</div>
  <input type="range" min="-300" max="300" value="41" id="wg-nl" style="width:100%">
  <svg viewBox="0 0 320 54" style="width:100%;margin-top:6px"><line x1="10" y1="27" x2="310" y2="27" stroke="var(--line2)" stroke-width="2"/>
  ${Array.from({length:13},(_,i)=>{const x=10+i*25;return `<line x1="${x}" y1="${i%5?21:16}" x2="${x}" y2="${i%5?33:38}" stroke="var(--muted)" stroke-width="1.4"/><text x="${x}" y="50" font-size="8.5" fill="var(--muted)" text-anchor="middle">${i-6}</text>`}).join("")}
  <g id="wg-pin"><circle cx="160" cy="27" r="6.5" fill="var(--gold)"/><path d="M160 12 L160 20" stroke="var(--gold)" stroke-width="2.4"/></g></svg>
  <div class="wrow" style="justify-content:center;margin-top:8px"><span class="wstat" id="wg-nv">1.41</span><span class="wstat" id="wg-nt">≈ √2 — irrational!</span></div>`;
  const facts=[[1.414,"≈ √2 — irrational!"],[1.5,"3/2 — rational"],[""],[""]];
  const upd=()=>{const v=(+$("#wg-nl",box).value)/100;$("#wg-pin",box).setAttribute("transform",`translate(${(v+6.2)*25-2},0)`);
    $("#wg-nv",box).textContent=v.toFixed(2);
    let t="a rational citizen";
    if(Math.abs(v-1.41)<.05)t="≈ √2 — irrational rebel";
    if(Math.abs(v-3.14)<.06)t="≈ π — the famous irrational";
    if(Math.abs(v-Math.round(v))<.02)t="an integer";
    if(Math.abs(v-0.5)<.03||Math.abs(v+0.5)<.03)t="a unit fraction";
    $("#wg-nt",box).textContent=t};
  $("#wg-nl",box).oninput=upd;upd();
},
identity(box){
  box.innerHTML=`<div class="wk-title">The area model — see the identity</div>
  <svg viewBox="0 0 240 240" style="width:100%;max-width:270px;display:block;margin:0 auto">
   <rect width="240" height="240" fill="var(--bg1)" rx="10"/>
   <g id="wg-areas">
    <rect id="wa" x="20" y="20" width="120" height="120" fill="var(--goldsoft)" stroke="var(--gold)" stroke-width="1.6"/>
    <rect id="wab1" x="140" y="20" width="80" height="120" fill="rgba(143,183,207,.16)" stroke="var(--info)" stroke-width="1.4"/>
    <rect id="wab2" x="20" y="140" width="120" height="80" fill="rgba(143,183,207,.16)" stroke="var(--info)" stroke-width="1.4"/>
    <rect id="wb" x="140" y="140" width="80" height="80" fill="rgba(99,199,143,.16)" stroke="var(--good)" stroke-width="1.4"/>
   </g>
   <text id="wt1" x="80" y="86" font-size="15" fill="var(--gold2)" text-anchor="middle" font-weight="800">a²</text>
   <text id="wt2" x="180" y="86" font-size="13" fill="var(--info)" text-anchor="middle" font-weight="800">ab</text>
   <text id="wt3" x="80" y="186" font-size="13" fill="var(--info)" text-anchor="middle" font-weight="800">ab</text>
   <text id="wt4" x="180" y="186" font-size="15" fill="var(--good)" text-anchor="middle" font-weight="800">b²</text></svg>
  <div class="wrow" style="justify-content:center;margin-top:8px">
   <label style="font-size:.8rem;font-weight:700">a <input type="range" id="wg-a" min="2" max="7" value="4" style="width:100px"></label>
   <label style="font-size:.8rem;font-weight:700">b <input type="range" id="wg-b" min="1" max="5" value="2" style="width:100px"></label>
   <span class="wstat" id="wg-id">(a+b)² = 36</span></div>`;
  const upd=()=>{const a=+$("#wg-a",box).value,b=+$("#wg-b",box).value,sc=180/(a+b);
    $("#wa",box).setAttribute("width",a*sc);$("#wa",box).setAttribute("height",a*sc);
    $("#wab1",box).setAttribute("x",20+a*sc);$("#wab1",box).setAttribute("width",b*sc);$("#wab1",box).setAttribute("height",a*sc);
    $("#wab2",box).setAttribute("y",20+a*sc);$("#wab2",box).setAttribute("width",a*sc);$("#wab2",box).setAttribute("height",b*sc);
    $("#wb",box).setAttribute("x",20+a*sc);$("#wb",box).setAttribute("y",20+a*sc);$("#wb",box).setAttribute("width",b*sc);$("#wb",box).setAttribute("height",b*sc);
    $("#wt1",box).setAttribute("x",20+a*sc/2);$("#wt1",box).setAttribute("y",20+a*sc/2+6);
    $("#wt2",box).setAttribute("x",20+a*sc+b*sc/2);$("#wt2",box).setAttribute("y",20+a*sc/2+6);
    $("#wt3",box).setAttribute("x",20+a*sc/2);$("#wt3",box).setAttribute("y",20+a*sc+b*sc/2+6);
    $("#wt4",box).setAttribute("x",20+a*sc+b*sc/2);$("#wt4",box).setAttribute("y",20+a*sc+b*sc/2+6);
    $("#wg-id",box).textContent=`a²+2ab+b² = ${a*a}+${2*a*b}+${b*b} = ${a*a+2*a*b+b*b}`;SFX.tap()};
  $("#wg-a",box).oninput=upd;$("#wg-b",box).oninput=upd;upd();
},
circle(box){
  box.innerHTML=`<div class="wk-title">Command the radius</div>
  <svg viewBox="0 0 220 150" style="width:100%;max-width:290px;display:block;margin:0 auto">
   <rect width="220" height="150" fill="var(--bg1)" rx="10"/>
   <circle cx="110" cy="75" id="wg-circ" r="50" fill="var(--goldsoft)" stroke="var(--gold)" stroke-width="2.6"/>
   <line id="wg-rad" x1="110" y1="75" x2="160" y2="75" stroke="var(--bad)" stroke-width="2.6" stroke-dasharray="4 3"/>
   <circle cx="110" cy="75" r="3.4" fill="var(--text2)"/><text id="wg-rl" x="135" y="68" font-size="11" fill="var(--bad)" font-weight="700" text-anchor="middle">r</text></svg>
  <input type="range" min="15" max="52" value="30" id="wg-r" style="width:100%;margin-top:8px">
  <div class="wrow" style="justify-content:center;margin-top:8px">
   <span class="wstat"><small>radius</small><span id="wg-vr">30</span></span>
   <span class="wstat"><small>circumference</small><span id="wg-vc">188</span></span>
   <span class="wstat"><small>area</small><span id="wg-va">2827</span></span></div>`;
  const upd=()=>{const r=+$("#wg-r",box).value;$("#wg-circ",box).setAttribute("r",r);
    $("#wg-rad",box).setAttribute("x2",110+ +r);
    $("#wg-rl",box).setAttribute("x",110+r/2+6);
    $("#wg-vr",box).textContent=r;$("#wg-vc",box).textContent=(2*Math.PI*r).toFixed(1);$("#wg-va",box).textContent=(Math.PI*r*r).toFixed(1)};
  $("#wg-r",box).oninput=upd;upd();
},
measure(box){
  box.innerHTML=`<div class="wk-title">Survey your own field</div>
  <svg viewBox="0 0 220 160" style="width:100%;max-width:290px;display:block;margin:0 auto">
   <rect width="220" height="160" fill="var(--bg1)" rx="10"/>
   <rect id="wm-rect" x="45" y="25" width="130" height="90" fill="var(--goldsoft)" stroke="var(--gold)" stroke-width="2.4"/>
   <text id="wm-l" x="110" y="133" font-size="12" fill="var(--text2)" text-anchor="middle" font-weight="700">l</text>
   <text id="wm-b" x="36" y="74" font-size="12" fill="var(--text2)" text-anchor="middle" font-weight="700">b</text></svg>
  <div class="wrow" style="justify-content:center;margin-top:8px">
   <label style="font-size:.8rem;font-weight:700">l <input type="range" id="wm-lr" min="20" max="130" value="90" style="width:100px"></label>
   <label style="font-size:.8rem;font-weight:700">b <input type="range" id="wm-br" min="15" max="100" value="60" style="width:100px"></label>
   <span class="wstat" id="wm-out">P = 300 · A = 5400</span></div>`;
  const upd=()=>{const l=+$("#wm-lr",box).value,b=+$("#wm-br",box).value,r=$("#wm-rect",box);
    r.setAttribute("width",l);r.setAttribute("height",b*0.9);r.setAttribute("y",115-b*0.9);
    $("#wm-l",box).setAttribute("x",45+l/2);$("#wm-b",box).setAttribute("y",115-b*0.45+4);
    $("#wm-out",box).textContent=`P = ${2*(l+b)} · A = ${l*b}`};
  $("#wm-lr",box).oninput=upd;$("#wm-br",box).oninput=upd;upd();
},
chance(box){
  box.innerHTML=`<div class="wk-title">Spin the Wheel of Maybe</div>
  <svg viewBox="0 0 220 150" style="width:100%;max-width:280px;display:block;margin:0 auto">
   <rect width="220" height="150" fill="var(--bg1)" rx="10"/>
   <g id="wc-wheel" transform="translate(110,78)"></g>
   <circle r="4" fill="var(--text2)"/><line id="wc-needle" x1="0" y1="0" x2="0" y2="-62" stroke="var(--text)" stroke-width="3.4" stroke-linecap="round"/></svg>
  <div class="wrow" style="justify-content:center;margin-top:8px">
   <button class="btn btn-soft btn-sm" id="wc-spin">Spin!</button>
   <span class="wstat" id="wc-out">P(red) = 3/8 · P(blue) = 2/8 · P(green) = 3/8</span></div>`;
  const cols=[["var(--bad)",3],["var(--info)",2],["var(--good)",3]];let tot=0,arcs=[];
  cols.forEach(([c,n],i)=>{for(let k=0;k<n;k++){const a0=tot/8*2*Math.PI,a1=(tot+1)/8*2*Math.PI;tot++;
    arcs.push(`<path d="M0 0 L${66*Math.cos(a0)} ${66*Math.sin(a0)} A66 66 0 0 1 ${66*Math.cos(a1)} ${66*Math.sin(a1)}Z" fill="${c}" opacity="${.24+k*.12}" stroke="var(--bg1)" stroke-width="1.4"/>`)}});
  $("#wc-wheel",box).innerHTML=arcs.join("");
  $("#wc-spin",box).onclick=()=>{const rot=1080+rng(360);$("#wc-wheel",box).style.transition="transform 1.1s cubic-bezier(.2,.8,.3,1)";
    $("#wc-wheel",box).style.transform=`rotate(${rot}deg)`;$("#wc-needle",box).style.transform="rotate(0)";
    setTimeout(()=>{$("#wc-wheel",box).style.transition="";$("#wc-wheel",box).style.transform="";SFX.good()},1150);SFX.tap()};
},
pattern(box){
  box.innerHTML=`<div class="wk-title">Climb the spire — guess the next floor</div>
  <svg id="wp-svg" viewBox="0 0 260 130" style="width:100%;display:block;margin:0 auto"><rect width="260" height="130" fill="var(--bg1)" rx="10"/><g id="wp-g"></g></svg>
  <div class="wrow" style="justify-content:center;margin-top:8px">
   <button class="btn btn-soft btn-sm" id="wp-next">Next term →</button>
   <button class="btn btn-ghost btn-sm" id="wp-reset">↺</button>
   <span class="wstat" id="wp-seq">3, 6, 10, 15</span></div>`;
  const tri=n=>n*(n+1)/2;let k=4;
  const draw=()=>{const g=$("#wp-g",box);g.innerHTML="";
    for(let i=1;i<=k;i++){const dots=tri(i),cx=34+(i-1)*46;
      g.innerHTML+=`<circle cx="${cx}" cy="112" r="2.6" fill="var(--line2)"/><text x="${cx}" y="126" font-size="8" fill="var(--muted)" text-anchor="middle">t${i}</text>`;
      for(let d=0;d<dots;d++){const row=Math.floor((Math.sqrt(8*d+1)-1)/2),pos=d-row*(row+1)/2;
        const x=cx+(pos-row/2)*13,y=100-row*13;
        g.innerHTML+=`<circle cx="${x}" cy="${y}" r="4.6" fill="var(--gold)" opacity="${.45+.1*i}"/>`}}
    $("#wp-seq",box).textContent=Array.from({length:k},(_,i)=>tri(i+1)).join(", ")};
  $("#wp-next",box).onclick=()=>{k=Math.min(5,k+1);draw();SFX.tap()};
  $("#wp-reset",box).onclick=()=>{k=4;draw();SFX.tap()};draw();
}
};
</script>
