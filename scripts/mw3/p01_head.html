<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maths War — Grade 9 Concept Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --ink:#26243a; --sub:#6d6a85; --card:#ffffff; --line:#e9e5f0;
  --gold:#b8860b; --deep:#14112b; --r:18px;
  --sh1:0 8px 24px rgba(38,36,58,.07); --sh2:0 16px 44px rgba(38,36,58,.12);
  --ac:#6366f1; --acsoft:#e0e7ff; --acink:#4338ca; --acdeep:#312e81;
  --fd:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fb:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15.5px;line-height:1.55;min-height:100vh;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
#bg::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(38,36,58,.05) 1px,transparent 1px);background-size:26px 26px}
#bg::after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(90px);opacity:.35;background:radial-gradient(circle,var(--acsoft),transparent 65%);top:-160px;right:-120px}
h1,h2,h3,h4{font-family:var(--fd);letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid rgba(99,102,241,.4);outline-offset:2px;border-radius:10px}
.muted{color:var(--sub)} .mt{margin-top:14px}
.wrap{max-width:1060px;margin:0 auto;padding:22px 20px 90px}
.wrap-n{max-width:840px;margin:0 auto;padding:22px 20px 90px}
/* ---------- topbar ---------- */
#tb{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.tb-in{max-width:1060px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 20px}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:none;padding:2px}
.logo-badge{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#312e81,#6d28d9);display:grid;place-items:center;box-shadow:0 4px 14px rgba(67,56,202,.35);flex:none}
.logo-t{font-family:var(--fd);font-weight:800;font-size:17px;letter-spacing:.02em;line-height:1.05;color:var(--ink);text-align:left}
.logo-t small{display:block;font-weight:600;font-size:10px;color:var(--sub);letter-spacing:.14em}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.lvl-chip{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#fef3c7,#fde68a);border:1px solid #f59e0b33;border-radius:999px;padding:5px 12px 5px 6px;box-shadow:inset 0 1px 0 #fff8}
.lvl-chip .av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#a855f7);display:grid;place-items:center;font-size:13px;color:#fff;font-weight:700;flex:none}
.lvl-chip b{font-family:var(--fd);font-size:12.5px;color:#78350f}
.lvl-chip span{font-size:10.5px;color:#92400e;display:block;line-height:1}
.xpwrap{width:150px}
.xpbar{height:9px;border-radius:99px;background:#e9e5f0;overflow:hidden;box-shadow:inset 0 1px 2px rgba(38,36,58,.12)}
.xpfill{height:100%;border-radius:99px;background:linear-gradient(90deg,#6366f1,#a855f7,#ec4899);transition:width .6s cubic-bezier(.22,1,.36,1);box-shadow:0 0 8px rgba(168,85,247,.5)}
.xplab{font-size:10px;font-weight:700;color:var(--sub);margin-top:3px;text-align:right;letter-spacing:.04em}
.ico-btn{width:36px;height:36px;border-radius:11px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:15px;box-shadow:var(--sh1);transition:transform .15s}
.ico-btn:hover{transform:translateY(-2px)}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--fd);font-weight:700;font-size:14.5px;border-radius:14px;padding:11px 20px;transition:transform .16s cubic-bezier(.34,1.56,.64,1),box-shadow .16s,background .16s;border:1.5px solid transparent;user-select:none;text-decoration:none}
.btn:active{transform:scale(.96)}
.btn-p{background:linear-gradient(135deg,var(--ac),var(--acink));color:#fff;box-shadow:0 6px 18px rgba(99,102,241,.35)}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(99,102,241,.45)}
.btn-g{background:var(--card);border-color:var(--line);color:var(--ink);box-shadow:var(--sh1)}
.btn-g:hover{transform:translateY(-2px)}
.btn-s{background:var(--acsoft);color:var(--acink)}
.btn-s:hover{transform:translateY(-2px)}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:11px}
.btn-xl{padding:15px 30px;font-size:16.5px;border-radius:16px}
.btn-gold{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;box-shadow:0 6px 18px rgba(217,119,6,.4)}
.btn-red{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 6px 18px rgba(220,38,38,.4)}
.btn[disabled]{opacity:.5;pointer-events:none}
/* ---------- home ---------- */
.hero{text-align:center;padding:34px 10px 8px;animation:fadeUp .6s both}
.hero-kick{display:inline-flex;align-items:center;gap:8px;background:var(--acsoft);color:var(--acink);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;border-radius:99px;padding:7px 16px}
.hero-t{font-size:clamp(38px,7vw,58px);font-weight:900;line-height:1.02;margin:14px 0 8px;background:linear-gradient(100deg,#312e81 10%,#6d28d9 45%,#be185d 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-sub{max-width:580px;margin:0 auto;color:var(--sub);font-size:15.5px}
.hero-cta{margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.hero-stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.stat-pill{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 20px;box-shadow:var(--sh1);text-align:center;min-width:118px}
.stat-pill b{display:block;font-family:var(--fd);font-size:22px;color:var(--acink)}
.stat-pill span{font-size:11px;color:var(--sub);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.free-note{margin:26px auto 6px;max-width:720px;background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:1px solid #6ee7b755;border-radius:16px;padding:13px 18px;font-size:13.5px;color:#065f46;display:flex;gap:10px;align-items:center;animation:fadeUp .7s both}
.sect-h{display:flex;align-items:baseline;gap:12px;margin:34px 0 16px}
.sect-h h2{font-size:22px;font-weight:800}
.sect-h span{font-size:12.5px;color:var(--sub);font-weight:600}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.wcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--sh1);cursor:pointer;transition:transform .2s cubic-bezier(.34,1.4,.64,1),box-shadow .2s;overflow:hidden;animation:fadeUp .5s both;text-align:left;width:100%;display:block}
.wcard:hover{transform:translateY(-5px);box-shadow:var(--sh2)}
.wcard::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--ac),var(--acsoft))}
.wicon{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--acsoft),#fff);border:1px solid var(--line);display:grid;place-items:center;font-size:23px;margin-bottom:12px}
.wname{font-family:var(--fd);font-weight:800;font-size:16.5px;color:var(--ink)}
.wtag{font-size:12.5px;color:var(--sub);margin:3px 0 12px;min-height:34px}
.wmeta{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;font-weight:700;color:var(--sub)}
.wmeta .cov{color:#059669}
.ring{--p:0;width:38px;height:38px;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--p)*1%),#eee9f4 0);display:grid;place-items:center;flex:none}
.ring::before{content:attr(data-t);width:28px;height:28px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:9.5px;font-weight:800;color:var(--acink)}
/* ---------- world page ---------- */
.whead{position:relative;border-radius:24px;overflow:hidden;background:linear-gradient(130deg,var(--acdeep),var(--ac));color:#fff;padding:30px 28px 26px;box-shadow:var(--sh2);animation:fadeUp .5s both}
.whead::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1.2px,transparent 1.2px);background-size:22px 22px;opacity:.4}
.whead-in{position:relative;z-index:1}
.wkick{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:4px 13px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.whead h1{font-size:clamp(26px,4.5vw,38px);font-weight:900;margin:10px 0 4px}
.whead p{opacity:.9;font-size:14px;max-width:560px}
.backrow{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.bossband{margin-top:16px;background:linear-gradient(120deg,#1c1836,#312a5c 55%,#1c1836);border-radius:20px;padding:18px 20px;display:flex;align-items:center;gap:16px;color:#fff;box-shadow:var(--sh2);position:relative;overflow:hidden}
.bossband::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(168,85,247,.35),transparent 70%);right:-60px;top:-60px;animation:aura 4s ease-in-out infinite}
.bossband-in{position:relative;z-index:1;display:flex;align-items:center;gap:16px;width:100%;flex-wrap:wrap}
.boss-mini{width:64px;height:64px;flex:none;animation:floaty 3.4s ease-in-out infinite}
.bossband h3{font-size:18px;font-weight:800;letter-spacing:.03em}
.bossband p{font-size:12.5px;opacity:.85}
.bossband .btn{margin-left:auto}
.clist{display:flex;flex-direction:column;gap:11px;margin-top:18px}
.crow{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px 18px;box-shadow:var(--sh1);transition:transform .18s,box-shadow .18s;animation:fadeUp .5s both}
.crow:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.cnum{width:42px;height:42px;border-radius:13px;background:var(--acsoft);color:var(--acink);display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:15px;flex:none}
.crow.done .cnum{background:#d1fae5;color:#047857}
.cinfo{flex:1;min-width:0}
.ct{font-family:var(--fd);font-weight:700;font-size:15.5px;color:var(--ink)}
.csub{font-size:12px;color:var(--sub);margin-top:1px}
.state-pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.05em;border-radius:99px;padding:3px 10px;text-transform:uppercase;margin-top:6px}
.st-new{background:#f1eef8;color:#6d6a85}
.st-prog{background:#fef3c7;color:#92400e}
.st-done{background:#d1fae5;color:#047857}
.cbtns{display:flex;gap:8px;flex:none}
/* ---------- lesson ---------- */
.les-head{margin-bottom:18px}
.crumbs{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub);font-weight:600;margin-bottom:10px;flex-wrap:wrap}
.crumbs b{color:var(--acink)}
.les-t{font-size:clamp(24px,4vw,34px);font-weight:900;line-height:1.1}
.les-sub{color:var(--sub);font-size:13.5px;margin-top:4px}
.steps{display:flex;gap:6px;margin:20px 0 22px;flex-wrap:wrap}
.sdot{flex:1;min-width:90px;text-align:center;padding:9px 6px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--sub);text-transform:uppercase;cursor:pointer;transition:all .2s;position:relative}
.sdot.on{border-color:var(--ac);color:var(--acink);background:var(--acsoft);box-shadow:0 4px 14px rgba(99,102,241,.25)}
.sdot.done{border-color:#6ee7b7;color:#047857;background:#ecfdf5}
.sdot.done::after{content:"✓";position:absolute;top:-6px;right:-4px;background:#059669;color:#fff;width:16px;height:16px;border-radius:50%;font-size:9px;display:grid;place-items:center}
.stepcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:var(--sh1);animation:fadeUp .45s both}
.step-kick{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--acink);background:var(--acsoft);border-radius:99px;padding:5px 13px}
.step-t{font-size:22px;font-weight:800;margin:12px 0 6px}
.hcard .hs{font-size:16.5px;line-height:1.7;color:#3f3c58}
.hcard .hw{margin-top:16px;background:linear-gradient(135deg,var(--acsoft),#fff);border:1px dashed rgba(99,102,241,.4);border-radius:14px;padding:13px 16px;font-size:14px;color:var(--acdeep)}
.hicon{font-size:44px;line-height:1;margin-bottom:10px;animation:floaty 3s ease-in-out infinite;display:inline-block}
.facts{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.fact{display:flex;gap:14px;background:linear-gradient(135deg,#fbfaff,#fff);border:1px solid var(--line);border-radius:16px;padding:16px 18px;animation:fadeUp .5s both}
.fact-n{width:30px;height:30px;border-radius:10px;background:var(--acsoft);color:var(--acink);display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:13px;flex:none;margin-top:2px}
.fact-t{font-family:var(--fd);font-weight:700;font-size:15px}
.fact-d{font-size:14px;color:#4b4862;margin-top:3px;line-height:1.6}
.fact b,.hs b,.why b,.exb b{color:var(--acink)}
/* ---------- lab ---------- */
.labwrap{border:1.5px solid rgba(99,102,241,.3);border-radius:20px;overflow:hidden;background:#fff}
.lab-head{display:flex;align-items:center;gap:10px;background:linear-gradient(120deg,var(--acsoft),#fff);padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.lab-head b{font-family:var(--fd);font-size:14.5px;color:var(--acdeep)}
.lab-head .hint-lab{font-size:11.5px;color:var(--sub);margin-left:auto;font-weight:600}
.labbox{padding:16px;display:grid;place-items:center;background:radial-gradient(circle at 50% 0%,#fbfaff,#f4f2fb);min-height:300px}
.labbox svg{max-width:100%;height:auto;display:block}
.labctl{padding:14px 18px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;background:#fff}
.ctlrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.slab{font-size:12.5px;font-weight:800;color:var(--acink);min-width:118px;display:flex;align-items:center;gap:6px}
.slab .val{background:var(--acsoft);border-radius:8px;padding:2px 9px;font-family:var(--fd);font-size:12.5px}
input[type=range]{flex:1;min-width:130px;accent-color:var(--ac);height:26px;cursor:pointer}
.tabs{display:flex;gap:7px;flex-wrap:wrap}
.tab{font-size:12px;font-weight:800;padding:7px 14px;border-radius:99px;background:#f1eef8;color:var(--sub);border:1.5px solid transparent;transition:all .15s}
.tab.on{background:var(--ac);color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.35)}
.taskchips{display:flex;flex-direction:column;gap:7px;margin-top:2px}
.tchip{display:flex;align-items:center;gap:9px;font-size:13px;background:#faf9fe;border:1px dashed var(--line);border-radius:12px;padding:9px 13px;color:#4b4862}
.tchip .tick{width:20px;height:20px;border-radius:50%;background:#e9e5f0;display:grid;place-items:center;font-size:11px;color:#fff;flex:none;transition:background .3s}
.tchip.ok{border-style:solid;border-color:#6ee7b7;background:#f0fdf9}
.tchip.ok .tick{background:#059669}
.labdone{align-self:flex-start}
.readout{font-family:var(--fd);font-weight:800;font-size:15px;color:var(--acdeep);background:var(--acsoft);border-radius:12px;padding:9px 15px;text-align:center}
/* ---------- example ---------- */
.exsteps{display:flex;flex-direction:column;gap:0;margin-top:8px}
.exstep{display:flex;gap:14px;opacity:0;transform:translateY(14px);animation:fadeUp .5s forwards}
.exstep .rail{display:flex;flex-direction:column;align-items:center}
.exstep .rail .nd{width:28px;height:28px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:12px;flex:none;box-shadow:0 3px 10px rgba(99,102,241,.4)}
.exstep .rail .ln{width:2px;flex:1;background:var(--acsoft);min-height:14px}
.exstep:last-child .rail .ln{display:none}
.exh{font-family:var(--fd);font-weight:700;font-size:14.5px;color:var(--acink);margin-top:4px}
.exb{font-size:14.5px;color:#3f3c58;line-height:1.65;padding-bottom:12px}
.exb .ans{display:inline-block;background:#ecfdf5;border:1.5px solid #6ee7b7;color:#047857;font-weight:800;border-radius:10px;padding:2px 12px;margin-top:6px}
/* ---------- quiz ---------- */
.quiz{max-width:640px;margin:0 auto}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh2);overflow:hidden;animation:cardIn .5s cubic-bezier(.22,1,.36,1) both}
.qribbon{display:flex;align-items:center;gap:10px;padding:12px 20px;background:linear-gradient(120deg,var(--acsoft),#fff);border-bottom:1px solid var(--line)}
.qribbon .qchip{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--ac);border-radius:99px;padding:3px 11px}
.qribbon .qmeta{font-size:12px;font-weight:700;color:var(--sub);margin-left:auto}
.qbody{padding:24px 24px 20px}
.qtext{font-family:var(--fd);font-weight:700;font-size:19px;line-height:1.5;margin-bottom:20px;color:var(--ink)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:13px;text-align:left;width:100%;background:#faf9fe;border:1.5px solid var(--line);border-radius:15px;padding:13px 16px;font-size:15px;font-weight:600;color:#3f3c58;transition:all .18s;animation:optIn .4s both}
.opt:hover{border-color:var(--ac);background:var(--acsoft);transform:translateX(4px)}
.opt .opt-l{width:30px;height:30px;border-radius:10px;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:13px;color:var(--sub);flex:none;transition:all .18s}
.opt.correct{background:#ecfdf5;border-color:#10b981;color:#065f46;animation:pop .45s}
.opt.correct .opt-l{background:#059669;border-color:#059669;color:#fff}
.opt.wrong{background:#fef2f2;border-color:#ef4444;color:#991b1b;animation:shake .45s}
.opt.wrong .opt-l{background:#ef4444;border-color:#ef4444;color:#fff}
.opt.dim{opacity:.45}
.opt[disabled]{pointer-events:none}
.why{margin-top:16px;background:linear-gradient(135deg,#f6f3ff,#fff);border:1px solid var(--line);border-left:4px solid var(--ac);border-radius:14px;padding:14px 17px;font-size:14px;color:#3f3c58;line-height:1.65;animation:fadeUp .4s both}
.why b{display:block;font-family:var(--fd);margin-bottom:3px}
.qfoot{display:flex;align-items:center;gap:10px;padding:0 24px 22px;flex-wrap:wrap}
.qdots{display:flex;gap:6px}
.qdot{width:26px;height:7px;border-radius:99px;background:#e9e5f0;transition:background .3s}
.qdot.ok{background:#10b981}.qdot.no{background:#ef4444}.qdot.cur{background:var(--ac);box-shadow:0 0 8px rgba(99,102,241,.5)}
.qscore{margin-left:auto;font-size:12.5px;font-weight:800;color:var(--sub)}
.qhint{font-size:12.5px;color:var(--acink);background:var(--acsoft);border-radius:10px;padding:8px 13px;margin-bottom:14px;display:none;animation:fadeUp .3s both}
.qhint.show{display:block}
/* ---------- overlays ---------- */
#ovl{position:fixed;inset:0;z-index:70;display:none;place-items:center;padding:20px}
#ovl.show{display:grid}
.ovl-bg{position:absolute;inset:0;background:rgba(20,17,43,.55);backdrop-filter:blur(6px);animation:fadeIn .3s both}
.ovl-in{position:relative;z-index:1;animation:cardIn .5s cubic-bezier(.22,1,.36,1) both;max-width:520px;width:100%;max-height:92vh;overflow:auto}
.covcard{background:linear-gradient(160deg,#fff,#f3efff);border-radius:26px;padding:34px 30px;text-align:center;box-shadow:var(--sh2);border:1px solid #e6dffa}

/* ---------- boss arena ---------- */
.arena{position:fixed;inset:0;z-index:80;background:radial-gradient(1100px 700px at 50% -8%,#2d2657,#16122e 55%,#0c0a1d);display:flex;flex-direction:column;animation:fadeIn .4s both;overflow-y:auto}

.bstage{display:grid;place-items:center;position:relative;padding:6px 0}

.bname{text-align:center;color:#fff}
.bname h2{font-size:24px;font-weight:900;letter-spacing:.06em}

.hpwrap{max-width:520px;margin:0 auto;width:100%}
.hplab{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:#b8b2d9;letter-spacing:.08em;margin-bottom:5px}
.hpbar{height:14px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;border:1px solid rgba(255,255,255,.15)}
.hpfill{height:100%;border-radius:99px;background:linear-gradient(90deg,#f43f5e,#fb7185);transition:width .5s cubic-bezier(.22,1,.36,1);box-shadow:0 0 12px rgba(244,63,94,.6)}
.hpfill.hero{background:linear-gradient(90deg,#22c55e,#4ade80);box-shadow:0 0 12px rgba(34,197,94,.5)}
.arena .qcard{background:linear-gradient(160deg,rgba(40,34,78,.94),rgba(24,20,48,.97));border-color:rgba(255,255,255,.12);box-shadow:0 22px 60px rgba(0,0,0,.55)}
.arena .qtext{color:#fff}
.arena .opt{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16);color:#e6e3f7}
.arena .opt:hover{border-color:#a78bfa;background:rgba(139,92,246,.15)}
.arena .opt .opt-l{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#c7c2e5}
.arena .opt.correct{background:rgba(16,185,129,.2);border-color:#34d399;color:#a7f3d0;animation:pop .45s}
.arena .opt.correct .opt-l{background:#10b981;border-color:#10b981;color:#fff}
.arena .opt.wrong{background:rgba(239,68,68,.2);border-color:#f87171;color:#fecaca;animation:shake .45s}
.arena .opt.wrong .opt-l{background:#ef4444;border-color:#ef4444;color:#fff}
.arena .why{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);border-left-color:#a78bfa;color:#d9d5f0}
.arena .qribbon{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1)}
.arena .qhint{background:rgba(139,92,246,.18);color:#d6cff5}
.arena .qribbon .qmeta,.arena .qscore{color:#b8b2d9}
.arena .qdot{background:rgba(255,255,255,.15)}
.fx-slash{position:absolute;width:130px;height:130px;pointer-events:none;animation:slash .5s ease-out forwards}
.fx-dmg{position:absolute;font-family:var(--fd);font-weight:900;font-size:30px;color:#fbbf24;text-shadow:0 2px 10px rgba(0,0,0,.6);pointer-events:none;animation:dmgUp 1s forwards}
.arena.shake{animation:shake .4s}
.boss-hurt{animation:hurt .45s}
.boss-dead{animation:die 1.2s forwards}
.viccard{background:linear-gradient(165deg,#fff,#fef3c7);border-radius:26px;padding:34px 30px;text-align:center;box-shadow:var(--sh2)}
.stars{font-size:34px;letter-spacing:6px;margin:8px 0 4px}
.stars .off{opacity:.22;filter:grayscale(1)}
/* ---------- toast & fx ---------- */
#toast{position:fixed;top:74px;left:50%;transform:translateX(-50%) translateY(-16px);z-index:90;background:var(--deep);color:#fff;font-family:var(--fd);font-weight:700;font-size:13.5px;border-radius:99px;padding:9px 20px;box-shadow:var(--sh2);opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.34,1.4,.64,1);max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#fx{position:fixed;inset:0;z-index:95;pointer-events:none}
/* ---------- misc ---------- */
.screen{animation:fadeUp .4s both}
hr.soft{border:none;border-top:1px solid var(--line);margin:20px 0}
kbd{font-family:var(--fb);background:#f1eef8;border:1px solid var(--line);border-bottom-width:2.5px;border-radius:7px;padding:1px 7px;font-size:12px;font-weight:700}
/* ---------- animations ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes cardIn{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes optIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes aura{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.25);opacity:1}}
@keyframes slash{0%{opacity:0;transform:rotate(-40deg) scale(.4)}25%{opacity:1}100%{opacity:0;transform:rotate(20deg) scale(1.5)}}
@keyframes dmgUp{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-46px)}}
@keyframes hurt{0%,100%{transform:translate(0)}25%{transform:translate(-9px,3px) rotate(-2deg)}50%{transform:translate(8px,-3px) rotate(2deg)}75%{transform:translate(-6px,2px)}}
@keyframes die{0%{opacity:1;transform:scale(1)}30%{transform:scale(1.1) rotate(-3deg);filter:brightness(2)}100%{opacity:0;transform:scale(.4) rotate(14deg) translateY(60px);filter:brightness(.3) blur(4px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
