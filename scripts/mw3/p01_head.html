<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maths War — Grade 9 Concept Arena · by VidhyaSaathy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* ---- VidhyaSaathy brand palette ---- */
  --navy-1:#041D3D; --navy-2:#193E69; --navy-3:#28517C; --blue:#517DAB; --softblue:#7698BE;
  --pale:#CCD8E1; --ice:#D6E2E6; --ivory:#F9F6EE; --brandink:#172A40;
  --gold:#C9962E; --goldhi:#E3AF3C; --goldsoft:#F7EBCF; --goldline:#E3C77E;
  /* ---- app tokens ---- */
  --bg:#F9F6EE; --ink:#172A40; --sub:#5E7891; --card:#ffffff; --line:#E3E0D4;
  --gold:#C9962E; --deep:#041D3D; --r:18px;
  --sh1:0 8px 24px rgba(23,42,64,.08); --sh2:0 16px 44px rgba(23,42,64,.14);
  --ac:#28517C; --acsoft:#E4EDF5; --acink:#28517C; --acdeep:#0C2D53;
  --fd:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fb:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15.5px;line-height:1.55;min-height:100vh;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
#bg::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(23,42,64,.06) 1px,transparent 1px);background-size:26px 26px}
#bg::after{content:"";position:absolute;width:560px;height:560px;border-radius:50%;filter:blur(95px);opacity:.5;background:radial-gradient(circle,#D6E2E6,transparent 65%);top:-160px;right:-120px}
h1,h2,h3,h4{font-family:var(--fd);letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid rgba(40,81,124,.4);outline-offset:2px;border-radius:10px}
.muted{color:var(--sub)} .mt{margin-top:14px}
.wrap{max-width:1060px;margin:0 auto;padding:22px 20px 90px}
.wrap-n{max-width:840px;margin:0 auto;padding:22px 20px 90px}
/* ---------- topbar ---------- */
#tb{position:sticky;top:0;z-index:40;background:rgba(249,246,238,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.tb-in{max-width:1060px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 20px}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:none;padding:2px}
.logo-badge{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 4px 14px rgba(23,42,64,.12);flex:none;overflow:hidden}
.logo-badge img{width:31px;height:31px;object-fit:contain;display:block}
.logo-t{font-family:var(--fd);font-weight:800;font-size:17px;letter-spacing:.02em;line-height:1.05;color:var(--ink);text-align:left}
.logo-t small{display:block;font-weight:700;font-size:9.5px;color:var(--gold);letter-spacing:.16em}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.lvl-chip{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#F7EBCF,#F2DFAE);border:1px solid #E3C77E;border-radius:999px;padding:5px 12px 5px 6px;box-shadow:inset 0 1px 0 #fff8}
.lvl-chip .av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#193E69,#517DAB);display:grid;place-items:center;font-size:13px;color:#fff;font-weight:700;flex:none}
.lvl-chip b{font-family:var(--fd);font-size:12.5px;color:#6B4E0E}
.lvl-chip span{font-size:10.5px;color:#8A6508;display:block;line-height:1}
.xpwrap{width:150px}
.xpbar{height:9px;border-radius:99px;background:#E7E3D6;overflow:hidden;box-shadow:inset 0 1px 2px rgba(23,42,64,.12)}
.xpfill{height:100%;border-radius:99px;background:linear-gradient(90deg,#C9962E,#E3AF3C);transition:width .6s cubic-bezier(.22,1,.36,1);box-shadow:0 0 8px rgba(227,175,60,.55)}
.xplab{font-size:10px;font-weight:700;color:var(--sub);margin-top:3px;text-align:right;letter-spacing:.04em}
.ico-btn{width:36px;height:36px;border-radius:11px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:15px;box-shadow:var(--sh1);transition:transform .15s}
.ico-btn:hover{transform:translateY(-2px)}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--fd);font-weight:700;font-size:14.5px;border-radius:14px;padding:11px 20px;transition:transform .16s cubic-bezier(.34,1.56,.64,1),box-shadow .16s,background .16s;border:1.5px solid transparent;user-select:none;text-decoration:none}
.btn:active{transform:scale(.96)}
.btn-p{background:linear-gradient(135deg,#193E69,#28517C);color:#fff;box-shadow:0 6px 18px rgba(25,62,105,.35)}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(25,62,105,.45)}
.btn-g{background:var(--card);border-color:var(--line);color:var(--ink);box-shadow:var(--sh1)}
.btn-g:hover{transform:translateY(-2px)}
.btn-s{background:var(--acsoft);color:var(--acdeep)}
.btn-s:hover{transform:translateY(-2px)}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:11px}
.btn-xl{padding:15px 30px;font-size:16.5px;border-radius:16px}
.btn-gold{background:linear-gradient(135deg,#E3AF3C,#C08A2D);color:#fff;box-shadow:0 6px 18px rgba(192,138,45,.42)}
.btn-red{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 6px 18px rgba(220,38,38,.4)}
.btn[disabled]{opacity:.5;pointer-events:none}
/* ---------- home ---------- */
.hero{text-align:center;padding:30px 10px 8px;animation:fadeUp .6s both}
.hero-logo{width:min(300px,62vw);height:auto;border-radius:24px;box-shadow:0 22px 50px rgba(4,29,61,.22),0 4px 14px rgba(4,29,61,.12);margin:0 auto 6px;display:block;animation:fadeUp .7s both}
.brandline{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.22em;color:var(--gold);text-transform:uppercase;margin-bottom:8px}
.brandline .st{color:var(--goldhi);font-size:13px}
.hero-kick{display:inline-flex;align-items:center;gap:8px;background:#0C2D53;color:#F2D57E;font-weight:700;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:7px 16px;box-shadow:0 6px 16px rgba(4,29,61,.25)}
.hero-t{font-size:clamp(38px,7vw,58px);font-weight:900;line-height:1.02;margin:14px 0 8px;background:linear-gradient(100deg,#041D3D 5%,#28517C 42%,#517DAB 72%,#C9962E 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-sub{max-width:600px;margin:0 auto;color:var(--sub);font-size:15.5px}
.hero-cta{margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.hero-stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.stat-pill{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 20px;box-shadow:var(--sh1);text-align:center;min-width:118px}
.stat-pill b{display:block;font-family:var(--fd);font-size:22px;color:var(--navy-3)}
.stat-pill span{font-size:11px;color:var(--sub);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.free-note{margin:26px auto 6px;max-width:720px;background:linear-gradient(135deg,#EDF4F9,#DCE8EF);border:1px solid rgba(81,125,171,.4);border-radius:16px;padding:13px 18px;font-size:13.5px;color:#193E69;display:flex;gap:10px;align-items:center;animation:fadeUp .7s both}
.loopband{max-width:900px;margin:20px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.loopstep{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;box-shadow:var(--sh1)}
.loopstep .ln{display:flex;align-items:center;gap:9px;font-family:var(--fd);font-weight:800;font-size:13.5px;color:var(--navy-2)}
.loopstep .ln i{font-style:normal;width:26px;height:26px;border-radius:9px;background:var(--goldsoft);color:#8A6508;display:grid;place-items:center;font-size:12.5px;flex:none}
.loopstep p{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.5}
.sect-h{display:flex;align-items:baseline;gap:12px;margin:34px 0 16px}
.sect-h h2{font-size:22px;font-weight:800}
.sect-h span{font-size:12.5px;color:var(--sub);font-weight:600}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.wcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--sh1);cursor:pointer;transition:transform .2s cubic-bezier(.34,1.4,.64,1),box-shadow .2s;overflow:hidden;animation:fadeUp .5s both;text-align:left;width:100%;display:block}
.wcard:hover{transform:translateY(-5px);box-shadow:var(--sh2)}
.wcard::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--ac),var(--goldhi))}
.wicon{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--acsoft),#fff);border:1px solid var(--line);display:grid;place-items:center;font-size:23px;margin-bottom:12px}
.wname{font-family:var(--fd);font-weight:800;font-size:16.5px;color:var(--ink)}
.wtag{font-size:12.5px;color:var(--sub);margin:3px 0 12px;min-height:34px}
.wmeta{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;font-weight:700;color:var(--sub)}
.wmeta .cov{color:#1D6E50}
.ring{--p:0;width:38px;height:38px;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--p)*1%),#E7E3D6 0);display:grid;place-items:center;flex:none}
.ring::before{content:attr(data-t);width:28px;height:28px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:9.5px;font-weight:800;color:var(--acdeep)}
/* ---------- world page ---------- */
.whead{position:relative;border-radius:24px;overflow:hidden;background:linear-gradient(130deg,#041D3D 0%,#193E69 52%,#28517C 100%);color:#fff;padding:30px 28px 26px;box-shadow:var(--sh2);animation:fadeUp .5s both}
.whead::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1.2px,transparent 1.2px);background-size:22px 22px;opacity:.4}
.whead::before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(227,175,60,.28),transparent 70%);right:-70px;top:-90px}
.whead-in{position:relative;z-index:1}
.wkick{display:inline-block;background:rgba(227,175,60,.16);border:1px solid rgba(227,175,60,.45);color:#F2D57E;border-radius:99px;padding:4px 13px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.whead h1{font-size:clamp(26px,4.5vw,38px);font-weight:900;margin:10px 0 4px}
.whead p{opacity:.92;font-size:14px;max-width:560px}
.backrow{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.bossband{margin-top:16px;background:linear-gradient(120deg,#041D3D,#193E69 55%,#041D3D);border-radius:20px;padding:18px 20px;display:flex;align-items:center;gap:16px;color:#fff;box-shadow:var(--sh2);position:relative;overflow:hidden}
.bossband::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(227,175,60,.3),transparent 70%);right:-60px;top:-60px;animation:aura 4s ease-in-out infinite}
.bossband-in{position:relative;z-index:1;display:flex;align-items:center;gap:16px;width:100%;flex-wrap:wrap}
.boss-mini{width:64px;height:64px;flex:none;animation:floaty 3.4s ease-in-out infinite}
.bossband h3{font-size:18px;font-weight:800;letter-spacing:.03em}
.bossband p{font-size:12.5px;opacity:.85}
.bossband .btn{margin-left:auto}
.clist{display:flex;flex-direction:column;gap:11px;margin-top:18px}
.crow{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px 18px;box-shadow:var(--sh1);transition:transform .18s,box-shadow .18s;animation:fadeUp .5s both}
.crow:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.cnum{width:42px;height:42px;border-radius:13px;background:var(--acsoft);color:var(--acdeep);display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:15px;flex:none}
.crow.done .cnum{background:#DFF0E7;color:#1D6E50}
.cinfo{flex:1;min-width:0}
.ct{font-family:var(--fd);font-weight:700;font-size:15.5px;color:var(--ink)}
.csub{font-size:12px;color:var(--sub);margin-top:1px}
.state-pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.05em;border-radius:99px;padding:3px 10px;text-transform:uppercase;margin-top:6px}
.st-new{background:#EEF1F4;color:#5E7891}
.st-prog{background:#F7EBCF;color:#8A6508}
.st-done{background:#DFF0E7;color:#1D6E50}
.cbtns{display:flex;gap:8px;flex:none}
/* ---------- lesson ---------- */
.les-head{margin-bottom:18px}
.crumbs{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub);font-weight:600;margin-bottom:10px;flex-wrap:wrap}
.crumbs b{color:var(--navy-3)}
.les-t{font-size:clamp(24px,4vw,34px);font-weight:900;line-height:1.1}
.les-sub{color:var(--sub);font-size:13.5px;margin-top:4px}
.steps{display:flex;gap:6px;margin:20px 0 22px;flex-wrap:wrap}
.sdot{flex:1;min-width:90px;text-align:center;padding:9px 6px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--sub);text-transform:uppercase;cursor:pointer;transition:all .2s;position:relative}
.sdot.on{border-color:var(--goldhi);color:#8A6508;background:var(--goldsoft);box-shadow:0 4px 14px rgba(227,175,60,.3)}
.sdot.done{border-color:#7FC8A4;color:#1D6E50;background:#EDF7F1}
.sdot.done::after{content:"✓";position:absolute;top:-6px;right:-4px;background:#1D6E50;color:#fff;width:16px;height:16px;border-radius:50%;font-size:9px;display:grid;place-items:center}
.stepcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:var(--sh1);animation:fadeUp .45s both}
.step-kick{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8A6508;background:var(--goldsoft);border-radius:99px;padding:5px 13px}
.step-t{font-size:22px;font-weight:800;margin:12px 0 6px}
.hcard .hs{font-size:16.5px;line-height:1.7;color:#2C4258}
.hcard .hw{margin-top:16px;background:linear-gradient(135deg,#EDF4F9,#fff);border:1px dashed rgba(40,81,124,.45);border-radius:14px;padding:13px 16px;font-size:14px;color:var(--navy-2)}
.hicon{font-size:44px;line-height:1;margin-bottom:10px;animation:floaty 3s ease-in-out infinite;display:inline-block}
.facts{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.fact{display:flex;gap:14px;background:linear-gradient(135deg,#FBFAF6,#fff);border:1px solid var(--line);border-radius:16px;padding:16px 18px;animation:fadeUp .5s both}
.fact-n{width:30px;height:30px;border-radius:10px;background:var(--acsoft);color:var(--acdeep);display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:13px;flex:none;margin-top:2px}
.fact-t{font-family:var(--fd);font-weight:700;font-size:15px}
.fact-d{font-size:14px;color:#3A5068;margin-top:3px;line-height:1.6}
.fact b,.hs b,.why b,.exb b{color:var(--navy-3)}
/* ---------- real-world radar ---------- */
.irl-card{margin-top:18px;background:linear-gradient(135deg,#F7EBCF,#FDF9F0 60%,#F2E3C2);border:1px solid var(--goldline);border-radius:18px;padding:17px 19px;animation:fadeUp .55s both}
.irl-kick{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8A6508;margin-bottom:11px}
.irl-row{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.75);border:1px solid #EFDFAE;border-radius:12px;padding:10px 13px;font-size:13.5px;color:#5C4A14;line-height:1.55}
.irl-row + .irl-row{margin-top:8px}
.irl-row .iri{flex:none;font-size:15px;margin-top:1px}
.irl-row b{color:#6B4E0E}
/* ---------- lab ---------- */
.labwrap{border:1.5px solid rgba(40,81,124,.35);border-radius:20px;overflow:hidden;background:#fff}
.lab-head{display:flex;align-items:center;gap:10px;background:linear-gradient(120deg,#EDF4F9,#fff);padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.lab-head b{font-family:var(--fd);font-size:14.5px;color:var(--navy-2)}
.lab-head .hint-lab{font-size:11.5px;color:var(--sub);margin-left:auto;font-weight:600}
.labbox{padding:16px;display:grid;place-items:center;background:radial-gradient(circle at 50% 0%,#FBFCF7,#F1F4EF);min-height:300px}
.labbox svg{max-width:100%;height:auto;display:block}
.labctl{padding:14px 18px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;background:#fff}
.ctlrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.slab{font-size:12.5px;font-weight:800;color:var(--navy-3);min-width:118px;display:flex;align-items:center;gap:6px}
.slab .val{background:var(--acsoft);border-radius:8px;padding:2px 9px;font-family:var(--fd);font-size:12.5px}
input[type=range]{flex:1;min-width:130px;accent-color:var(--goldhi);height:26px;cursor:pointer}
.tabs{display:flex;gap:7px;flex-wrap:wrap}
.tab{font-size:12px;font-weight:800;padding:7px 14px;border-radius:99px;background:#EEF1F4;color:var(--sub);border:1.5px solid transparent;transition:all .15s}
.tab.on{background:var(--navy-3);color:#fff;box-shadow:0 4px 12px rgba(40,81,124,.35)}
.taskchips{display:flex;flex-direction:column;gap:7px;margin-top:2px}
.tchip{display:flex;align-items:center;gap:9px;font-size:13px;background:#FBFAF6;border:1px dashed var(--line);border-radius:12px;padding:9px 13px;color:#3A5068}
.tchip .tick{width:20px;height:20px;border-radius:50%;background:#E7E3D6;display:grid;place-items:center;font-size:11px;color:#fff;flex:none;transition:background .3s}
.tchip.ok{border-style:solid;border-color:#7FC8A4;background:#F0FAF4}
.tchip.ok .tick{background:#1D6E50}
.labdone{align-self:flex-start}
.readout{font-family:var(--fd);font-weight:800;font-size:15px;color:var(--navy-2);background:var(--acsoft);border-radius:12px;padding:9px 15px;text-align:center}
/* ---------- example ---------- */
.exsteps{display:flex;flex-direction:column;gap:0;margin-top:8px}
.exstep{display:flex;gap:14px;opacity:0;transform:translateY(14px);animation:fadeUp .5s forwards}
.exstep .rail{display:flex;flex-direction:column;align-items:center}
.exstep .rail .nd{width:28px;height:28px;border-radius:50%;background:var(--navy-3);color:#fff;display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:12px;flex:none;box-shadow:0 3px 10px rgba(40,81,124,.4)}
.exstep .rail .ln{width:2px;flex:1;background:var(--acsoft);min-height:14px}
.exstep:last-child .rail .ln{display:none}
.exh{font-family:var(--fd);font-weight:700;font-size:14.5px;color:var(--navy-3);margin-top:4px}
.exb{font-size:14.5px;color:#2C4258;line-height:1.65;padding-bottom:12px}
.exb .ans{display:inline-block;background:#EDF7F1;border:1.5px solid #7FC8A4;color:#1D6E50;font-weight:800;border-radius:10px;padding:2px 12px;margin-top:6px}
/* ---------- quiz ---------- */
.quiz{max-width:640px;margin:0 auto}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh2);overflow:hidden;animation:cardIn .5s cubic-bezier(.22,1,.36,1) both}
.qribbon{display:flex;align-items:center;gap:10px;padding:12px 20px;background:linear-gradient(120deg,#F7EBCF,#FDF6E7);border-bottom:1px solid #F0E3C0}
.qribbon .qchip{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,#193E69,#28517C);border-radius:99px;padding:3px 11px}
.qribbon .qmeta{font-size:12px;font-weight:700;color:var(--sub);margin-left:auto}
.qbody{padding:24px 24px 20px}
