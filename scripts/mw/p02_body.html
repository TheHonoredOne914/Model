<body>
<div id="app"><div id="stage">
  <div id="hud">
    <div class="hud-left">
      <button class="btn-home" id="hud-home" title="World map">🗺️</button>
      <div><div class="w-title" id="hud-title">Maths War</div><div class="w-sub" id="hud-sub">Class 9 · Mission Zone</div></div>
    </div>
    <div class="hud-right">
      <div class="pill xp"><span class="ico">⚡</span><span id="hud-xp">0</span> XP</div>
      <div class="pill streak"><span class="ico" id="streak-ico">🔥</span><span id="hud-streak">0</span></div>
      <div class="lvl-badge"><b id="hud-lvl">1</b><span id="hud-rank">ROOKIE</span></div>
      <button class="btn-ico" id="btn-sound" title="Sound">🔊</button>
    </div>
  </div>
  <div id="scr-holder" style="position:relative;flex:1;min-height:0"></div>
</div></div>
<div id="modal-wrap"><div class="modal" id="modal-box"></div></div>
<div id="toast-wrap"></div>
<canvas id="confetti-cv"></canvas>
