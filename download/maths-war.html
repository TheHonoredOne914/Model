<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Maths War — Learn Without Knowing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF6EF; --panel:#FFFFFF; --ink:#2B2438; --ink2:#6B6478; --line:#E9E2D5;
  --teal:#2FB8A0; --teal-d:#1E8C79; --teal-soft:#DFF5F0;
  --amber:#FFAF3C; --amber-d:#D98A1B; --amber-soft:#FFF1DA;
  --coral:#FF7B6B; --coral-d:#E05544; --coral-soft:#FFE6E2;
  --sky:#5EB8FF; --sky-soft:#E3F1FF;
  --grape:#9B7BDE; --grape-soft:#EFE9FB;
  --leaf:#7BC86C; --leaf-soft:#E9F7E5;
  --sh:0 2px 6px rgba(43,36,56,.06),0 10px 28px rgba(43,36,56,.09);
  --sh-sm:0 2px 5px rgba(43,36,56,.08);
  --r:18px; --r-lg:26px;
  --f-head:'Baloo 2','Nunito',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--f-body); color:var(--ink); background:var(--paper);
  background-image:radial-gradient(rgba(43,36,56,.05) 1.1px, transparent 1.1px);
  background-size:22px 22px; overflow:hidden; user-select:none;
}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center}
#stage{position:relative;width:100%;max-width:1020px;height:100%;display:flex;flex-direction:column;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;opacity:0;pointer-events:none;transform:translateY(14px) scale(.995);transition:opacity .32s ease,transform .32s cubic-bezier(.2,.9,.3,1.2)}
.screen.on{opacity:1;pointer-events:auto;transform:none}
.scrolly{overflow-y:auto;overflow-x:hidden;flex:1;scrollbar-width:thin;scrollbar-color:#d8d0c2 transparent}
.scrolly::-webkit-scrollbar{width:8px}.scrolly::-webkit-scrollbar-thumb{background:#d8d0c2;border-radius:8px}
h1,h2,h3,h4,.head{font-family:var(--f-head)}
.center{text-align:center}

/* ============ TOP BAR / HUD ============ */
#hud{display:none;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);border-bottom:1.5px solid var(--line);z-index:40}
#hud.on{display:flex}
.hud-left{display:flex;align-items:center;gap:9px;min-width:0}
.btn-home{width:40px;height:40px;border-radius:13px;border:none;background:var(--teal-soft);color:var(--teal-d);font-size:19px;cursor:pointer;display:grid;place-items:center;transition:transform .15s;flex:none}
.btn-home:hover{transform:scale(1.08)}
.w-title{font-family:var(--f-head);font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-sub{font-size:11px;color:var(--ink2);margin-top:-2px}
.hud-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill{display:flex;align-items:center;gap:6px;background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:800;font-size:13.5px;box-shadow:var(--sh-sm)}
.pill .ico{font-size:14px}
.pill.xp{background:var(--amber-soft);border-color:#F5D9A8;color:var(--amber-d)}
.pill.streak{background:var(--coral-soft);border-color:#F6C4BC;color:var(--coral-d)}
.lvl-badge{display:flex;flex-direction:column;align-items:center;background:var(--ink);color:#fff;border-radius:12px;padding:4px 10px;line-height:1}
.lvl-badge b{font-family:var(--f-head);font-size:14px}
.lvl-badge span{font-size:8.5px;opacity:.75;letter-spacing:.4px}
.btn-ico{width:38px;height:38px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);font-size:16px;cursor:pointer;transition:transform .15s;display:grid;place-items:center}
.btn-ico:hover{transform:scale(1.07)}

/* ============ BUTTONS ============ */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:9px;font-family:var(--f-head);font-weight:700;font-size:16.5px;color:#fff;background:var(--teal);border:none;border-radius:16px;padding:13px 26px;cursor:pointer;box-shadow:0 4px 0 var(--teal-d),0 8px 18px rgba(31,140,121,.25);transition:transform .12s,box-shadow .12s,filter .15s;letter-spacing:.2px}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--teal-d)}
.btn.amber{background:var(--amber);box-shadow:0 4px 0 var(--amber-d),0 8px 18px rgba(217,138,27,.25)}
.btn.amber:active{box-shadow:0 1px 0 var(--amber-d)}
.btn.coral{background:var(--coral);box-shadow:0 4px 0 var(--coral-d),0 8px 18px rgba(224,85,68,.25)}
.btn.coral:active{box-shadow:0 1px 0 var(--coral-d)}
.btn.sky{background:var(--sky);box-shadow:0 4px 0 #3C8FD6,0 8px 18px rgba(94,184,255,.3)}
.btn.grape{background:var(--grape);box-shadow:0 4px 0 #7A59BE,0 8px 18px rgba(155,123,222,.3)}
.btn.ghost{background:var(--panel);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.ghost:active{box-shadow:0 0 0 var(--line)}
.btn.sm{font-size:14px;padding:9px 18px;border-radius:13px}
.btn.lg{font-size:19px;padding:16px 34px;border-radius:20px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn .em{font-size:1.15em}

/* ============ GENERIC CARDS ============ */
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--teal-soft);color:var(--teal-d);font-weight:800;font-size:12.5px;border-radius:999px;padding:6px 13px;border:1.5px solid rgba(47,184,160,.25)}
.chip.a{background:var(--amber-soft);color:var(--amber-d);border-color:rgba(255,175,60,.3)}
.chip.c{background:var(--coral-soft);color:var(--coral-d);border-color:rgba(255,123,107,.3)}
.chip.s{background:var(--sky-soft);color:#2F7CC0;border-color:rgba(94,184,255,.35)}
.chip.g{background:var(--grape-soft);color:#7452B8;border-color:rgba(155,123,222,.35)}

/* ============ TITLE SCREEN ============ */
#scr-title{align-items:center;justify-content:center;gap:0;background:linear-gradient(180deg,#EAF7F4 0%,var(--paper) 55%)}
.title-sun{position:absolute;top:-140px;right:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,#FFE9C2 0%,#FFDDA8 45%,transparent 70%);opacity:.8;pointer-events:none}
.title-math{position:absolute;font-family:var(--f-head);font-weight:800;color:var(--ink);opacity:.07;pointer-events:none;user-select:none}
.logo-war{position:relative;text-align:center;z-index:2;animation:logoIn .8s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes logoIn{from{opacity:0;transform:translateY(26px) scale(.9)}to{opacity:1;transform:none}}
.logo-war .l1{font-family:var(--f-head);font-weight:800;font-size:clamp(46px,9vw,84px);line-height:.95;color:var(--ink);letter-spacing:-1px}
.logo-war .l1 .m{color:var(--teal)}
.logo-war .l2{display:inline-block;font-family:var(--f-head);font-weight:800;font-size:clamp(40px,8vw,72px);color:#fff;background:var(--coral);padding:2px 26px 8px;border-radius:20px;transform:rotate(-2.5deg);box-shadow:0 6px 0 var(--coral-d),0 14px 30px rgba(224,85,68,.35);margin-top:6px;animation:wob 3.2s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(1.6deg) translateY(-3px)}}
.tagline{margin-top:18px;font-size:16px;color:var(--ink2);font-weight:700;z-index:2}
.tagline b{color:var(--teal-d)}
.title-actions{margin-top:34px;display:flex;flex-direction:column;align-items:center;gap:13px;z-index:2}
.hero-stage{position:relative;width:min(300px,60vw);margin-top:8px;z-index:2}
.hero-float{animation:hfloat 3.4s ease-in-out infinite}
@keyframes hfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.hero-shadow{width:56%;height:14px;background:rgba(43,36,56,.14);border-radius:50%;margin:-4px auto 0;filter:blur(3px);animation:hshad 3.4s ease-in-out infinite}
@keyframes hshad{0%,100%{transform:scaleX(1);opacity:.85}50%{transform:scaleX(.8);opacity:.6}}

/* ============ MODAL / POPUP ============ */
#modal-wrap{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(43,36,56,.42);backdrop-filter:blur(3px)}
#modal-wrap.on{display:flex}
.modal{background:var(--panel);border-radius:var(--r-lg);max-width:560px;width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(43,36,56,.35);animation:popIn .34s cubic-bezier(.2,.9,.3,1.35) both;overflow:hidden;position:relative}
@keyframes popIn{from{opacity:0;transform:scale(.86) translateY(20px)}to{opacity:1;transform:none}}
.modal-body{padding:16px 24px;overflow-y:auto;flex:1}
.modal-foot{padding:14px 24px 20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.modal-x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:11px;border:none;background:#F2EDE3;color:var(--ink2);font-size:15px;cursor:pointer;z-index:2}

/* debrief modal */
.deb-ribbon{background:linear-gradient(120deg,var(--teal),#39C9AE);color:#fff;font-family:var(--f-head);font-weight:800;text-align:center;font-size:19px;padding:16px;letter-spacing:.4px}
.deb-ribbon.gold{background:linear-gradient(120deg,var(--amber),#FFC35E);color:#5B3A00}
.deb-ribbon.grape{background:linear-gradient(120deg,var(--grape),#B295EC)}
.concept-line{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 4px}

/* ============ MAP ============ */
#scr-map{background:linear-gradient(180deg,#D8F1F3 0%,#E8F6F2 40%,var(--paper) 100%)}
.map-top{padding:14px 20px 4px;text-align:center}
.map-top h2{font-size:24px;font-weight:800}
.map-top p{color:var(--ink2);font-size:13.5px;font-weight:600}
.map-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 14px 12px}
#map-svg{width:100%;height:100%;max-width:1020px;max-height:100%;display:block}
.isle{cursor:pointer;transition:transform .25s cubic-bezier(.2,.9,.3,1.4);transform-box:fill-box;transform-origin:center}
.isle:hover{transform:scale(1.06)}
.isle.locked{cursor:not-allowed;opacity:.55}
.isle.locked:hover{transform:none}
.isle .name{font-family:var(--f-head);font-weight:800;fill:var(--ink);font-size:15px;text-anchor:middle}
.isle .stars{font-size:13px;text-anchor:middle;letter-spacing:2px}
.isle.selected .halo{animation:haloPulse 1.1s ease-out infinite}
@keyframes haloPulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}
.coach-finger{animation:tapTap 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tapTap{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.wave{animation:waveMove 7s linear infinite}
@keyframes waveMove{to{stroke-dashoffset:-88}}
.boat{animation:boatBob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes boatBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}

/* ============ WORLD HUB ============ */
.hub-hero{padding:20px 22px 6px;display:flex;gap:16px;align-items:center}
.hub-icon{width:74px;height:74px;flex:none;border-radius:22px;display:grid;place-items:center;font-size:38px;box-shadow:var(--sh);border:2px solid rgba(255,255,255,.6)}
.hub-title h2{font-size:25px;font-weight:800;line-height:1.05}
.hub-title .sub{color:var(--ink2);font-weight:700;font-size:13px;margin-top:2px}
.hub-story{margin:10px 22px 4px;background:var(--panel);border:1.5px dashed #DCD2BE;border-radius:var(--r);padding:14px 18px;font-size:14.5px;line-height:1.55;color:var(--ink);box-shadow:var(--sh-sm);position:relative}
.hub-story .q{position:absolute;top:-11px;left:16px;background:var(--coral);color:#fff;font-family:var(--f-head);font-weight:700;font-size:11px;padding:2px 11px;border-radius:999px;letter-spacing:.5px}
.missions{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:13px;padding:16px 22px 26px}
.mission{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:var(--r);padding:17px 16px 15px;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s;box-shadow:var(--sh-sm);text-align:left}
.mission:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.mission .m-ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:27px;margin-bottom:11px}
.mission h3{font-size:17.5px;font-weight:800}
.mission p{font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.45;font-weight:600}
.mission .m-go{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:10px;background:#F2EDE3;display:grid;place-items:center;font-size:14px;color:var(--ink2);transition:all .18s}
.mission:hover .m-go{background:var(--teal);color:#fff}
.mission .m-bar{margin-top:11px;height:7px;border-radius:99px;background:#F0EADD;overflow:hidden}
.mission .m-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),#5AD0B8);transition:width .5s ease}
.mission .m-stat{font-size:11.5px;color:var(--ink2);font-weight:800;margin-top:6px}
.mission.done{border-color:rgba(47,184,160,.5);background:linear-gradient(180deg,#F4FCF9,#fff)}
.howto{margin:0 22px 14px;display:flex;gap:10px;flex-wrap:wrap}
.howto .step{flex:1;min-width:140px;display:flex;align-items:center;gap:9px;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:9px 12px;font-size:12px;font-weight:800;color:var(--ink2)}
.howto .step b{width:24px;height:24px;flex:none;border-radius:8px;display:grid;place-items:center;color:#fff;font-family:var(--f-head)}

/* ============ THEATER (interactive video) ============ */
#scr-theater{background:linear-gradient(180deg,#1E2B3A 0%,#243447 100%)}
.th-top{display:flex;align-items:center;gap:12px;padding:12px 18px;color:#fff}
.th-top .t{font-family:var(--f-head);font-weight:700;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th-progress{display:flex;gap:5px}
.th-progress i{width:26px;height:6px;border-radius:99px;background:rgba(255,255,255,.18);transition:background .3s}
.th-progress i.did{background:var(--amber)}
.th-stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:4px 14px}
.th-svg-wrap{width:100%;height:auto;aspect-ratio:4/3;max-width:760px;max-height:100%;border-radius:22px;background:rgba(255,255,255,.97);box-shadow:0 18px 50px rgba(0,0,0,.35);overflow:hidden;position:relative}
.th-svg-wrap svg{width:100%;height:100%;display:block}
.th-bottom{padding:10px 18px 20px;display:flex;flex-direction:column;align-items:center;gap:12px}
.say{position:relative;max-width:640px;background:#fff;color:var(--ink);border-radius:18px;padding:15px 20px;font-size:16px;line-height:1.55;font-weight:600;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:sayIn .4s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes sayIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.say b{color:var(--teal-d)}
.say .who{position:absolute;top:-12px;left:16px;background:var(--amber);color:#4A2E00;font-family:var(--f-head);font-weight:800;font-size:11px;padding:3px 12px;border-radius:999px;letter-spacing:.5px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.th-ctrl{display:flex;gap:10px;align-items:center}
.pulse{animation:btnPulse 1.4s ease-in-out infinite}
@keyframes btnPulse{0%,100%{box-shadow:0 4px 0 var(--amber-d),0 0 0 0 rgba(255,175,60,.55)}50%{box-shadow:0 4px 0 var(--amber-d),0 0 0 14px rgba(255,175,60,0)}}
.th-hint{color:rgba(255,255,255,.75);font-size:12.5px;font-weight:700;letter-spacing:.3px}

/* theater svg anims */
.fadeUp{animation:fadeUp .55s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.pop-in{animation:popIn .45s cubic-bezier(.2,.9,.3,1.4) both}
.dash-draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.spin-slow{animation:spinz 9s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spinz{to{transform:rotate(360deg)}}
.glow-soft{filter:drop-shadow(0 0 8px rgba(255,190,80,.8))}
.floaty{animation:hfloat 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.wiggle{animation:wig 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes wig{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

/* ============ LAB ============ */
#scr-lab{background:linear-gradient(180deg,#FFFDF8,#F7F1E4)}
.lab-top{display:flex;align-items:center;gap:12px;padding:12px 18px 6px}
.lab-top h2{font-size:21px;font-weight:800;flex:1}
.lab-frame{flex:1;min-height:0;display:flex;gap:14px;padding:8px 18px 16px}
.lab-canvas{flex:1.6;min-width:0;background:#fff;border:1.5px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);position:relative;overflow:hidden}
.lab-canvas svg{width:100%;height:100%;display:block}
.lab-side{flex:1;min-width:230px;max-width:320px;display:flex;flex-direction:column;gap:11px;overflow-y:auto;padding-bottom:6px}
.lab-card{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r);padding:13px 15px;box-shadow:var(--sh-sm)}
.lab-card h4{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:7px}
.lab-card p{font-size:12.5px;color:var(--ink2);line-height:1.5;margin-top:3px;font-weight:600}
.slider-row{margin-top:9px}
.slider-row label{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;color:var(--ink2);margin-bottom:5px}
.slider-row label output{font-family:var(--f-head);color:var(--ink);font-size:13.5px;background:#F4EFE4;border-radius:7px;padding:1px 8px}
input[type=range]{width:100%;appearance:none;height:10px;border-radius:99px;background:#EDE6D6;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--teal);box-shadow:0 2px 8px rgba(0,0,0,.22);cursor:grab;transition:transform .12s}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.12)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--teal);box-shadow:0 2px 8px rgba(0,0,0,.22);cursor:grab}
.eq-live{font-family:var(--f-head);font-weight:800;font-size:17px;text-align:center;background:var(--ink);color:#FFF3DC;border-radius:13px;padding:10px;margin-top:4px;letter-spacing:.4px}
.eq-live .hl{color:var(--amber)}
.readout{display:flex;gap:8px;flex-wrap:wrap}
.readout .ro{flex:1;min-width:80px;background:#F8F4EA;border-radius:11px;padding:7px 10px;text-align:center}
.ro .v{font-family:var(--f-head);font-weight:800;font-size:17px}
.ro .k{font-size:10px;color:var(--ink2);font-weight:800;letter-spacing:.4px;text-transform:uppercase}
.milestone{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:var(--ink2);padding:7px 10px;border-radius:11px;background:#F8F4EA;transition:all .3s}
.milestone.hit{background:var(--leaf-soft);color:#3E7D33}
.milestone .tick{width:20px;height:20px;border-radius:50%;background:#E3DCCB;display:grid;place-items:center;font-size:11px;color:#fff;flex:none}
.milestone.hit .tick{background:var(--leaf)}

/* ============ PRACTICE ============ */
#scr-practice{background:linear-gradient(180deg,#F3FBF8,#FAF6EF)}
.pr-top{display:flex;align-items:center;gap:12px;padding:12px 18px 4px}
.pr-top h2{font-size:20px;font-weight:800;flex:1}
.pr-meta{display:flex;gap:8px;align-items:center}
.pr-wrap{flex:1;min-height:0;overflow-y:auto;padding:10px 18px 22px;display:flex;flex-direction:column;align-items:center;gap:13px}
.paper-note{display:flex;align-items:center;gap:11px;background:var(--amber-soft);border:1.5px solid #F2D9A6;border-radius:15px;padding:10px 16px;font-size:13.5px;font-weight:700;color:#7A5200;max-width:620px;width:100%;animation:sayIn .4s both}
.q-card{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);padding:22px 24px;max-width:620px;width:100%;position:relative;animation:sayIn .4s both}
.q-num{position:absolute;top:-13px;left:20px;background:var(--teal);color:#fff;font-family:var(--f-head);font-weight:800;font-size:12px;padding:3px 13px;border-radius:999px;letter-spacing:.5px;box-shadow:0 2px 6px rgba(31,140,121,.4)}
.q-text{font-size:18.5px;line-height:1.6;font-weight:700;font-family:var(--f-head)}
.q-fig{margin:14px auto 0;max-width:420px}
.q-fig svg{width:100%;height:auto}
.ans-row{display:flex;gap:10px;margin-top:17px;flex-wrap:wrap;justify-content:center}
.mcq-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:17px}
.mcq{background:#F8F4EA;border:2px solid transparent;border-radius:14px;padding:13px 14px;font-family:var(--f-head);font-weight:700;font-size:16px;cursor:pointer;transition:all .15s;text-align:center;color:var(--ink)}
.mcq:hover{border-color:var(--teal);background:var(--teal-soft);transform:translateY(-2px)}
.mcq.right{border-color:var(--leaf);background:var(--leaf-soft);color:#3E7D33;animation:okPop .45s cubic-bezier(.2,.9,.3,1.5)}
.mcq.wrong{border-color:var(--coral);background:var(--coral-soft);color:var(--coral-d);animation:shakeX .45s}
@keyframes okPop{0%{transform:scale(.92)}55%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shakeX{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.num-in{flex:1;min-width:150px;font-family:var(--f-head);font-size:19px;font-weight:800;text-align:center;padding:12px 14px;border:2.5px solid var(--line);border-radius:14px;background:#FDFBF6;color:var(--ink);outline:none;transition:border-color .2s}
.num-in:focus{border-color:var(--teal)}
.num-in.ok{border-color:var(--leaf);background:var(--leaf-soft);animation:okPop .45s}
.num-in.bad{border-color:var(--coral);background:var(--coral-soft);animation:shakeX .45s}
.fb{max-width:620px;width:100%;border-radius:var(--r);padding:14px 18px;display:none;animation:sayIn .35s both;font-size:14.5px;line-height:1.55;font-weight:700}
.fb.show{display:block}
.fb.good{background:var(--leaf-soft);border:1.5px solid #BFE3B4;color:#38682E}
.fb.bad{background:var(--coral-soft);border:1.5px solid #F4BDB4;color:#A63728}
.fb .big{font-family:var(--f-head);font-weight:800;font-size:17px;display:flex;gap:8px;align-items:center}
.steps-box{max-width:620px;width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);overflow:hidden;display:none}
.steps-box.show{display:block;animation:sayIn .4s both}
.steps-head{background:var(--ink);color:#fff;font-family:var(--f-head);font-weight:800;padding:11px 18px;font-size:14.5px;display:flex;align-items:center;gap:8px}
.step-line{display:flex;gap:12px;padding:13px 18px;border-top:1.5px dashed var(--line);animation:sayIn .4s both}
.step-line .n{width:26px;height:26px;flex:none;border-radius:9px;background:var(--teal-soft);color:var(--teal-d);font-family:var(--f-head);font-weight:800;font-size:13px;display:grid;place-items:center;margin-top:1px}
.step-line .t{font-weight:800;font-size:14px}
.step-line .d{font-size:13px;color:var(--ink2);line-height:1.55;margin-top:2px;font-weight:600}
.step-line .d b{color:var(--teal-d)}

/* ============ BOSS ============ */
#scr-boss{background:radial-gradient(1200px 500px at 50% -100px,#3A2B57 0%,#241B3B 45%,#1A1430 100%)}
.bs-top{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;color:#fff}
.bs-name{font-family:var(--f-head);font-weight:800;font-size:19px;letter-spacing:.5px;text-align:center}
.bs-tag{font-size:11px;color:#C9BCEC;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}
.hp-wrap{width:min(300px,38vw)}
.hp-label{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:#C9BCEC;margin-bottom:4px}
.hp-bar{height:13px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;border:1.5px solid rgba(255,255,255,.14)}
.hp-bar i{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.9,.3,1.2)}
.hp-boss i{background:linear-gradient(90deg,#FF6B5E,#FFB03C)}
.hp-me i{background:linear-gradient(90deg,#3ED5A3,#8BE9C8)}
.bs-arena{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:4vw;padding:0 20px;position:relative}
.fighter{position:relative;width:min(220px,26vw);text-align:center}
.fighter svg{width:100%;height:auto;overflow:visible}
.f-idle{animation:hfloat 3s ease-in-out infinite}
.fighter.hit{animation:hitShake .5s}
@keyframes hitShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-3deg)}45%{transform:translateX(9px) rotate(2deg)}70%{transform:translateX(-6px)}}
.fighter.attack{animation:lunge .55s cubic-bezier(.2,.9,.3,1.2)}
@keyframes lunge{0%{transform:translateX(0)}40%{transform:translateX(46px) scale(1.06)}100%{transform:translateX(0)}}
.fighter.fainted{opacity:.25;filter:grayscale(1);transform:rotate(12deg) translateY(14px);transition:all .8s}
.slash{position:absolute;font-size:54px;pointer-events:none;z-index:5;animation:slashGo .5s ease-out forwards}
@keyframes slashGo{0%{opacity:0;transform:scale(.4) rotate(-30deg)}30%{opacity:1;transform:scale(1.25) rotate(0)}100%{opacity:0;transform:scale(1.7) rotate(20deg)}}
.dmg-float{position:absolute;font-family:var(--f-head);font-weight:800;font-size:26px;color:#FFD34D;pointer-events:none;z-index:6;animation:dmgUp 1s ease-out forwards;text-shadow:0 2px 10px rgba(0,0,0,.4)}
@keyframes dmgUp{0%{opacity:0;transform:translateY(6px) scale(.7)}25%{opacity:1;transform:translateY(-8px) scale(1.15)}100%{opacity:0;transform:translateY(-52px) scale(1)}}
.bs-bottom{padding:8px 18px 20px;display:flex;flex-direction:column;align-items:center;gap:12px}
.bs-q{max-width:600px;background:#fff;color:var(--ink);border-radius:18px;padding:16px 22px;font-size:17px;font-weight:700;font-family:var(--f-head);line-height:1.55;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:sayIn .4s both}
.bs-timer{width:min(600px,90%);height:9px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.bs-timer i{display:block;height:100%;background:linear-gradient(90deg,#4DE0B8,#FFD34D);border-radius:99px;transition:width .25s linear}
.bs-timer i.danger{background:linear-gradient(90deg,#FF7B6B,#FF4D4D)}
.bs-answers{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.bs-answers .mcq{background:rgba(255,255,255,.94)}
.bs-vs{font-family:var(--f-head);font-weight:800;color:#FFD34D;font-size:22px;text-shadow:0 2px 12px rgba(255,211,77,.4)}

/* ============ TOAST / COACH / FX ============ */
#toast-wrap{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;font-weight:800;font-size:14px;border-radius:14px;padding:11px 20px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:toastIn .35s cubic-bezier(.2,.9,.3,1.3) both;display:flex;gap:8px;align-items:center;max-width:88vw}
.toast.gold{background:linear-gradient(120deg,#FFB63C,#FFCB63);color:#4A2E00}
@keyframes toastIn{from{opacity:0;transform:translateY(-16px) scale(.9)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .3s forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(-14px) scale(.92)}}
#confetti-cv{position:fixed;inset:0;pointer-events:none;z-index:110}
.coach-tip{position:absolute;z-index:80;background:var(--ink);color:#fff;padding:9px 15px;border-radius:13px;font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:sayIn .3s both;max-width:240px;text-align:center}
.coach-tip:after{content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border:8px solid transparent;border-top-color:var(--ink);border-bottom:0}
.coach-ring{position:relative}
.coach-ring:before{content:'';position:absolute;inset:-7px;border-radius:inherit;border:3px solid var(--amber);animation:coachP 1.2s ease-out infinite;pointer-events:none}
@keyframes coachP{0%{opacity:1;transform:scale(.95)}100%{opacity:0;transform:scale(1.18)}}

/* ============ INTRO / STORY SCREEN ============ */
#scr-intro{background:linear-gradient(180deg,#243447,#1B2735);align-items:center;justify-content:center}
.intro-card{background:var(--panel);border-radius:var(--r-lg);max-width:520px;width:92%;padding:28px 30px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.45);animation:popIn .5s cubic-bezier(.2,.9,.3,1.3) both}
.intro-kicker{font-size:11.5px;font-weight:800;letter-spacing:2px;color:var(--coral-d);text-transform:uppercase}
.intro-card h2{font-size:23px;margin:8px 0 12px}
.intro-card p{font-size:15px;line-height:1.65;color:var(--ink);font-weight:600}
.intro-card .say-mini{margin:14px 0;background:var(--teal-soft);border-radius:14px;padding:12px 16px;font-size:14.5px;font-weight:700;color:var(--teal-d);text-align:left}
.intro-dots{display:flex;gap:7px;justify-content:center;margin:18px 0 4px}
.intro-dots i{width:9px;height:9px;border-radius:50%;background:#E3DCCB;transition:all .3s}
.intro-dots i.on{background:var(--teal);transform:scale(1.25)}
.name-row{display:flex;gap:9px;margin-top:16px;justify-content:center}

/* math typography */
.mfrac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.1;font-weight:800}
.mfrac>span:first-child{border-bottom:2px solid currentColor;padding:0 4px}
.q-text sup,.say sup{font-size:.68em;vertical-align:super}

@media (max-width:760px){
  .lab-frame{flex-direction:column;overflow-y:auto}
  .lab-canvas{min-height:300px;flex:none;height:300px}
  .lab-side{max-width:none}
  .mcq-grid{grid-template-columns:1fr}
  .fighter{width:30vw}
  .missions{grid-template-columns:1fr 1fr}
  .howto{display:none}
  .w-sub{display:none}
}
@media (max-width:480px){ .missions{grid-template-columns:1fr} .q-text{font-size:16.5px} }
@media (max-width:640px){
  .w-title{display:none}
  .hud-right .pill{padding:4px 9px;font-size:12px}
  .lvl-badge{padding:3px 8px}
  .btn-home{width:36px;height:36px}
  .th-bottom .say{font-size:14.5px;padding:12px 15px}
  .bs-answers{gap:7px}
  .bs-answers .mcq{padding:10px 12px;font-size:14px}
}

<body>
<div id="app"><div id="stage">
  <div id="hud">
    <div class="hud-left">
      <button class="btn-home" id="hud-home" title="World map">🗺️</button>
      <div><div class="w-title" id="hud-title">Maths War</div><div class="w-sub" id="hud-sub">Class 9 · Mission Zone</div></div>
    </div>
    <div class="hud-right">
      <div class="pill xp"><span class="ico">⚡</span><span id="hud-xp">0</span> XP</div>
      <div class="pill streak"><span class="ico" id="streak-ico">🔥</span><span id="hud-streak">0</span></div>
      <div class="lvl-badge"><b id="hud-lvl">1</b><span id="hud-rank">ROOKIE</span></div>
      <button class="btn-ico" id="btn-sound" title="Sound">🔊</button>
    </div>
  </div>
  <div id="scr-holder" style="position:relative;flex:1;min-height:0"></div>
</div></div>
<div id="modal-wrap"><div class="modal" id="modal-box"></div></div>
<div id="toast-wrap"></div>
<canvas id="confetti-cv"></canvas>
<script>
/* ================================================================
   MATHS WAR — core engine: state, audio, fx, router, hud, modal
   ================================================================ */
'use strict';
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const rf=(a,b)=>Math.random()*(b-a)+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
const pad=n=>String(n).padStart(2,'0');
function sign(n){return n<0?`− ${Math.abs(n)}`:`+ ${Math.abs(n)}`}
function signed(n){return n<0?`−${Math.abs(n)}`:`${n}`}
function fracStr(a,b){const g=gcd(a,b);a/=g;b/=g;if(b===1)return `${a}`;if(b<0){a=-a;b=-b}return b===1?`${a}`:`<span class="mfrac"><span>${a}</span><span>${b}</span></span>`}
const SVGNS='http://www.w3.org/2000/svg';
function svgEl(tag,attrs={},parent){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}

/* ---------------- STATE ---------------- */
const RANKS=['ROOKIE','FIGHTER','WARRIOR','ACE','CAPTAIN','WARLORD','MATH TITAN','LEGEND'];
const SKEY='mathswar_v3';
const freshWorld=()=>({theater:false,lab:false,practice:0,boss:false,correct:0,attempt:0});
let S={xp:0,streak:0,best:0,sound:true,seenIntro:false,worlds:Array.from({length:8},freshWorld),coachDone:{}};
function save(){try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}}
function load(){
 try{
  const d=JSON.parse(localStorage.getItem(SKEY));
  if(d&&d.worlds){
   S=Object.assign(S,d);
   const src=Array.isArray(d.worlds)?d.worlds:Object.values(d.worlds);
   S.worlds=Array.from({length:8},(_,i)=>Object.assign(freshWorld(),src[i]||{}));
   if(!S.coachDone)S.coachDone={};
  }
 }catch(e){}
}
load();
function lvl(){return Math.min(8,Math.floor(S.xp/120)+1)}
function rank(){return RANKS[lvl()-1]}
function addXP(n,why){S.xp+=n;updateHUD();if(why)toast(`+${n} XP · ${why}`,'⚡');save()}
function bumpStreak(){S.streak++;S.best=Math.max(S.best,S.streak);updateHUD();save();const f=$('#streak-ico');if(f){f.classList.remove('bump');void f.offsetWidth;f.classList.add('bump')}}
function resetStreak(){S.streak=0;updateHUD();save()}

/* ---------------- AUDIO (tiny synth) ---------------- */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
function tone(f,t,dur,type='sine',vol=.16,delay=0){
  if(!S.sound)return;const c=ac();if(!c)return;
  const o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,c.currentTime+delay);
  g.gain.setValueAtTime(0,c.currentTime+delay);
  g.gain.linearRampToValueAtTime(vol,c.currentTime+delay+.015);
  g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+delay+dur);
  o.connect(g);g.connect(c.destination);o.start(c.currentTime+delay);o.stop(c.currentTime+delay+dur+.05);
}
const SFX={
  click(){tone(660,.06,.09,'triangle',.1)},
  tap(){tone(520,.06,.07,'sine',.09)},
  good(){tone(523,.12,.14,'sine',.14);tone(659,.12,.14,'sine',.14,.09);tone(784,.16,.22,'sine',.15,.18)},
  bad(){tone(196,.2,.25,'sawtooth',.1);tone(147,.2,.3,'sawtooth',.09,.08)},
  whoosh(){tone(300,.5,.18,'sine',.05);tone(900,.3,.1,'sine',.04,.03)},
  pop(){tone(880,.05,.08,'triangle',.12)},
  fanfare(){[523,659,784,1047].forEach((f,i)=>tone(f,.14,.34,'triangle',.14,i*.13));tone(1319,.3,.5,'sine',.12,.55)},
  hit(){tone(180,.08,.1,'square',.12);tone(90,.15,.16,'sawtooth',.1,.02)},
  swing(){tone(1200,.1,.06,'sine',.07);tone(400,.2,.1,'sawtooth',.05,.03)},
  level(){[392,494,587,784,988].forEach((f,i)=>tone(f,.13,.3,'sine',.13,i*.09))},
  tick(){tone(1000,.03,.04,'sine',.05)},
  slide(){tone(500,.08,.12,'sine',.05)}
};

/* ---------------- TOAST ---------------- */
function toast(msg,ico='',gold=false){
  const w=$('#toast-wrap');const t=document.createElement('div');
  t.className='toast'+(gold?' gold':'');t.innerHTML=(ico?`<span>${ico}</span>`:'')+`<span>${msg}</span>`;
  w.appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),320)},2100);
}

/* ---------------- CONFETTI ---------------- */
const FX={parts:[],raf:null};
function confetti(x,y,n=60,colors=['#2FB8A0','#FFAF3C','#FF7B6B','#5EB8FF','#9B7BDE','#7BC86C']){
  const cv=$('#confetti-cv');if(cv.width!==innerWidth){cv.width=innerWidth;cv.height=innerHeight}
  for(let i=0;i<n;i++){const a=rf(0,Math.PI*2),sp=rf(3,11);
    FX.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-5,g:.28,w:rf(5,10),h:rf(5,10),c:pick(colors),r:rf(0,6.3),vr:rf(-.25,.25),life:rf(50,90)})}
  if(!FX.raf)fxLoop();
}
function fxLoop(){
  const cv=$('#confetti-cv'),cx=cv.getContext('2d');
  cx.clearRect(0,0,cv.width,cv.height);
  FX.parts=FX.parts.filter(p=>p.life>0);
  for(const p of FX.parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.r+=p.vr;p.life--;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=clamp(p.life/28,0,1);
    cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h*(p.life>40?1:Math.abs(p.vy)/8));cx.restore()}
  if(FX.parts.length)FX.raf=requestAnimationFrame(fxLoop);else{FX.raf=null;cx.clearRect(0,0,cv.width,cv.height)}
}
function burstAt(el,n=50){if(!el)return;const r=el.getBoundingClientRect();confetti(r.left+r.width/2,r.top+r.height/2,n)}

/* ---------------- HUD ---------------- */
function updateHUD(){
  $('#hud-xp').textContent=S.xp;
  $('#hud-streak').textContent=S.streak;
  $('#hud-lvl').textContent=lvl();
  $('#hud-rank').textContent=rank();
  $('#btn-sound').textContent=S.sound?'🔊':'🔇';
}
$('#btn-sound').onclick=()=>{S.sound=!S.sound;updateHUD();save();if(S.sound)SFX.pop();toast(S.sound?'Sound ON':'Sound OFF',S.sound?'🔊':'🔇')};

/* ---------------- ROUTER ---------------- */
let CUR=null;
function show(id){
  $$('.screen').forEach(s=>s.classList.remove('on'));
  const el=$('#'+id);if(el)el.classList.add('on');
  CUR=id;
}
function setHUD(title,sub,showHome=true){
  $('#hud').classList.toggle('on',!!title);
  if(title){$('#hud-title').textContent=title;$('#hud-sub').textContent=sub||''}
  $('#hud-home').style.display=showHome?'grid':'none';
}
$('#hud-home').onclick=()=>{SFX.click();goMap()};

/* ---------------- MODAL ---------------- */
function modal(html,{onClose}={}){
  const w=$('#modal-wrap'),b=$('#modal-box');
  b.innerHTML=`<button class="modal-x" onclick="closeModal()">✕</button>`+html;
  w.classList.add('on');
  w.onclick=e=>{if(e.target===w)closeModal()};
  MODAL_CB=onClose||null;
}
let MODAL_CB=null;
function closeModal(){const w=$('#modal-wrap');w.classList.remove('on');$('#modal-box').innerHTML='';if(MODAL_CB){const cb=MODAL_CB;MODAL_CB=null;cb()}}
function debrief({title='MISSION DEBRIEF',ribbon='You just learned — without even noticing 😎',cls='',concepts=[],lines=[],btn='Keep going',btnCls='',onGo}){
  modal(`
    <div class="deb-ribbon ${cls}">${title}</div>
    <div class="modal-body center">
      <div style="font-size:13px;font-weight:800;color:var(--ink2);margin-top:4px">${ribbon}</div>
      <div class="concept-line">${concepts.map(c=>`<span class="chip ${pick(['','a','s','g'])}">${c}</span>`).join('')}</div>
      ${lines.map(l=>`<p style="font-size:14px;line-height:1.6;margin-top:10px;font-weight:600">${l}</p>`).join('')}
    </div>
    <div class="modal-foot"><button class="btn ${btnCls}" id="deb-go">${btn} →</button></div>`);
  $('#deb-go').onclick=()=>{SFX.click();closeModal();if(onGo)onGo()};

/* ---------------- COACH ---------------- */
function coach(text,anchorSel,screenEl){
  if(!screenEl)screenEl=$('#'+CUR);
  const a=anchorSel?$(anchorSel,screenEl):null;
  if(a){const r=a.getBoundingClientRect(),sr=screenEl.getBoundingClientRect();
    const tip=document.createElement('div');tip.className='coach-tip';tip.innerHTML=text;
    screenEl.appendChild(tip);
    let x=r.left-sr.left+r.width/2, y=r.bottom-sr.top+10;
    tip.style.left=clamp(x-110,8,sr.width-248)+'px';tip.style.top=y+'px';
    a.classList.add('coach-ring');
    const clean=()=>{tip.remove();a.classList.remove('coach-ring')};
    a.addEventListener('click',()=>setTimeout(clean,50),{once:true});
    setTimeout(clean,6000);
  } else toast(text,'👆');
}

/* ---------- tiny svg helpers ---------- */
const F=`font-family="Baloo 2" font-weight="800"`;
function numLine(y,x0,x1,min,max,step,cls=''){

}

function grid400(ox=170,oy=150,ux=26,uy=26,xr=[-6,8],yr=[-5,5]){

 s+=`<line x1="${ox+xr[0]*ux}" y1="${oy}" x2="${ox+(xr[1]+0.6)*ux}" y2="${oy}" stroke="#2B2438" stroke-width="2.5" marker-end="url(#arr)"/>`;
 s+=`<line x1="${ox}" y1="${oy+yr[0]*uy}" x2="${ox}" y2="${oy+(yr[1]+0.6)*uy}" stroke="#2B2438" stroke-width="2.5" marker-end="url(#arr)"/>`;
 s+=`<text x="${ox+(xr[1]+0.6)*ux}" y="${oy+16}" ${F} font-size="13" fill="#2B2438">x</text>`;
 s+=`<text x="${ox+10}" y="${oy+(yr[1]+0.6)*uy-4}" ${F} font-size="13" fill="#2B2438">y</text>`;

}
function dhruvaDot(x,y,r=9,c='#FF9A3C'){

}

{who:'GUIDE',say:`√2 is IRRATIONAL — its digits never end, never repeat. But we can still trap it! Slide the pin: below 1.41 is too small, above 1.42 too big. Squeeze it.`,

function labCard(side,title,body){const d=document.createElement('div');d.className='lab-card';d.innerHTML=`<h4>${title}</h4>${body?`<p>${body}</p>`:''}`;side.appendChild(d);return d}
function labSlider(card,label,min,max,val,step=1,fmt=v=>v){
 const d=document.createElement('div');d.className='slider-row';
 d.innerHTML=`<label><span>${label}</span><output>${fmt(val)}</output></label><input type="range" min="${min}" max="${max}" step="${step}" value="${val}">`;
 card.appendChild(d);const inp=d.querySelector('input'),out=d.querySelector('output');
 inp.oninput=()=>{out.textContent=fmt(+inp.value)};
 return {inp,get v(){return +inp.value},set v(x){inp.value=x;out.textContent=fmt(x)}};
}
function labEq(side){const d=document.createElement('div');d.className='eq-live';side.appendChild(d);return d}
function labRO(side,items){const d=document.createElement('div');d.className='readout';
 d.innerHTML=items.map((it,i)=>`<div class="ro"><div class="v" id="ro-${i}">–</div><div class="k">${it}</div></div>`).join('');
 side.appendChild(d);return d}
function labMile(side,list,w){
 const d=document.createElement('div');d.style.display='flex';d.style.flexDirection='column';d.style.gap='7px';
 d.innerHTML=list.map((m,i)=>`<div class="milestone" id="ms-${i}"><span class="tick">✓</span><span>${m}</span></div>`).join('');

    concepts:WORLDS[w].concepts.slice(2,5),lines:['The machine and you are now one. <b>Practice Arena</b> awaits, hero.'],
    btn:'To Practice Arena',btnCls:'amber',onGo:()=>startPractice(w)}),700);

const LABS=[];

/* ---- LAB 0 · Surd Smith ---- */
LABS[0]={title:'The Surd Smith 🔨',
init(canvas,side,w){
 let s=`<svg viewBox="0 0 400 300"><rect width="400" height="300" fill="#F4FBF9"/>
 <text x="200" y="36" text-anchor="middle" ${F} font-size="15" fill="#1E8C79">SMITH ANY ROOT ONTO THE LINE</text>
 <line x1="50" y1="180" x2="350" y2="180" stroke="#2B2438" stroke-width="2.5"/>
 <g id="s0-line"></g><g id="s0-pin"></g></svg>`;
 canvas.innerHTML=s;
 const c1=labCard(side,'What does the smith do?','Any surd √n can be broken into <b>k√m</b> — pull out the biggest perfect square hiding inside. Slide n and watch the smith work.');
 const sl=labSlider(c1,'n (under the root)',2,200,50,1);
 const eq=labEq(side);
 const ro=labRO(side,['exact form','as decimal']);
 const ms=labMile(side,['Find a perfect square (√n = whole number)','Simplify a surd like √50 → 5√2','Push n past 100'],w);
 const draw=()=>{
  const n=sl.v,x=50+(n-2)/198*300;
  const k=1,m=n;let out=n+'';
  for(let i=Math.floor(Math.sqrt(n));i>=2;i--){if(n%(i*i)===0){out=(i>1?`${i}√${n/(i*i)}`:`${n}`);break}}
  $('#s0-line',canvas).innerHTML=Array.from({length:15},(_,i)=>{const v=Math.round(2+i/14*198);const xx=50+(v-2)/198*300;
   return `<line x1="${xx}" y1="175" x2="${xx}" y2="185" stroke="#94B8AF" stroke-width="1.5"/>`}).join('')+
   `<text x="50" y="200" ${F} font-size="11" fill="#6B6478">2</text><text x="350" y="200" ${F} font-size="11" fill="#6B6478">200</text>`;
  $('#s0-pin',canvas).innerHTML=`${dhruvaDot(x,180,9,'#2FB8A0')}<text x="${clamp(x,60,340)}" y="158" text-anchor="middle" ${F} font-size="15" fill="#1E8C79">√${n}</text>`;
  const sq=Math.sqrt(n);
  eq.innerHTML=Math.abs(sq-Math.round(sq))<1e-9?`√${n} = <span class="hl">${Math.round(sq)}</span> — a WHOLE number!`:`√${n} = <span class="hl">${out}</span>`;
  $('#ro-0',side).textContent=out;$('#ro-1',side).textContent=sq.toFixed(3);
  if(Math.abs(sq-Math.round(sq))<1e-9)ms.hit(0,'√'+n+' = '+Math.round(sq)+' — perfect square found!');
  const p=out.match(/(\d+)√(\d+)/);if(p&&+p[1]>1)ms.hit(1,'√'+n+' = '+out+' — surd simplified!');

 };

()=>{ /* rationalise */

 return {topic:'Probability basics',type:'mcq',q:`Find the probability of <b>${t[0]}</b>.`,
  choices:t[3],ansText:t[1],
  hint:'P = favourable ÷ total outcomes.',
  steps:[stepsDeck('Count both sides',t[2]),
   stepsDeck('Answer',`P = <b>${t[1]}</b>`)]}},
()=>{ /* range */
 const xs=Array.from({length:5},()=>ri(2,40));
 const rng=Math.max(...xs)-Math.min(...xs);
 return {topic:'Range',type:'num',ans:rng,ansText:String(rng),
  q:`Find the RANGE of: <b>${xs.join(', ')}</b>`,
  hint:'Range = biggest − smallest.',
  steps:[stepsDeck('Spot the extremes',`max = ${Math.max(...xs)}, min = ${Math.min(...xs)}`),
   stepsDeck('Subtract',`Range = ${Math.max(...xs)} − ${Math.min(...xs)} = <b>${rng}</b>`)]}}
];

function submitMCQ(i,btn){
 if(PR.locked)return;PR.locked=true;
 const right=PR.q.choices[i]===PR.q.ansText;
 $$('.mcq').forEach(b=>b.style.pointerEvents='none');

function submitNum(){

 if(isNaN(v)){inp.classList.add('bad');setTimeout(()=>inp.classList.remove('bad'),450);SFX.bad();return}
 PR.locked=true;
 const target=PR.q.ans;
 const right=Math.abs(v-target)<0.01;
 inp.classList.add(right?'ok':'bad');inp.disabled=true;
 if(!right){SFX.bad();toast('Expected: '+PR.q.ansText,'🎯')}

 if(acts){acts.innerHTML=`<button class="btn ${right?'':'amber'}" id="pr-nextq">${right?'Next question →':'Got it — next one →'}</button>`;
  $('#pr-nextq').onclick=()=>{SFX.click();nextQuestion()};
 }

 save();
}

 /* progress bar handled by score chip */
}

}

    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3D6"/><stop offset="1" stop-color="#F5DFA8"/></linearGradient>
   </defs>
   <rect width="1000" height="560" fill="url(#sea)"/>
   ${[0,1,2].map(k=>`<path d="M0 ${120+k*150} q 40 -12 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0" fill="none" stroke="#ffffff" stroke-width="3" opacity=".28" class="wave"/>`).join('')}
   ${route}
   <g transform="translate(${boatAt[0]},${boatAt[1]+34})"><g class="boat"><path d="M-16 6 L16 6 L10 14 L-10 14 Z" fill="#E05544"/><rect x="-2" y="-12" width="3.4" height="18" fill="#5B3A00"/><path d="M1 -12 L14 2 L1 2 Z" fill="#fff"/></g></g>
   ${WORLDS.map((w,i)=>{const p=ISLE_POS[i],un=isleUnlocked(i),st=stars(i),done=st===3;
    return `<g transform="translate(${p[0]},${p[1]})"><g class="isle ${un?'':'locked'}" data-w="${i}">
     <circle class="halo" r="58" fill="${w.color}" opacity=".18"/>
     ${done?`<circle r="47" fill="none" stroke="#FFD34D" stroke-width="3.5" stroke-dasharray="8 6"/>`:''}
     <path d="M-46 10 Q-50 -26 0 -30 Q50 -26 46 10 Q30 24 0 22 Q-30 24 -46 10 Z" fill="${un?'url(#sand)':'#C9C4B8'}" stroke="${un?w.dark:'#9A958A'}" stroke-width="2.5"/>
     <ellipse cx="-16" cy="-18" rx="15" ry="9" fill="${un?'#7BC86C':'#B5B0A5'}"/><ellipse cx="14" cy="-20" rx="12" ry="7" fill="${un?'#8FD47F':'#B5B0A5'}"/>
     <text y="-34" text-anchor="middle" font-size="26" ${un?'':'opacity=".5"'}>${un?w.icon:'🔒'}</text>
     <text class="name" y="44">${w.name}</text>
     <text class="stars" y="60">${'⭐'.repeat(st)}${'·'.repeat(3-st)}</text>
     ${un?'':'<text y="76" text-anchor="middle" font-size="10" font-weight="800" fill="#6B6478">watch the previous film to unlock</text>'}
     ${un&&st<3?`<g transform="translate(34,-38)"><g class="coach-finger"><path d="M0 14 L0 2 Q0 -4 5 -2 L14 3 Q18 6 14 9 L4 15 Z" fill="#fff" stroke="#2B2438" stroke-width="1.6"/></g></g>`:''}
    </g></g>`}).join('')}
  </svg></div>
 </div>`;
 show('scr-map');
 $$('#map-svg .isle').forEach(g=>g.onclick=()=>{
  const w=+g.dataset.w;
  if(!isleUnlocked(w)){SFX.bad();toast('Finish the previous island\u2019s Concept Film first!','🔒');return}
  SFX.click();goHub(w);
 });
 if(!S.coachDone.map){setTimeout(()=>{coach('Tap the first island to start your war!', '#map-svg .isle');S.coachDone.map=true;save()},600)}
}
/* ---------- WORLD HUB ---------- */
function goHub(w){
 const W=WORLDS[w],st=S.worlds[w];
 setHUD(W.name,W.real);
 const pct=v=>Math.min(100,v);
 $('#scr-holder').innerHTML=`
 <div class="screen" id="scr-hub"><div class="scrolly">
  <div class="hub-hero">
   <div class="hub-icon" style="background:${W.soft};border-color:${W.color}">${W.icon}</div>
   <div class="hub-title"><h2>${W.name}</h2><div class="sub">${W.real} · ${W.tagline}</div></div>
   <div style="margin-left:auto;display:flex;flex-direction:column;gap:6px;align-items:flex-end">
    <button class="btn ghost sm" id="hb-map">🗺️ All islands</button>
    ${stars3(w)}
   </div>
  </div>
  <div class="hub-story"><span class="q">MISSION BRIEFING</span>${W.story}</div>
  <div class="howto">
   <div class="step"><b style="background:${W.color}">1</b> Watch the film 🎬</div>
   <div class="step"><b style="background:${W.color}">2</b> Crank the lab 🔬</div>
   <div class="step"><b style="background:${W.color}">3</b> Paper practice 📓</div>
   <div class="step"><b style="background:${W.color}">4</b> Boss battle ⚔️</div>
  </div>
  <div class="missions">
   ${missionCard(w,'🎬','Concept Film','An interactive movie. Tap, drag, guess — learn on the sly.',st.theater,'pct-theater',()=>startTheater(w),W,'Watch & play')}
   ${missionCard(w,'🔬','Hands-on Lab','Sliders and dials. Make the formula happen with your own hands.',st.lab,'pct-lab',()=>startLab(w),W,'Enter the lab')}
   ${missionCard(w,'📓','Practice Arena','Paper-first. Infinite unique questions + full Solution Decks.',st.practice>=8,'pct-pr',()=>startPractice(w),W,'Solve on paper',`${st.practice}/8 solved`)}
   ${missionCard(w,'⚔️',W.boss,W.taunt,st.boss,'pct-boss',()=>startBoss(w),W,'Fight the boss',st.boss?'defeated ✓':'8 practice solves recommended')}
  </div>
 </div></div>`;
 show('scr-hub');
 $('#hb-map').onclick=()=>{SFX.click();goMap()};
 const go=[()=>startTheater(w),()=>startLab(w),()=>startPractice(w),()=>startBoss(w)];
 $$('#scr-hub .mission').forEach((m,i)=>{m.onclick=()=>{SFX.click();go[i]()}});
 if(!S.coachDone['hub'+w]){setTimeout(()=>{coach('Start with the Concept Film — it plays like a video, but YOU control it.','#scr-hub .mission');S.coachDone['hub'+w]=true;save()},700)}
}
function stars3(w){const st=S.worlds[w];const n=(st.theater?1:0)+(st.lab?1:0)+(st.boss?1:0);
 return `<div style="font-size:15px;letter-spacing:2px">${'⭐'.repeat(n)}${'<span style="opacity:.3">⭐</span>'.repeat(3-n)}</div>`}
function missionCard(w,ico,title,desc,done,barId,go,W,cta,stat){
 const pct=done?100:0;
 return `<button class="mission ${done?'done':''}" data-bar="${barId}">
  <div class="m-go">→</div>
  <div class="m-ico" style="background:${W.soft}">${ico}</div>
  <h3>${title}</h3><p>${desc}</p>
  <div class="m-bar"><i style="width:${pct}%"></i></div>
  <div class="m-stat">${done?'✅ '+cta:cta}</div>
 </button>`;
}

window.addEventListener('load',()=>{
 updateHUD();buildTitle();
 const cv=$('#confetti-cv');cv.width=innerWidth;cv.height=innerHeight;
 window.addEventListener('resize',()=>{cv.width=innerWidth;cv.height=innerHeight});
 document.addEventListener('pointerdown',()=>{const c=ac();if(c&&c.state==='suspended')c.resume()},{once:true});
