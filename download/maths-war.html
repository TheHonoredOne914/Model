{id:'euc',n:'Euclid\'s Emporium',ch:'Chapter 5 · Introduction to Euclid\'s Geometry',ic:'📜',
 tag:'Build ALL of geometry from a handful of unbreakable seeds.',
 boss:{n:'AXIOMON',ti:'The Unquestionable',taunt:'My postulates have stood for 2300 years. What makes you think YOU can question them, Warrior?',art:'golem2'},
 concepts:[

 {id:'euc1',t:'Axioms & Postulates',sub:'NCERT 5.1–5.2 · The seeds of geometry',
  hook:{ic:'🏛️',s:'Alexandria, 300 BC. In the great library, Euclid refuses to assume ANYTHING without proof. He boils geometry down to a handful of "obvious truths" — axioms for all of maths, five postulates for geometry — and then, brick by brick, builds 465 theorems. When a king demands a shortcut, Euclid replies: "There is no royal road to geometry."',
        w:'Every proof you will ever write stands on these seeds. Exams directly test the postulates — and rightly so: they are the constitution of geometry.'},
  facts:[['Axiom vs postulate','Axioms are self-evident truths used across ALL of maths ("things equal to the same thing are equal"). Postulates are the five truths specific to geometry.'],
         ['The five postulates','1) A line can be drawn through any two points. 2) A segment extends endlessly. 3) A circle with any centre & radius exists. 4) All right angles are equal. 5) The parallel postulate.'],
         ['The 5th postulate, decoded','If a transversal makes the interior angles on one side sum to LESS than 180°, the two lines meet on that side.'],
         ['Two handy axioms','"If equals are added to equals, wholes are equal." "Things which are halves of the same thing are equal to one another."']],
  lab:['post',{set:'postulates'}],
  tasks:['Step through all five postulate cards with their pictures','Answer the mini-checks on each card','Spot which postulate the parallel-postulate card rewrites'],
  ex:{t:'Apply Euclid\'s axioms',
      steps:[['Chain of equality','A = B and B = C. By Axiom 1 (things equal to the same thing are equal): A = C.'],
             ['Halves work too','If A = B, then A/2 = B/2 — "halves of equals are equal" is a real Euclid axiom.'],
             ['Where you already use it','Proving triangles congruent by ASA quietly uses "equals added to equals are equal" every time you add angle to side.']]},
  gen(){
    const t=R(1,3);
    if(t===1){
      const which=Math.random()<0.5;
      if(which){
        return Q('How many distinct lines can pass through TWO different points?','Exactly one',['Exactly two','Infinitely many','None'],'Postulate 1 (with the "two distinct points" reading): a unique straight line joins them.','Two points force one and only one line.');
      }
      return Q('How many lines can pass through a SINGLE point?','Infinitely many',['Exactly one','Exactly two','None'],'Spin a line around the point — every direction works, so infinitely many lines pass through one point.','One point leaves the direction free!');
    }
    if(t===2){
      const bank=[['If a = b and b = c, then a = c','Axiom: things equal to the same thing are equal','Postulate 5','Postulate 3','A definition'],['Things which are halves of the same thing are…','Equal to one another','Double one another','Unequal','Neither'],['Euclid\'s 5th postulate is about…','When two lines meet (interior angle sum < 180°)','Circles','Right angles','Measuring areas']];
      const b=pick(bank);
      return Q(b[0],b[1],[b[2],b[3],b[4]],'Straight from Euclid\'s list — know the exact statements, they are asked verbatim.','Recall the exact wording of the axioms/postulates.');
    }
    return Q('"A circle can be drawn with any centre and any radius" is…','Postulate 3',['Postulate 1','Postulate 5','Axiom 2'],'Circles belong to geometry, so it is a POSTULATE — the third one.','Postulates = geometry-only truths.');
  }},

 {id:'euc2',t:'Theorems from Seeds',sub:'NCERT 5.2 · Equivalent versions of the 5th',
  hook:{ic:'⚖️',s:'Two long highways leave Delhi heading "almost the same way". Can they cross TWICE? Imagine it: two crossings would mean both highways pass through the same two towns — forcing them to be one and the same road. Contradiction! This tiny argument is your first real THEOREM.',
        w:'A theorem is a statement PROVED from axioms. Learning how the proof fights a contradiction is the real skill of this chapter.'},
  facts:[['Theorem 5.1','Two distinct lines cannot have more than one point in common. Proof by contradiction: two common points would make them the same line.'],
         ['Playfair\'s version','Through a point NOT on a given line, exactly ONE line can be drawn parallel to the given line.'],
         ['Sum version (equivalent)','If a transversal makes co-interior angles sum to 180°, the lines are parallel — and vice versa.'],
         ['Undefined on purpose','Point, line and plane are left UNDEFINED — everything else is built on top of them.']],
  lab:['post',{set:'theorems'}],
  tasks:['Walk the contradiction proof card by card','Match Playfair\'s version to the 5th postulate','Decide: can two lines share exactly one point? (Yes — that is normal crossing!)'],
  ex:{t:'Prove: two distinct lines cannot intersect twice',
      steps:[['Assume the opposite','Suppose lines l and m intersect at TWO points P and Q.'],
             ['Force the conclusion','Then both l and m pass through P and Q. But through two distinct points there is exactly ONE line (Postulate 1).'],
             ['Contradiction!','So l = m — they were never distinct. Our assumption fails: two distinct lines meet at most once. ∎']]},
  gen(){
    const t=R(1,3);
    if(t===1){
      return Q('Two distinct lines in a plane can have at most…','1 common point',['2 common points','Infinitely many common points','0 or 2 common points'],'If they shared two points they would be the same line (Postulate 1) — contradiction. So at most one crossing.','Two crossings would force the lines to merge.');
    }
    if(t===2){
      return Q('Through a point P NOT on line l, how many lines are parallel to l?','Exactly one (Playfair)',['Exactly two','Infinitely many','None'],'Playfair\'s axiom — the modern face of Euclid\'s 5th postulate — guarantees a unique parallel through P.','Parallel postulate = uniqueness of the parallel.');
    }
    return Q('A transversal makes co-interior angles 70° and 110°. The lines are…','Parallel (sum is 180°)',['Intersecting','Perpendicular','Coincident'],'70 + 110 = 180° → the co-interior sum version of the 5th postulate fires: the lines never meet.','Co-interior sum = 180° ⟺ parallel.');
  }}
]}
,
{id:'ang',n:'Angle Realm',ch:'Chapter 6 · Lines and Angles',ic:'📐',
 tag:'Complementary twins, linear pairs, and the great transversal chase.',
 boss:{n:'VERTEXA',ti:'The Angle Queen',taunt:'Ninety, one-eighty, spin, REPEAT. Get one angle wrong and my crown grows, Warrior!',art:'spider'},
 concepts:[

 {id:'ang1',t:'Angle Pairs',sub:'NCERT 6.1 · Pairs of angles',
  hook:{ic:'🕒',s:'Look at a clock at 3:00 — the hands sit at 90°. At 6:00 they open to 180°, a perfect straight line. Now cross two scissors blades: the opposite openings always MATCH, no matter how you cut. Clocks and scissors are secretly teaching you complementary, supplementary and vertically opposite angles.',
        w:'Angle-pair rules turn "find x" questions into 10-second wins — and they are the engine of every geometry proof ahead.'},
  facts:[['Complementary: sum 90°','40° + 50° = 90°, so each is the other\'s complement. Adjacent or not — only the SUM matters.'],
         ['Supplementary: sum 180°','110° + 70° = 180°. A linear pair is a supplementary pair that ALSO shares a vertex and arm.'],
         ['Linear pair axiom','If a ray stands on a line, the two angles formed sum to 180°. The converse holds too.'],
         ['Vertically opposite: always equal','When two lines cross, the opposite angles are equal — because each pair is supplementary to the SAME middle angle.']],
  lab:['trans',{mode:'pair'}],
  tasks:['Drag the ray to make a 60° angle — its complement shows automatically','Slide to 120° and read the supplement','Cross the two lines and verify opposite angles match at every turn'],
  ex:{t:'(2x + 30)° and (3x − 10)° form a linear pair. Find x.',
      steps:[['Linear pair = 180°','(2x + 30) + (3x − 10) = 180.'],
             ['Simplify','5x + 20 = 180 → 5x = 160.'],
             ['Solve','x = 32. Check: 94° + 86° = 180° ✓']]},
  gen(){
    const t=R(1,3);
    if(t===1){
      const x=pick([20,35,45,55,60,72]);
      return Q('The complement of '+x+'° is…',(90-x)+'°',[(180-x)+'°',(90+x)+'°',(270-x)+'°'],'Complement adds to 90°: 90 − '+x+' = '+(90-x)+'°.','Complement → 90. Supplement → 180.');
    }
    if(t===2){
      const x=pick([65,110,85,120,95,40]);
      return Q('The supplement of '+x+'° is…',(180-x)+'°',[(90-x)+'°',(180+x)+'°',(360-x)+'°'],'Supplement adds to 180°: 180 − '+x+' = '+(180-x)+'°.','Complement → 90. Supplement → 180.');
    }
    const a=R(20,70),b=180-a;
    return Q('Two angles form a linear pair. One is '+a+'°. The other is…',b+'°',[(90-a)+'°',(180-a)+'°'.replace('180','170'),(360-a)+'°'],'A linear pair sums to 180°: 180 − '+a+' = '+b+'°. (They also share a vertex and an arm.)','Linear pair = supplementary neighbours.');
  }},

 {id:'ang2',t:'The Transversal Chase',sub:'NCERT 6.2 · Parallel lines & transversal',
  hook:{ic:'🚆',s:'Two railway tracks run parallel while a footbridge crosses them at a slant — a transversal. Suddenly eight angles appear, and they are not strangers: four of them are clones of each other, four are the other clones. Railway engineers never measure all eight. They measure ONE and copy.',
        w:'Corresponding, alternate, co-interior — these three relationships solve every parallel-line question the board can throw at you.'},
  facts:[['Corresponding angles = equal','Same relative position at each crossing (both top-right, etc.). Equal when lines are parallel.'],
         ['Alternate interior = equal','Z-shape angles inside the parallel lines, on opposite sides of the transversal.'],
         ['Co-interior = supplementary','C-shape angles inside, same side of transversal: they sum to 180°.'],
         ['The converse cracks proofs','If ANY pair of corresponding angles is equal, the lines MUST be parallel — this is how you prove parallelism.']],
  lab:['trans',{mode:'parallel'}],
  tasks:['Rotate the transversal and tap an angle — find its corresponding clone','Tap an angle to highlight its alternate partner (Z-shape!)','Check: co-interior partners always add to 180°'],
  ex:{t:'One angle of the transversal family is 65°. Find the rest.',
      steps:[['Clone the correspondings','All four corresponding copies of 65° are 65°.'],
             ['Fill the supplements','Each 65° partner on the straight line: 180 − 65 = 115°. So the other four are 115°.'],
             ['Verify with co-interior','65 + 115 = 180° ✓ and the Z-pairs match (65 = 65) ✓. Eight angles, two values.']]},
  gen(){
    const t=R(1,3);
    if(t===1){
      const a=pick([55,65,72,110,125]);
      const alt=(a>90)?(180-a):a;
      return Q('Two parallel lines are cut by a transversal. One angle is '+a+'°. Its ALTERNATE interior angle is…',alt+'°',[(180-a)+'°',(90-a)+'°',a+'°'===alt+'°'?'70°':(a+10)+'°'],'Alternate interior angles are EQUAL when lines are parallel. (Here the alternate interior pair works out to '+alt+'°.)','Alternate → equal. Co-interior → sum 180°.');
    }
    if(t===2){
      const x=pick([20,30,40]),base=2*x+30;
      return Q('Corresponding angles are (2x + 30)° and '+base+'°. Find x.',String(x),[String(x+5),String(x-5),String(x+10),String(2*x)],'Corresponding angles are equal: 2x + 30 = '+base+' → 2x = '+(base-30)+' → x = '+x+'.','Set them equal and solve.');
    }
    const x=pick([50,60,70]);
    return Q('Co-interior angles are (x + 40)° and '+x+'°. Find x.',String(x),[String(x+10),String(x-10),String(x+20)],'Co-interior angles sum to 180°: (x + 40) + '+x+' = 180 → 2x = 140 → x = '+x+'.','Co-interior → add to 180°.');
  }},

 {id:'ang3',t:'Angle Sum & the Exterior',sub:'NCERT 6.7–6.8 · Triangle angle properties',
  hook:{ic:'📄',s:'Tear the three corners off any paper triangle and place them tip-to-tip: they snap into a perfect straight line — 180°, every single time. And if you stretch one side of the triangle outward, the "outside" angle it makes equals the two far corners ADDED. Paper tears don\'t lie.',
        w:'Angle sum 180° and exterior angle theorem are the two most-used facts in school geometry. Instant marks, forever useful.'},
  facts:[['Angle sum property','The three interior angles of ANY triangle sum to exactly 180° — acute, right or obtuse, no exceptions.'],
         ['Exterior angle theorem','An exterior angle = sum of the two REMOTE interior angles (the two it is not next to).'],
         ['Straight-line bonus','Exterior angle + its adjacent interior angle = 180° (linear pair).'],
         ['Instant use','Knowing any two angles hands you the third: third = 180° − (given + given).']],
  lab:['trisum',{}],
  tasks:['Drag the apex vertex and watch the sum freeze at 180°','Make one angle 90° and read the other two\'s relationship','Switch on the exterior angle and verify it equals the two remote angles'],
  ex:{t:'Two angles of a triangle are 50° and 60°. Find the third, and the exterior at it.',
      steps:[['Angle sum','Third = 180 − (50 + 60) = 70°.'],
             ['Exterior angle','Exterior at that vertex = 180 − 70 = 110° (linear pair).'],
             ['Cross-check','Remote angles 50 + 60 = 110° ✓ — the exterior angle theorem agrees.']]},
  gen(){
    const t=R(1,3);
    if(t===1){
      const a=pick([40,50,55,65,70]),b=pick([60,45,80,35,50]);
      return Q('Two angles of a triangle are '+a+'° and '+b+'°. The third angle is…',(180-a-b)+'°',[(180-a)+'°',(180-b)+'°',(90-a-b)+'°',a+b+'°'],'180 − ('+a+' + '+b+') = '+(180-a-b)+'°.','Sum of all three = 180°.');
    }
    if(t===2){
      return Q('Angles of a triangle are x, 2x and 3x. Then x = …','30°',['20°','45°','36°'],'x + 2x + 3x = 180 → 6x = 180 → x = 30°. The angles are 30°, 60°, 90°.','Add the parts, equate to 180°.');
    }
    const a=pick([35,40,50]),b=pick([55,65,60]);
    return Q('An exterior angle of a triangle equals the sum of remote interiors. If the remote angles are '+a+'° and '+b+'°, the exterior angle is…',(a+b)+'°',[(180-a-b)+'°',(180-(a+b))+'°',(a+b+180)+'°','90°'],'Exterior = '+a+' + '+b+' = '+(a+b)+'°. (The adjacent interior would be '+(180-a-b)+'°.)','Exterior angle = sum of the two remote interior angles.');
  }}
]}
,
{id:'tri',n:'Triangle Territory',ch:'Chapter 7 · Triangles',ic:'🔺',
 tag:'Congruence duels, isosceles twins and the inequality gatekeeper.',
 boss:{n:'TRIGON',ti:'The Three-Eyed Tyrant',taunt:'Three eyes. Three sides. Zero mercy. Your puny CPCT will not save you here!',art:'brute'},
 concepts:[

 {id:'tri1',t:'Congruence Rules',sub:'NCERT 7.1 · SSS, SAS, ASA, RHS',
  hook:{ic:'🔑',s:'A locksmith copies a key not by tracing every millimetre but by matching the few cuts that MATTER. Triangles work identically: check just three carefully-chosen parts, and the whole triangle is forced. That is why SSS, SAS, ASA and RHS are called congruence RULES — shortcut passports to identical triangles.',
        w:'CPCT (Corresponding Parts of Congruent Triangles) then unlocks every remaining side and angle for free. Proof-writing starts here.'},
  facts:[['Congruent = identical','Same size AND shape; superimpose one on the other and they coincide exactly. Symbol: ≅.'],
         ['SSS / SAS','SSS: all three pairs of sides equal. SAS: two sides AND the angle BETWEEN them equal.'],
         ['ASA / RHS','ASA: two angles and the INCLUDED side equal. RHS: right angle + hypotenuse + one side (right triangles only).'],
         ['AAA is a trap!','Three equal angles only make triangles SIMILAR (same shape, any size) — NOT congruent. Examiners love this trap.']],
  lab:['congr',{}],
  tasks:['Match all three sliders of both triangles and trigger the CPCT snap','Read which rule lights up when only two sides + included angle match','Try AAA (angles only) and watch it FAIL to snap'],
  ex:{t:'ΔABC ≅ ΔPQR by SSS. What follows?',
      steps:[['The given','AB = PQ, BC = QR, CA = RP — three side pairs equal.'],
             ['Invoke CPCT','Corresponding parts of congruent triangles are equal: ∠A = ∠P, ∠B = ∠Q, ∠C = ∠R automatically.'],
             ['Why this matters','We never measured those angles — congruence hands them to us free. This is the backbone of all Chapter 7 proofs.']]},
  gen(){
    const t=R(1,3);
    if(t===1){
      const bank=[['Three pairs of equal sides','SSS'],['Two sides and the angle between them','SAS'],['Two angles and the included side','ASA'],['Right angle, hypotenuse and a side','RHS'],['Two sides and a NON-included angle','Not enough information']];
      const b=pick(bank);
      return Q('The congruence rule that needs: '+b[0]+'…',b[1],['SSS','SAS','ASA','RHS','AAS'].filter(s=>s!==b[1]).slice(0,3),b[0]+' is exactly the definition of the '+b[1]+' rule.','Match the checklist to the rule name.');
    }
    if(t===2){
      return Q('Two triangles have all three angles equal (AAA). They are…','Similar but NOT necessarily congruent',['Congruent by AAA','Congruent by ASA','Never related'],'Equal angles fix the SHAPE but not the SIZE — one triangle may be a giant copy of the other. That is similarity.','AAA lacks any side — size is free.');
    }
    return Q('ΔABC ≅ ΔDEF. Then side AC equals…','DF',['DE','EF','ED'],'Match the letters: A↔D, B↔E, C↔F. First-and-third letters: AC ↔ DF.','Correspondence order matters — read the letter positions!');
  }},

 {id:'tri2',t:'Isosceles Tales',sub:'NCERT 7.2 · Angles opposite equal sides',
  hook:{ic:'⛺',s:'Every tent, roof truss and samosa is an isosceles triangle — two equal sides meeting at a peak. Fold a paper triangle down its middle and the two base angles land exactly on each other. The fold line is nature\'s proof: equal sides face equal angles.',
        w:'The isosceles theorem and its converse let you trade side-information for angle-information instantly — a staple of exam geometry.'},
  facts:[['The theorem','In any triangle, angles opposite EQUAL sides are equal. (Equal sides ↔ equal angles.)'],
         ['The converse','If two angles of a triangle are equal, the sides opposite them are equal too.'],
         ['Equilateral = 60/60/60','All three sides equal → all three angles 60°. The most democratic triangle.'],
         ['Apex bonus','In an isosceles triangle, the median from the apex is also the altitude and the angle bisector — three jobs, one line.']],
  lab:['isos',{mode:'apex'}],
  tasks:['Slide the apex angle and watch both base angles mirror each other','Make the apex 60° and meet the equilateral triangle','Use the converse: equal angles force equal sides'],
  ex:{t:'An isosceles triangle has apex angle 40°. Find the base angles.',
      steps:[['Equal sides → equal angles','The two base angles opposite the equal sides are equal: call each x.'],
             ['Angle sum','x + x + 40 = 180 → 2x = 140.'],
             ['Result','x = 70°. Both base angles are 70°. (Converse check: 70 = 70 ✓)']]},
  gen(){
    const t=R(1,3);
    if(t===1){
      const apex=pick([40,60,80,100,20,50]);
      return Q('An isosceles triangle has apex angle '+apex+'°. Each base angle is…',fr(180-apex,2)+'°',[apex+'°',fr(180-apex,2)+10+'°',(90-apex/2)+'°',fr(180-apex,2)-5+'°'],'Base angles are equal: (180 − '+apex+')/2 = '+fr(180-apex,2)+'° each.','(180 − apex)/2, since the two bases are equal.');
    }
    if(t===2){
      const base=pick([50,55,65,70]);
      return Q('Each base angle of an isosceles triangle is '+base+'°. The apex angle is…',(180-2*base)+'°',[base+'°',(180-base)+'°',(90-base)+'°'],'Apex = 180 − 2('+base+') = '+(180-2*base)+'°.','Subtract both equal bases from 180°.');
    }
    return Q('In an isosceles triangle ABC, AB = AC. Then…','∠B = ∠C',['∠A = ∠B','∠A = ∠C','∠B > ∠C'],'Sides AB and AC are equal, so the angles OPPOSITE them — ∠C and ∠B — are equal.','Angles opposite equal sides are equal.');
  }},

 {id:'tri3',t:'Side–Angle Duel',sub:'NCERT 7.3–7.4 · Inequalities',
  hook:{ic:'🥢',s:'Grab three sticks: 2 cm, 3 cm and 7 cm. Try to close the triangle — impossible! The two short sticks simply cannot reach around the long one. Now try 5, 6, 10: they click shut. Triangles obey a strict membership rule, and inside any triangle, the biggest angle stares at the biggest side.',
        w:'Triangle inequality questions are one-liners in exams ("Can 3, 4, 8 form a triangle?") — and the side↔angle ranking finishes inequality proofs in one step.'},
  facts:[['The membership rule','Three lengths form a triangle ONLY if the sum of every two exceeds the third. Fastest check: shortest + middle > longest.'],
         ['Side ↔ angle ranking','The larger angle is always opposite the larger side (and vice versa). Rank one, you rank the other.'],
         ['Third-side window','For sides a, b, the third side c obeys: a − b < c < a + b (strict inequalities).'],
         ['Failure is information','If a + b = c exactly, the "triangle" collapses into a straight segment — still not a triangle!']],
  lab:['isos',{mode:'ineq'}],
  tasks:['Slide c until the triangle snaps open — find the exact limit','Order the angles by sliding the side lengths','Test 2, 3, 7 and watch the gatekeeper reject it'],
  ex:{t:'Can 2, 3, 7 form a triangle? What about 5, 6, 10?',
      steps:[['The gatekeeper test','2 + 3 = 5 < 7. The short sticks can\'t span the long one → NO triangle.'],
             ['Second attempt','5 + 6 = 11 > 10, and every other pair also exceeds the third → YES.'],
             ['Rank them','In Δ(5, 6, 10): the 10 side faces the largest angle, 6 the middle, 5 the smallest.']]},
  gen(){
    const t=R(1,3);
    if(t===1){
      const sets=[[2,3,7,'No'],[4,5,9,'No'],[1,2,3,'No'],[5,6,10,'Yes'],[7,10,16,'Yes'],[6,8,13,'Yes'],[3,4,8,'No'],[10,12,21,'Yes']];
      const s=pick(sets);
      return Q('Can a triangle have sides '+s[0]+', '+s[1]+', '+s[2]+'?',s[3],['Yes','No'].filter(x=>x!==s[3]),'Check: '+s[0]+' + '+s[1]+' = '+(s[0]+s[1])+' '+(s[0]+s[1]>s[2]?'>':'≤')+' '+s[2]+'. '+(s[3]==='Yes'?'All pairs pass → triangle exists.':'Shortest + middle fails to beat the longest → no triangle.'),'Shortest + middle must EXCEED the longest.');
    }
    if(t===2){
      const a=pick([5,6,8,7]),b=pick([8,9,11,10]);
      return Q('Two sides of a triangle are '+a+' and '+b+'. The third side c must satisfy…',(b-a)+' < c < '+(a+b),[a+' < c < '+b,'0 < c < '+(a+b),(a+b)+' < c',(b-a)+' ≤ c ≤ '+(a+b)],'Third-side window: (b − a) < c < (a + b), i.e. '+(b-a)+' < c < '+(a+b)+'. Both inequalities strict!','c > difference of the other two, and c < their sum.');
    }
    return Q('In ΔPQR, angle Q is the largest. Then…','PR is the largest side',['PQ is the largest side','QR is the largest side','PR is the smallest side'],'Largest angle ↔ largest side OPPOSITE it. ∠Q faces side PR → PR is longest.','The biggest angle always stares at the biggest side.');
  }}
]}
,
{id:'quad',n:'Quad Quadrangle',ch:'Chapter 8 · Quadrilaterals',ic:'▦',
 tag:'Skewed parallelograms, a royal family and the midpoint bridge.',
 boss:{n:'QUADRAX',ti:'The Four-Fold Warden',taunt:'Four sides I have, and FOUR FOLD anger. Bend my angles as you wish — my opposites NEVER break!',art:'brute2'},
 concepts:[

 {id:'quad1',t:'Parallelogram Powers',sub:'NCERT 8.1 · Properties',
  hook:{ic:'🪜',s:'A pantograph (the extendable lamp arm) is a lattice of parallelograms: stretch it any way you like, and opposite bars stay parallel and equal — that is why it copies drawings perfectly. One diagonal slice and each parallelogram splits into two identical triangles. This one fact generates every parallelogram property.',
        w:'Proving the diagonal splits a parallelogram into congruent triangles (by ASA) unlocks ALL other properties in two lines each. Learn one proof, harvest five.'},
  facts:[['Diagonal = congruence maker','A diagonal divides a parallelogram into two CONGRUENT triangles (alternate angles + common side → ASA).'],
         ['Opposite sides equal','From CPCT: AB = CD and AD = BC — opposite sides are always equal (and parallel).'],
         ['Opposite angles equal','Also from CPCT: ∠A = ∠C and ∠B = ∠D. Adjacent angles are supplementary (co-interior).'],
         ['Diagonals bisect each other','The diagonals cut each other into equal halves: AO = OC and BO = OD at the crossing point O.']],
  lab:['para',{mode:'base'}],
  tasks:['Drag the corner — opposite sides stay equal no matter the skew','Toggle the diagonals and verify the bisection tick-marks','Set one angle to 70° and read the other three'],
  ex:{t:'One angle of a parallelogram is 70°. Find the rest.',
      steps:[['Opposite angle','Opposite angles are equal: the angle across is also 70°.'],
             ['Adjacent pair','Adjacent angles are co-interior between parallel sides: 180 − 70 = 110°.'],
             ['Family complete','Angles in order: 70°, 110°, 70°, 110°. (Sum = 360° ✓)']]},
  gen(){
    const t=R(1,3);
    if(t===1){
      const a=pick([65,70,85,100,110,55]);
      return Q('One angle of a parallelogram is '+a+'°. The OTHER THREE angles are…',(180-a)+'°, '+a+'°, '+(180-a)+'°',[a+'°, '+(180-a)+'°, '+(180-a)+'°',(180-a)+'°, '+(180-a)+'°, '+a+'°',a+'°, '+a+'°, '+(180-a)+'°'],'Opposite equal ('+a+'° across), adjacent supplementary ('+(180-a)+'° next door): '+a+'°, '+(180-a)+'°, '+a+'°, '+(180-a)+'°.','Opposite = equal; adjacent = 180 − angle.');
    }
    if(t===2){
      const a=pick([4,5,6,8]),b=pick([3,5,7,9]);
      return Q('Two adjacent sides of a parallelogram are '+a+' cm and '+b+' cm. Its perimeter is…',(2*(a+b))+' cm',[(a+b)+' cm',(2*a+b)+' cm',(4*(a+b))+' cm'],'Parallelogram: two pairs of equal sides → perimeter = 2('+a+' + '+b+') = '+(2*(a+b))+' cm.','Opposite sides equal → 2(a + b).');
    }
    return Q('The diagonals of a parallelogram ABCD meet at O. Which is ALWAYS true?','OA = OC and OB = OD',['OA = OB','AC = BD','AC ⊥ BD'],'Diagonals of a parallelogram BISECT each other — each is cut into two equal halves at O.','Bisect each other, yes. Equal or perpendicular? Only for special members!');
  }},

 {id:'quad2',t:'The Royal Family',sub:'NCERT 8.2 · Rhombus, rectangle, square',
  hook:{ic:'👑',s:'Every parallelogram is a citizen. Some inherit titles: the RHOMBUS (equal sides, diagonals crossing like an X at right angles), the RECTANGLE (four right angles, diagonals measuring equal), and the crown prince SQUARE — inheriting BOTH estates. Know the family tree and every "identify the quadrilateral" question surrenders.',
        w:'Diagonal clues are the exam\'s favourite riddle: "diagonals equal AND perpendicular" instantly outs a square. Learn the table cold.'},
  facts:[['Rectangle','All angles 90°. Diagonals EQUAL (and they still bisect each other).'],
         ['Rhombus','All sides equal. Diagonals PERPENDICULAR, and each bisects the opposite angles.'],
         ['Square','The maximal heir: all sides equal + all angles 90°. Diagonals equal, perpendicular, bisecting — everything at once.'],
         ['The logic ladder','Square ⊂ Rectangle ⊂ Parallelogram and Square ⊂ Rhombus ⊂ Parallelogram. A square is both a rectangle and a rhombus!']],
  lab:['para',{mode:'royal'}],
  tasks:['Press RECTANGLE — watch diagonals become equal','Press RHOMBUS — watch diagonals rotate to perpendicular','Press SQUARE — both badges light up together'],
  ex:{t:'Identify the figure: diagonals are equal AND perpendicular',
      steps:[['Diagonals equal…','…means rectangle (or its heirs).'],
             ['…and perpendicular','…means rhombus (or its heirs).'],
             ['Both at once','Equal + perpendicular diagonals → SQUARE, the only figure holding both titles.']]},
  gen(){
    const t=R(1,3);
    if(t===1){
      const bank=[['Diagonals are equal and bisect each other','Rectangle'],['Diagonals are perpendicular and bisect each other','Rhombus'],['Diagonals are equal AND perpendicular','Square'],['Only one pair of opposite sides is parallel','Trapezium'],['Two pairs of adjacent sides equal, diagonals perpendicular','Kite']];
      const b=pick(bank);
      return Q('A quadrilateral whose '+b[0].toLowerCase()+' is a…',b[1],['Rectangle','Rhombus','Square','Trapezium','Kite','Parallelogram'].filter(s=>s!==b[1]).slice(0,3),'The diagonal fingerprint '+b[0].toLowerCase()+' belongs uniquely to the '+b[1]+'.','Match the diagonal clues to the family tree.');
    }
    if(t===2){
      const a=pick([6,8,9]),b=pick([8,15,12]);
      const trip={8:6,15:8,12:9,6:8,9:12,8:15};
      if(trip[a]!==b)return this.gen();
      const d=Math.sqrt(a*a+b*b);
      return Q('A rectangle has sides '+a+' cm and '+b+' cm. Each diagonal is…',d+' cm',[Math.round((d+2)*10)/10+' cm',(a+b)+' cm',Math.round((d-1)*10)/10+' cm'],'Diagonal² = '+a+'² + '+b+'² (Pythagoras) → diagonal = '+d+' cm. Rectangle diagonals are always equal.','Pythagoras on the right triangle the diagonal makes.');
    }
    return Q('Every square is a…','rectangle and a rhombus both',['rectangle but not a rhombus','rhombus but not a rectangle','neither'],'A square has equal sides (rhombus ✓) and right angles (rectangle ✓) — it inherits both titles.','The family tree: square sits under BOTH branches.');
  }},

 {id:'quad3',t:'Midpoint Magic',sub:'NCERT 8.9–8.10 · Midpoint theorem',
  hook:{ic:'🌉',s:'Two villages sit at the midpoints of a triangular forest\'s sides. The engineers discover something eerie: the straight road joining those midpoints is always EXACTLY parallel to the third side — and exactly HALF its length. No matter how the forest triangle deforms, the bridge keeps its promises.',
        w:'The midpoint theorem (and its converse) is a two-line proof machine for "show DE = ½BC" questions — guaranteed marks if you know the setup.'},
  facts:[['The theorem','The segment joining midpoints of two sides of a triangle is PARALLEL to the third side and HALF as long: DE ∥ BC, DE = ½BC.'],
         ['The converse','A line through the midpoint of one side, parallel to a second side, BISECTS the third side.'],
         ['Proof idea','Extend DE to F so DE = EF; show CDFE is a parallelogram → congruences finish it (or use equal intercepts).'],
         ['Perimeter bonus','The triangle formed by the three midpoints has perimeter exactly HALF the original — three bridges, each half a side.']],
  lab:['midp',{}],
  tasks:['Drag the vertices — watch DE stay glued parallel to BC at half length','Read the live ratio EF/BC from the readout','Slide the inner segment off the midpoint and see parallelism break'],
  ex:{t:'D, E are midpoints of AB, AC. If BC = 12.8 cm, find DE.',
      steps:[['Identify the setup','D and E are midpoints of two sides — the midpoint theorem applies.'],
             ['Apply the theorem','DE ∥ BC and DE = ½ × BC.'],
             ['Compute','DE = ½ × 12.8 = 6.4 cm. Done in one line.']]},
  gen(){
    const t=R(1,3);
    if(t===1){
      const bc=pick([10,12,12.8,14,16,9.6]);
      return Q('D and E are midpoints of AB and AC. If BC = '+bc+' cm, then DE = …',fr(bc,2)+' cm',[(bc*2)+' cm',(bc/4)+' cm',(bc-1)+' cm'],'Midpoint theorem: DE = ½ BC = '+fr(bc,2)+' cm.','DE is always half of BC.');
    }
    if(t===2){
      const de=pick([4,5,6,7.5]);
      return Q('In ΔABC, DE ∥ BC with D, E on AB, AC and DE = '+de+' cm. D and E are the midpoints. Then BC = …',(2*de)+' cm',[de+' cm',fr(de,2)+' cm',(de+2)+' cm'],'Since D, E are midpoints, BC = 2 × DE = '+(2*de)+' cm.','BC is twice the midpoint segment.');
    }
    return Q('A line through the midpoint of one side of a triangle, parallel to a second side…','bisects the third side',['is perpendicular to the third side','equals the third side','trisects the third side'],'That is the CONVERSE of the midpoint theorem: parallel through a midpoint bisects the remaining side.','Converse: midpoint + parallel → bisects.');
  }}
]}
);

<script>
'use strict';
/* ================= WORLD DATA · part 3 (circ, area, sol, dat) ================= */

WORLDS.push(
{id:'circ',n:'Circle Citadel',ch:'Chapter 9 · Circles',ic:'🎯',
 tag:'Chords, equal distances, half-angle magic and the cyclic four.',
 boss:{n:'CIRRONIS',ti:'Lord of the Infinite Loop',taunt:'My circumference has no end… and neither does your suffering. Spin, Warrior, spin!',art:'ring'},
 concepts:[

 {id:'circ1',t:'Circle Anatomy',sub:'NCERT 9.1 · Chords, arcs, segments',
  hook:{ic:'🍕',s:'A pizza is a circle textbook: the doughline is the circumference, every cut is a chord, and the slice that reaches crust-to-crust through the centre is the diameter — the longest possible cut. The pepperoni wedge (two radii + arc) is a sector; the leftover cap above a chord is a segment. Lunch = geometry.',
        w:'Vocabulary is half the battle in this chapter. Radius, chord, diameter, arc, sector, segment — the paper sets questions just testing if you can tell them apart.'},
  facts:[['Radius & diameter','All radii are equal. Diameter = 2r and it is the LONGEST chord — it wins every comparison.'],
         ['Chord','A chord joins two points ON the circle; it need not pass through the centre. Infinitely many chords exist.'],
         ['Arc, segment, sector','Arc = a piece of the circle itself. Segment = region between chord and arc. Sector = region between two radii and their arc.'],
         ['The two formulas','Circumference = 2πr. Area = πr². With π = 22/7 and r = 7: C = 44, A = 154.']],
  lab:['circl',{mode:'parts'}],
  tasks:['Drag the point P — watch chord AP grow and shrink','Toggle the diameter and confirm it is the longest chord','Shade the segment, then the sector — tell them apart'],
  ex:{t:'A circle has radius 10 cm and a chord of length 16 cm. How far is the chord from the centre?',
      steps:[['Drop the perpendicular','The perpendicular from the centre to a chord bisects it: half-chord = 8 cm.'],
             ['Pythagoras','Distance² + 8² = 10² → distance² = 100 − 64 = 36.'],
             ['Result','Distance = 6 cm. The 6-8-10 triple strikes again!']]},
  gen(){
    const t=R(1,3);
    if(t===1){
      return Q('The longest chord of a circle is…','the diameter',['the radius','any chord through a point on the circle','the arc'],'The diameter passes through the centre and spans the full circle — no chord can be longer.','Diameter = 2 × radius, through the centre.');
    }
    if(t===2){
      const d=pick([14,28,44,70]);
      return Q('The diameter of a circle is '+d+' cm. Its radius is…',fr(d,2)+' cm',[d+' cm',fr(d,2)+1+' cm',fr(2*d,1)+' cm'],'Radius = diameter ÷ 2 = '+d+'/2 = '+fr(d,2)+' cm.','Halve it.');
    }
    const r=pick([7,14]);
    const C=2*(22/7)*r, A=(22/7)*r*r;
    if(Math.random()<0.5){
      return Q('Circumference of a circle with radius '+r+' cm (π = 22/7)…',fmt(C)+' cm',[fmt(A)+' cm',fmt(C+8)+' cm',fmt(C/2)+' cm'],'C = 2πr = 2 × 22/7 × '+r+' = '+fmt(C)+' cm.','2 × 22/7 × r.');
    }
    return Q('Area of a circle with radius '+r+' cm (π = 22/7)…',fmt(A)+' cm²',[fmt(C)+' cm²',fmt(A+22)+' cm²',fmt(A/2)+' cm²'],'A = πr² = 22/7 × '+r+'² = '+fmt(A)+' cm².','22/7 × r².');
  }},

 {id:'circ2',t:'Chords & the Centre',sub:'NCERT 9.3–9.5 · Equal chords, equal distances',
  hook:{ic:'🎯',s:'Two arrows (chords) of exactly the same length hit a circular target. The referee checks their distances from the bull\'s eye: IDENTICAL. Longer arrows always sit closer to the centre; shorter ones shy away to the rim. The centre is the fairest referee in geometry.',
        w:'"Perpendicular from centre bisects the chord" and "equal chords ⇔ equal distances" solve every chord question — usually with a hidden Pythagoras triple.'},
  facts:[['The bisector drop','The perpendicular from the centre to a chord ALWAYS bisects it (and the converse: the line from centre to midpoint is perpendicular).'],
         ['Equal chords, equal distance','Chords of equal length sit at equal distances from the centre — and conversely, equidistant chords are equal.'],
         ['Pythagoras powers it','Distance d, half-chord h, radius r form a right triangle: d² + h² = r².'],
         ['Three points make a circle','One and only one circle passes through three given non-collinear points — its centre is where the perpendicular bisectors meet.']],
  lab:['circl',{mode:'chords'}],
  tasks:['Slide the chord — watch the perpendicular always bisect it','Make two chords EQUAL and compare their distances','Slide one chord longer and see it creep toward the centre'],
  ex:{t:'Find the distance of a 24 cm chord from the centre of a circle of radius 13 cm.',
      steps:[['Halve the chord','Perpendicular bisects: half-chord = 12 cm.'],
             ['Pythagoras','d² + 12² = 13² → d² = 169 − 144 = 25.'],
             ['Result','d = 5 cm. The 5-12-13 triple again — spot triples early!']]},
  gen(){
    const t=R(1,2);
    if(t===1){
      const bank=[[16,10,6],[24,13,5],[48,25,7],[8,5,3],[30,17,8]];
      const [c,r,d]=pick(bank);
      return Q('A circle of radius '+r+' cm has a chord of length '+c+' cm. Its distance from the centre is…',d+' cm',[r+' cm',fr(c,2)+' cm',(d+2)+' cm',(d-1)+' cm'],'Half-chord = '+fr(c,2)+'. Then d² = '+r+'² − '+fr(c,2)+'² = '+(r*r-c*c/4)+' → d = '+d+' cm.','d² + (c/2)² = r². Spot the triple!');
    }
    const bank=[[5,12,24],[7,24,48],[3,4,8],[8,15,30]];
    const [d,r,c]=pick(bank);
    return Q('A chord is '+d+' cm from the centre of a circle of radius '+r+' cm. The chord length is…',c+' cm',[r+' cm',(c/2)+' cm',(c+4)+' cm'],'Half-chord² = '+r+'² − '+d+'² = '+(r*r-d*d)+' → half = '+fr(c,2)+' → chord = '+c+' cm.','Find the half-chord by Pythagoras, then double.');
  }},

 {id:'circ3',t:'Angles in Circles',sub:'NCERT 9.4–9.5 · Central & inscribed angles',
  hook:{ic:'🔦',s:'A lighthouse at the centre of a circular bay sweeps a 80° beam. A boat anchored on the shore sees the same two beam-edges — but from the boat the angle looks exactly HALF: 40°. Same arc, two vantage points: centre sees double, rim sees half. Always. No exceptions.',
        w:'The central-angle theorem is the workhorse of circle questions: central = 2 × inscribed on the same arc. Its children: angles in the same segment are equal, and a semicircle always frames 90°.'},
  facts:[['Central = 2 × inscribed','The angle subtended by an arc at the centre is double the angle it subtends at any point on the remaining circle.'],
         ['Same segment, equal angles','All inscribed angles standing on the SAME arc are equal to each other.'],
         ['Thales\' 90°','An angle in a SEMICIRCLE is always a right angle — the diameter\'s arc subtends 180° at centre, so 90° at the rim.'],
         ['Opposite segments','Angle in the major segment is acute, in the minor segment obtuse — they sum to 180°.']],
  lab:['circl',{mode:'angles'}],
  tasks:['Drag the central angle slider — the inscribed angle always halves it','Drag point C around the arc: inscribed angle refuses to change','Press the semicircle button and meet the guaranteed 90°'],
  ex:{t:'The central angle is 80°. What does the inscribed angle on the same arc say?',
      steps:[['Apply the theorem','Inscribed = ½ × central = ½ × 80 = 40°.'],
             ['Same-segment check','Move the rim point anywhere on the same arc — it stays 40°.'],
             ['Semicircle cousin','If the central angle were 180° (diameter), the inscribed angle would be 90° — Thales\' theorem.']]},
  gen(){
    const t=R(1,3);
    if(t===1){
      const c=pick([60,80,100,120,140,40]);
      return Q('An arc subtends '+c+'° at the centre. The angle it subtends at any point on the remaining circle is…',fr(c,2)+'°',[c+'°',(2*c)+'°',(180-c)+'°'],'Inscribed = half of central = '+c+'/2 = '+fr(c,2)+'°.','Centre sees double; rim sees half.');
    }
    if(t===2){
      const i=pick([25,35,45,55]);
      return Q('An inscribed angle on a circle is '+i+'°. The central angle on the same arc is…',(2*i)+'°',[i+'°',(180-i)+'°',(2*i+10)+'°'],'Central = 2 × inscribed = 2 × '+i+' = '+(2*i)+'°.','Double it for the centre.');
    }
    return Q('The angle subtended by a diameter at any point on the circle is…','90°',['180°','45°','60°'],'A diameter\'s arc is a semicircle: 180° at the centre → half of it, 90°, at the rim. (Thales\' theorem.)','Semicircle always frames a right angle.');
  }},

 {id:'circ4',t:'Cyclic Quadrilaterals',sub:'NCERT 9.6 · The roundabout four',
  hook:{ic:'🎡',s:'Four friends stand anywhere on a circular roundabout and join hands — a cyclic quadrilateral. No matter where they stand, one law binds them: opposite corners ALWAYS sum to 180°. Move anyone, the angles rebalance like a see-saw. Geometry\'s roundabout has its own traffic rules.',
        w:'"Opposite angles supplementary" identifies cyclic quads, completes missing angles in one step, and appears in almost every circle question paper.'},
  facts:[['Definition','A quadrilateral with ALL four vertices on one circle is cyclic — the circle is its circumcircle.'],
         ['The big law','Opposite angles of a cyclic quadrilateral are SUPPLEMENTARY: ∠A + ∠C = 180°, ∠B + ∠D = 180°.'],
         ['Exterior twist','If a side is extended, the exterior angle equals the INTERIOR OPPOSITE angle.'],
         ['How it\'s proved','∠A = ½(arc BCD\'s major), ∠C = ½(the rest) — the two halves together sweep 360°, so the angles sum to 180°.']],
  lab:['circl',{mode:'cyclic'}],
  tasks:['Drag any corner — watch both opposite sums stay pinned at 180°','Make one angle 100° and read its opposite','Drag two corners to the same spot: what shape appears?'],
  ex:{t:'In a cyclic quadrilateral, ∠A = 100°. Find ∠C.',
      steps:[['Opposite pair','∠A and ∠C are opposite corners of the cyclic quad.'],
             ['Supplementary law','∠A + ∠C = 180° → ∠C = 180 − 100 = 80°.'],
             ['Sanity check','Move A around the circle: 100 + 80 holds like a magnet.']]},
  gen(){
    const t=R(1,2);
    if(t===1){
      const a=pick([70,85,100,110,95,120]);
      return Q('In a cyclic quadrilateral, one angle is '+a+'°. Its opposite angle is…',(180-a)+'°',[a+'°',(90-a)+'°',(2*a-180)+'°'],'Opposite angles of a cyclic quadrilateral are supplementary: 180 − '+a+' = '+(180-a)+'°.','Opposite corners always sum to 180°.');
    }
    const k=pick([2,3]),m=pick([3,4]);
    return Q('Opposite angles of a cyclic quad are in ratio '+k+' : '+m+'. The angles are…',(180*k/(k+m))+'° and '+(180*m/(k+m))+'°',['90° and 90°',(180*m/(k+m))+'° and '+(180*k/(k+m))+'°',(90*k/(k+m))+'° and '+(90*m/(k+m))+'°'],'They sum to 180° and split '+k+':'+m+': 180×'+k+'/'+(k+m)+' = '+(180*k/(k+m))+'° and 180×'+m+'/'+(k+m)+' = '+(180*m/(k+m))+'°.','Total 180°, divide in the given ratio.');
  }}
]}
,
{id:'area',n:'Area Arsenal',ch:'Chapter 10 · Heron\'s Formula',ic:'🏹',
 tag:'The formula that measures any triangle without ever needing a height.',
 boss:{n:'HERONIA',ti:'The Formula Witch',taunt:'No height? No altitude? Then you cannot measure my fields, Warrior. Heron guards me!',art:'witch'},
 concepts:[

 {id:'area1',t:'Heron\'s Formula',sub:'NCERT 10.1 · Area from three sides',
  hook:{ic:'🪁',s:'At the Patang kite festival, a master kite-maker is asked: "How much paper is on that kite?" It is a scalene triangle — no height marked, no right angle anywhere. He smiles, measures only the three sides, computes one helper called s, and answers in ten seconds. Hero of Alexandria\'s 2000-year-old spell: Heron\'s formula.',
        w:'When the height is missing (and building it is messy), Heron\'s formula is the ONLY clean tool for area from sides — a guaranteed exam question.'},
  facts:[['Step 1 — the semi-perimeter','s = (a + b + c)/2. Half of the total boundary — usually a friendly number.'],
         ['Step 2 — the spell','Area = √(s(s − a)(s − b)(s − c)). Multiply all four factors first, THEN take the root.'],
         ['It needs NO height','That is the entire superpower: three sides in, area out — works for scalene, isosceles, anything valid.'],
         ['Sanity check','For 3, 4, 5: s = 6, Area = √(6·3·2·1) = √36 = 6 ✓ — matches the right-triangle shortcut ½·3·4.']],
  lab:['heron',{mode:'core'}],
  tasks:['Slide a, b, c to 3, 4, 5 and verify area 6','Push c past a + b and read the validity alarm','Find (s−a)(s−b)(s−c) for 13, 14, 15 — then the area'],
  ex:{t:'Find the area of a triangle with sides 13, 14, 15 cm.',
      steps:[['Semi-perimeter','s = (13 + 14 + 15)/2 = 21.'],
             ['Factors','s − a = 8, s − b = 7, s − c = 6.'],
             ['Assemble','Area = √(21 × 8 × 7 × 6) = √7056 = 84 cm². Beautiful and clean.']]},
  gen(){
    const t=R(1,2);
    if(t===1){
      const bank=[[13,14,15],[3,4,5],[5,12,13],[6,8,10],[9,12,15]];
      const [a,b,c]=pick(bank);
      return Q('The semi-perimeter of a triangle with sides '+a+', '+b+', '+c+' is…',fr(a+b+c,2),[String(a+b+c),(a+b+c)/3+'',' '+fr(a+b+c,2)+1],'s = (a + b + c)/2 = ('+a+' + '+b+' + '+c+')/2 = '+fr(a+b+c,2)+'.','Add all sides, halve the total.');
    }
    const bank=[[['3, 4, 5'],'6'],[['6, 8, 10'],'24'],[['5, 12, 13'],'30'],[['9, 12, 15'],'54'],[['13, 14, 15'],'84'],[['5, 5, 6'],'12'],[['10, 10, 12'],'48']];
    const [side,ar]=pick(bank);
    return Q('The area of a triangle with sides '+side+' is…',ar+' sq units',[(parseFloat(ar)*2)+' sq units',(parseFloat(ar)+1)+' sq units',fr(parseFloat(ar),2)+' sq units'],'Heron\'s formula: s = semi-perimeter, then Area = √(s(s−a)(s−b)(s−c)) = '+ar+'.','s first, then √(s(s−a)(s−b)(s−c)).');
  }},

 {id:'area2',t:'Heron in the Field',sub:'NCERT 10.2 · Applications & costs',
  hook:{ic:'🏗️',s:'The municipality hires you: "This triangular park — 122 m, 120 m, 22 m — needs a lawn at ₹5 per m². What\'s the bill?" One Heron computation stands between you and a ₹6,600 invoice. Real maths, real money, one formula.',
        w:'Application questions chain Heron with cost = area × rate. Compute the area precisely; the rupees follow automatically.'},
  facts:[['The workflow','Sides → s → Area → multiply by rate (₹/m²) → total cost.'],
         ['Split awkward shapes','A quadrilateral field splits along a diagonal into two triangles; Heron each, then add.'],
         ['Units discipline','Sides in metres → area in m². Mixing cm with m breaks everything — convert FIRST.'],
         ['The classic park','122, 120, 22: s = 132, factors 10, 12, 110 → Area = √(132·10·12·110) = √1742400 = 1320 m².']],
  lab:['heron',{mode:'field'}],
  tasks:['Load the 122-120-22 park preset and verify 1320 m²','Set the rate to ₹5/m² and compute the lawn bill','Try the two-triangle wall preset'],
  ex:{t:'Park 122 × 120 × 22 m; lawn cost ₹5 per m². Total bill?',
      steps:[['Heron step','s = (122 + 120 + 22)/2 = 132; factors: 10, 12, 110.'],
             ['Area','√(132 × 10 × 12 × 110) = √1742400 = 1320 m².'],
             ['Money','Cost = 1320 × 5 = ₹6,600. The invoice is ready.']]},
  gen(){
    const t=R(1,2);
    if(t===1){
      return Q('A triangular park has sides 122 m, 120 m, 22 m. Its area is…','1320 m²',['2640 m²','1220 m²','6600 m²'],'s = 132; Area = √(132 × 10 × 12 × 110) = √1742400 = 1320 m².','s = 132, then Heron.');
    }
    const rate=pick([3,4,5]);
    return Q('The 1320 m² park is fenced & lawn-ed at ₹'+rate+' per m². Total cost…','₹'+(1320*rate),['₹'+(1320*rate+100),'₹'+(1320+rate),'₹'+(1320*rate*2)],'Cost = area × rate = 1320 × '+rate+' = ₹'+(1320*rate)+'.','Area × rate.');
  }}
]}
,
{id:'sol',n:'Volume Vault',ch:'Chapter 11 · Surface Areas & Volumes',ic:'📦',
 tag:'Cones, spheres and cylinders — unwrap them, fill them, master them.',
 boss:{n:'SPHERAX',ti:'The Colossal Core',taunt:'I am a sphere of infinite density! Your little formulas will be CRUSHED — or will they, Warrior?',art:'colossus'},
 concepts:[

 {id:'sol1',t:'Cone Chronicles',sub:'NCERT 11.1 · Slant, surfaces & volume',
  hook:{ic:'🍦',s:'Unroll a birthday-party cone hat: it flattens into a pizza-slice sector whose radius is the cone\'s SLANT l and whose curved edge is the base circumference 2πr. Fill a cone with water and pour into a same-base cylinder — exactly THREE pours fill it. Cone = ⅓ cylinder, forever.',
        w:'Cone formulas all hang off one Pythagoras relation l² = r² + h². Get l, and CSA, TSA, V all fall in line.'},
  facts:[['The slant link','l² = r² + h² — the slant is the hypotenuse of the hidden right triangle inside every cone.'],
         ['Surfaces','Curved surface = πrl (the unrolled sector). Total surface = πr(l + r): add the base circle πr².'],
         ['Volume = ⅓ cylinder','V = ⅓ πr²h. Three cones fill one cylinder of the same base and height.'],
         ['Classic triple','r = 7, h = 24 → l = 25 (7-24-25!). CSA = πrl = 22/7 × 7 × 25 = 550.']],
  lab:['solid',{mode:'cone'}],
  tasks:['Slide r and h — watch l update by Pythagoras','Press UNROLL and see the sector appear','Set r = 7, h = 24 and read CSA = 550'],
  ex:{t:'r = 7 cm, h = 24 cm. Find CSA, TSA and V.',
      steps:[['Slant first','l = √(49 + 576) = √625 = 25 cm.'],
             ['Surfaces','CSA = πrl = 22/7 × 7 × 25 = 550 cm². TSA = πr(l + r) = 22/7 × 7 × 32 = 704 cm².'],
             ['Volume','V = ⅓πr²h = ⅓ × 22/7 × 49 × 24 = 1232 cm³. Three clean answers, one triple.']]},
  gen(){
    const t=R(1,3);
    if(t===1){
      const bank=[[7,24,25],[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15]];
      const [r,h,l]=pick(bank);
      return Q('A cone has radius '+r+' and height '+h+'. Its slant height is…',String(l),[String(r+h),String(l+2),String(l-1),'25','13','5'],'l = √(r² + h²) = √('+r*r+' + '+h*h+') = '+l+'.','Pythagoras: l² = r² + h².');
    }
    if(t===2){
      const bank=[['r = 7, l = 25: the curved surface area is','550 cm²',['704 cm²','385 cm²','154 cm²']],['r = 7, l = 25: the total surface area is','704 cm²',['550 cm²','616 cm²','462 cm²']]];
      const [q,a,ws]=pick(bank);
      return Q('For a cone with '+q+'…',a,ws,'πrl = 22/7 × 7 × 25 = 550; adding the base πr² = 154 gives TSA = 704.','CSA = πrl; TSA = πr(l + r).');
    }
    return Q('How many cones (same base, same height) fill a cylinder?','3',['2','4','1.5'],'V(cone) = ⅓ πr²h = exactly one-third of the cylinder — three pours.','The ⅓ is not a coincidence — it is the whole point.');
  }},

 {id:'sol2',t:'Sphere & Hemisphere',sub:'NCERT 11.2–11.3 · The round family',
  hook:{ic:'⚽',s:'Cut a football in half: inside, the curved skin of each half measures 2πr², plus one flat πr² face where the knife went — 3πr² in total, called a hemisphere\'s TSA. A sphere\'s whole skin is 4πr²: exactly the same as FOUR circles of its own shadow. Round objects are generous with formulas.',
        w:'Sphere and hemisphere formulas are pure memory marks. Learn the trio (4πr², 2πr², 3πr²) and the volumes, and the bank hands you full credit.'},
  facts:[['Sphere skin','Surface area = 4πr². (Fun: = 4 × the area of its great-circle shadow πr².)'],
         ['Hemisphere skin','Curved = 2πr² (half the sphere). TSA = 2πr² + πr² = 3πr² (curved + flat face).'],
         ['Volumes','Sphere: V = 4/3 πr³. Hemisphere: V = 2/3 πr³ (half of the sphere\'s).'],
         ['r = 7 classics','Sphere SA = 4 × 22/7 × 49 = 616. Hemisphere TSA = 3 × 22/7 × 49 = 462. Hemisphere CSA = 308.']],
  lab:['solid',{mode:'sphere'}],
  tasks:['Slide r and read 4πr² live','Cut the sphere — hemisphere mode: verify 2πr² + πr²','Set r = 7 and check the classic 616'],
  ex:{t:'Find the total surface area of a hemisphere of radius 7 cm.',
      steps:[['Curved half','CSA = 2πr² = 2 × 22/7 × 49 = 308 cm².'],
             ['Flat face','The cut face is a circle: πr² = 154 cm².'],
             ['Total','TSA = 308 + 154 = 462 cm² (or directly 3πr²).']]},
  gen(){
    const t=R(1,3);
    if(t===1){
      const r=pick([7,14]);
      const sa=4*(22/7)*r*r;
      return Q('Surface area of a sphere of radius '+r+' cm (π = 22/7)…',sa+' cm²',[2*sa+' cm²',sa/2+' cm²',(sa-154)+' cm²'],'SA = 4πr² = 4 × 22/7 × '+r+'² = '+sa+' cm².','4 × 22/7 × r².');
    }
    if(t===2){
      const r=pick([7,14]);
      const tsa=3*(22/7)*r*r;
      return Q('TOTAL surface area of a hemisphere of radius '+r+' cm…',tsa+' cm²',[2*tsa/3+' cm²',(2*tsa/3)+' cm²',4*(22/7)*r*r+' cm²',tsa+10+' cm²'],'TSA = 3πr² = 3 × 22/7 × '+r+'² = '+tsa+' cm² (curved 2πr² + flat πr²).','3πr² — do not forget the flat face!');
    }
    return Q('How many small spheres of radius 2 cm melt into one sphere of radius 6 cm?','27',['8','9','3'],'Volume scales as r³: (6/2)³ = 27 small spheres fit into the big one.','Ratio of radii CUBED.');
  }},

 {id:'sol3',t:'Cylinder City',sub:'NCERT 11.2 · Unrolling the drum',
  hook:{ic:'🛢️',s:'Peel the label off a can of juice: it flattens into a rectangle whose width is the can\'s circumference 2πr and height is the can\'s height h — that is the curved surface. The tin top and bottom are two circles. Volume? Just stack circles: base area × height, πr²h.',
        w:'Cylinders are the friendliest solid: unwrap the label (CSA), add two lids (TSA), fill the stack (V). Water-tank questions always end in litres: 1000 cm³ = 1 L.'},
  facts:[['Unroll the label','CSA = 2πrh — a rectangle of width 2πr (circumference) and height h.'],
         ['Add the lids','TSA = 2πr(r + h): CSA plus two circular ends 2πr².'],
         ['Fill the stack','V = πr²h = base area × height.'],
         ['Litres rule','1000 cm³ = 1 litre. A 1540 cm³ tank holds 1.54 L.']],
  lab:['solid',{mode:'cylinder'}],
  tasks:['Slide r and h, then UNROLL the label into the rectangle','Read CSA = 2πrh from the unrolled width × height','Convert a 1540 cm³ volume into litres'],
  ex:{t:'r = 7 cm, h = 10 cm. Find CSA, TSA and V.',
      steps:[['Curved surface','CSA = 2πrh = 2 × 22/7 × 7 × 10 = 440 cm².'],
             ['Total surface','TSA = 2πr(r + h) = 2 × 22/7 × 7 × 17 = 748 cm².'],
             ['Volume','V = πr²h = 22/7 × 49 × 10 = 1540 cm³ = 1.54 litres.']]},
  gen(){
    const t=R(1,3);
    if(t===1){
      const bank=[[7,5,220],[7,10,440],[14,10,880],[7,15,660],[14,5,440]];
      const [r,h,csa]=pick(bank);
      return Q('A cylinder has r = '+r+' cm, h = '+h+' cm. Its curved surface area (π = 22/7) is…',csa+' cm²',[(csa*2)+' cm²',(csa/2)+' cm²',(csa+154)+' cm²'],'CSA = 2πrh = 2 × 22/7 × '+r+' × '+h+' = '+csa+' cm².','2 × 22/7 × r × h.');
    }
    if(t===2){
      const bank=[[7,10,1540],[7,20,3080],[14,15,9240],[7,5,770]];
      const [r,h,v]=pick(bank);
      return Q('Volume of a cylinder with r = '+r+' cm, h = '+h+' cm (π = 22/7)…',v+' cm³',[(v*2)+' cm³',(v/2)+' cm³',(v+77)+' cm³'],'V = πr²h = 22/7 × '+r+'² × '+h+' = '+v+' cm³.','22/7 × r² × h.');
    }
    return Q('A tank of volume 1540 cm³ holds how many litres?','1.54 L',['15.4 L','154 L','0.154 L'],'1000 cm³ = 1 L, so 1540 cm³ = 1.54 L.','Divide cm³ by 1000.');
  }}
]}
,
{id:'dat',n:'Data Dungeon',ch:'Chapter 12 · Statistics',ic:'📊',
 tag:'Tame raw scores, build histograms and deploy the three averages.',
 boss:{n:'DATAMORG',ti:'The Whispering Vault',taunt:'A thousand numbers whisper in my vault. Find your mean among them… if you can!',art:'cube'},
 concepts:[

 {id:'dat1',t:'Taming Raw Data',sub:'NCERT 12.1 · Range & frequency',
  hook:{ic:'🏏',s:'Coach Bhatia has 20 run-scores scribbled on a napkin: 6, 2, 0, 4, 6, 1, 3, … chaos. "Tell me about my team," she says. You cannot answer from a napkin — but a frequency table turns the mess into a story: who scored ducks, how many fifties, the spread. Data\'s first law: organise before you conclude.',
        w:'Range and frequency tables are the entry ticket to all statistics — and "class width" questions are free marks if you know the three definitions.'},
  facts:[['Raw → organised','Raw data is an unsorted list; an ARRAY sorts it. Range = maximum − minimum: the total spread.'],
         ['Frequency','Frequency of a value = how many times it occurs. Tally marks (||||) keep the count honest.'],
         ['Grouped data','For wide ranges, bundle values into class intervals like 0–10, 10–20; class width = upper − lower of one class.'],
         ['Classes touch','In continuous grouping, the upper limit of one class IS the lower limit of the next — no gaps, no overlaps in counting.']],
  lab:['stats',{mode:'table'}],
  tasks:['Build the frequency table of the 20 scores — use the tally','Compute the range from the raw list','Set the class width and watch the intervals form'],
  ex:{t:'Data: 3, 7, 3, 2, 9, 7, 3. Find range and frequency of 3.',
      steps:[['Range','Max 9, min 2 → range = 9 − 2 = 7.'],
             ['Frequency','The value 3 appears three times → frequency 3.'],
             ['Read','The table now tells the story instantly: 3 is the most common score (mode, as it happens).']]},
  gen(){
    const t=R(1,3);
    if(t===1){
      const base=R(10,40),list=[];for(let i=0;i<6;i++)list.push(base+R(0,30));
      const mx=Math.max(...list),mn=Math.min(...list);
      return Q('The range of the data '+list.join(', ')+' is…',String(mx-mn),[String(mx),String(mn),String(mx+mn),String(mx-mn+2)],'Range = max − min = '+mx+' − '+mn+' = '+(mx-mn)+'.','Largest minus smallest.');
    }
    if(t===2){
      const list=[];for(let i=0;i<8;i++)list.push(R(1,6));
      const target=R(1,6);
      const f=list.filter(x=>x===target).length;
      return Q('In the data '+list.join(', ')+', the frequency of '+target+' is…',String(f),[String(f+1),String(f+2),String(Math.max(1,f-1))],'Count the '+target+'s: it appears '+f+' time(s).','Just count them.');
    }
    return Q('Scores are grouped into classes 0–10, 10–20, 20–30. The class width is…','10',['5','20','30'],'Class width = upper limit − lower limit = 10 − 0 = 10 for every class here.','Upper minus lower of one class.');
  }},

 {id:'dat2',t:'Bars & Histograms',sub:'NCERT 12.1 · Picture the data',
  hook:{ic:'📈',s:'A bar chart of "favourite subject" shows Maths towering — bars with GAPS, one per category. A histogram of marks shows classes 0–10, 10–20… bars TOUCHING, because the data flows continuously. Choose the wrong chart and a statistician somewhere sheds a tear.',
        w:'Histograms answer "how many in each class" at a glance; exams ask you to read, draw, and pick between bar graph and histogram correctly.'},
  facts:[['Bar graph = categories','Distinct categories (subjects, colours) → bars with equal widths and GAPS between them.'],
         ['Histogram = continuous classes','Grouped continuous data → bars TOUCHING, width = class width, no gaps.'],
         ['Height = frequency','In both charts, bar height is the frequency — read values straight off.'],
         ['Tallest tells the mode-class','The highest bar marks the modal class of grouped data — a favourite one-mark question.']],
  lab:['stats',{mode:'chart'}],
  tasks:['Toggle bar-graph ↔ histogram and watch the gaps vanish','Click each bar to read its frequency','Find the modal class (tallest bar)'],
  ex:{t:'Marks: 0–20:4, 20–40:7, 40–60:12, 60–80:5, 80–100:2. Read the story.',
      steps:[['Choose the chart','Continuous class intervals → HISTOGRAM, bars touching.'],
             ['Read the peak','The tallest bar is 40–60 with 12 students → modal class.'],
             ['Total','4 + 7 + 12 + 5 + 2 = 30 students appeared. One picture, whole story.']]},
  gen(){
    const t=R(1,2);
    if(t===1){
      return Q('Marks are grouped as 0–10, 10–20, … The correct graph is a…','Histogram (continuous classes, no gaps)',['Bar graph with gaps','Pie chart','Line graph only'],'Continuous grouped data demands a histogram — bars touch because 10 ends one class and starts the next.','Continuous → histogram; categories → bar graph.');
    }
    const freqs=[R(2,5),R(6,9),R(10,14),R(3,7),R(1,4)];
    const total=freqs.reduce((a,b)=>a+b,0);
    return Q('A histogram has bar frequencies '+freqs.join(', ')+'. How many students in total?',String(total),[String(total+2),String(total-1),String(Math.max(...freqs))],'Add all bar heights: '+freqs.join(' + ')+' = '+total+'.','Sum the frequencies.');
  }},

 {id:'dat3',t:'Mean, Median, Mode',sub:'NCERT 12.2–12.3 · The three averages',
  hook:{ic:'🏆',s:'Five friends\' salaries: 10k, 12k, 12k, 14k, 200k (the boss walked in). Mean = 49.6k — absurd! Median = 12k — honest. Mode = 12k — the crowd\'s choice. One dataset, three averages, three different truths. Choosing the RIGHT average is a life skill (and an exam question).',
        w:'Mean uses every value, median ignores extremes, mode reports popularity. Know all three and how outliers wreck exactly one of them.'},
  facts:[['Mean = Σx / n','Add everything, divide by count. Uses all data, but one huge outlier drags it far away.'],
         ['Median = the middle','SORT first. Odd n → middle value. Even n → mean of the two middle values.'],
         ['Mode = the crowd\'s choice','The most frequent value. A list can have no mode, one mode, or several.'],
         ['Outlier drama','Salaries 10k,12k,12k,14k,200k: mean 49.6k (misleading!), median 12k (truthful), mode 12k.']],
  lab:['stats',{mode:'averages'}],
  tasks:['Add and remove values — watch mean, median, mode move','Insert one giant outlier and see who survives','Build a dataset with NO mode, then one with two modes'],
  ex:{t:'Data: 4, 6, 5, 6, 9. Find mean, median, mode.',
      steps:[['Mean','(4 + 6 + 5 + 6 + 9)/5 = 30/5 = 6.'],
             ['Median','Sort: 4, 5, 6, 6, 9. Middle (3rd) = 6.'],
             ['Mode','6 appears twice, others once → mode = 6. All three agree at 6!']]},
  gen(){
    const t=R(1,3);
    if(t===1){
      const n=5,nums=[];let sum=0;
      for(let i=0;i<n;i++){const v=R(2,18);nums.push(v);sum+=v}
      if(sum%5!==0)return this.gen();
      return Q('The mean of '+nums.join(', ')+' is…',String(sum/5),[String(sum/5+1),String(sum/5-1),String(sum),'0'],'Mean = ('+nums.join(' + ')+')/5 = '+sum+'/5 = '+(sum/5)+'.','Add all, divide by 5.');
    }
    if(t===2){
      const nums=shuf([3,5,7,9,11,13]).slice(0,R(0,1)+5);
      const sorted=[...nums].sort((a,b)=>a-b);
      const n=sorted.length;
      const med=n%2?sorted[(n-1)/2]:(sorted[n/2-1]+sorted[n/2])/2;
      return Q('The median of '+nums.join(', ')+' is…',String(med),[String(med+1),String(med-1),String(nums[0]),String(sorted[n-1])],'Sort: '+sorted.join(', ')+'. Middle position → '+med+'.','SORT first, then take the middle.');
    }
    const mode=pick([4,6,8]);
    const list=shuf([mode,mode,pick([2,3,5]),pick([7,9,11]),pick([1,2,12])]);
    return Q('The mode of '+list.join(', ')+' is…',String(mode),[String(mode+1),String(mode-1),String(list[0])],'Mode = most frequent value. '+mode+' appears twice — more than any other.','Count which value repeats.');
  }}
]}
);

<script>
'use strict';
/* ================= LAB ENGINES · part 1 ================= */
const LABS={};
const SVGNS='http://www.w3.org/2000/svg';
function NS(t,at){const e=document.createElementNS(SVGNS,t);for(const k in at)e.setAttribute(k,at[k]);return e}
function makeSVG(w,h){const s=NS('svg',{viewBox:'0 0 '+w+' '+h,width:'100%'});s.style.maxWidth=w+'px';return s}
function T(x,y,str,at){const t=NS('text',Object.assign({x:x,y:y,fill:'#26243a','font-size':13,'font-weight':700,'font-family':'Outfit,Inter,sans-serif','text-anchor':'middle'},at||{}));t.textContent=str;return t}
function LN(x1,y1,x2,y2,st){return NS('line',Object.assign({x1:x1,y1:y1,x2:x2,y2:y2,stroke:'#3f3c58','stroke-width':2,'stroke-linecap':'round'},st||{}))}
function RC(x,y,w,h,st){return NS('rect',Object.assign({x:x,y:y,width:w,height:h},st||{}))}
function CR(cx,cy,r,st){return NS('circle',Object.assign({cx:cx,cy:cy,r:r},st||{}))}
function PT(d,st){return NS('path',Object.assign({d:d,fill:'none',stroke:'#3f3c58','stroke-width':2.2,'stroke-linecap':'round'},st||{}))}
function ARC(cx,cy,r,a1,a2,st){const x1=cx+r*Math.cos(a1*Math.PI/180),y1=cy-r*Math.sin(a1*Math.PI/180),x2=cx+r*Math.cos(a2*Math.PI/180),y2=cy-r*Math.sin(a2*Math.PI/180);const large=(Math.abs(a2-a1)>180)?1:0;return PT('M '+x1+' '+y1+' A '+r+' '+r+' 0 '+large+' '+(a1>a2?1:0)+' '+x2+' '+y2,st||{})}
function svgPoint(svg,ev){const r=svg.getBoundingClientRect();const vb=svg.viewBox.baseVal;return{x:(ev.clientX-r.left)/r.width*vb.width,y:(ev.clientY-r.top)/r.height*vb.height}}
function makeDrag(svg,node,onmove){
 node.style.cursor='grab';
 node.addEventListener('pointerdown',e=>{
  e.preventDefault();node.setPointerCapture&&node.setPointerCapture(e.pointerId);
  const mv=ev=>onmove(svgPoint(svg,ev));
  const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);
 });
}
function addSlider(ctl,label,min,max,val,step,onin,fmtFn){
 const row=document.createElement('div');row.className='ctlrow';
 row.innerHTML='<span class="slab">'+label+' <span class="val"></span></span>';
 const inp=document.createElement('input');inp.type='range';inp.min=min;inp.max=max;inp.step=step||1;inp.value=val;
 row.appendChild(inp);ctl.appendChild(row);
 const valEl=row.querySelector('.val');
 const upd=()=>{valEl.textContent=fmtFn?fmtFn(+inp.value):inp.value};
 upd();
 inp.addEventListener('input',()=>{upd();onin(+inp.value)});
 return inp;
}
function addTabs(ctl,names,active,onpick){
 const t=document.createElement('div');t.className='tabs';
 names.forEach((n,i)=>{const b=document.createElement('button');b.className='tab'+(i===active?' on':'');b.textContent=n;
  b.addEventListener('click',()=>{t.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');onpick(i)});
  t.appendChild(b)});
 ctl.appendChild(t);return t;
}
function addBtn(ctl,label,cls,fn){
 const b=document.createElement('button');b.className='btn btn-sm '+(cls||'btn-s');b.textContent=label;
 b.addEventListener('click',fn);ctl.appendChild(b);return b;
}
function readout(ctl,html){
 let r=ctl.querySelector('.readout');
 if(!r){r=document.createElement('div');r.className='readout';ctl.appendChild(r)}
 r.innerHTML=html;return r;
}

/* ---------- 1. NUMBER LINE ---------- */
LABS.numline=function(box,ctl,opts,api){
 box.innerHTML='';const s=makeSVG(700,150);box.appendChild(s);
 const X0=70,DX=56,XMAX=640,Y=78;
 s.appendChild(LN(X0-20,Y,XMAX+20,Y,{stroke:'#26243a','stroke-width':2.5}));
 for(let i=-5;i<=5;i++){const x=X0+(i+5)*DX;
  s.appendChild(LN(x,Y-6,x,Y+6,{stroke:'#26243a'}));
  s.appendChild(T(x,Y+22,String(i),{'font-size':12,fill:'#6d6a85'}));
 }
 const g=s.appendChild(NS('g',{}));
 const pin=CR(X0+2.5*DX,Y,9,{fill:'#f97316',stroke:'#c2410c','stroke-width':2.5,style:'cursor:grab;filter:drop-shadow(0 3px 6px rgba(249,115,22,.5))'});
 g.appendChild(pin);
 const pinlab=T(X0+2.5*DX,Y-24,'2.5',{'font-size':13,fill:'#c2410c'});
 g.appendChild(pinlab);
 let pinv=2.5;
 const setPin=v=>{pinv=clamp(v,-5,5);const x=X0+(pinv+5)*DX;pin.setAttribute('cx',x);pinlab.setAttribute('x',x);pinlab.textContent=fmt(pinv);api.touch()};
 makeDrag(s,pin,pt=>setPin((pt.x-X0)/DX-5));
 const special=[[Math.sqrt(2),'√2'],[Math.sqrt(3),'√3'],[Math.PI,'π'],[Math.sqrt(5),'√5'],[Math.sqrt(7),'√7']];
 const irrg=s.appendChild(NS('g',{}));
 special.forEach(([v,nm])=>{const x=X0+(v+5)*DX;if(x>XMAX)return;
  irrg.appendChild(NS('path',{d:'M '+x+' '+(Y-14)+' l 5 -9 l 5 9 z',fill:'#7c3aed'}));
  irrg.appendChild(T(x,Y-30,nm,{'font-size':10,fill:'#7c3aed'}));
 });
 irrg.style.opacity=0;
 const chips=document.createElement('div');chips.className='tabs';ctl.appendChild(chips);
 const fams=[['N Naturals',v=>v>=1&&Number.isInteger(v),'#059669'],
  ['W Wholes',v=>v>=0&&Number.isInteger(v),'#0284c7'],
  ['Z Integers',v=>Number.isInteger(v),'#7c3aed'],
  ['Q Rationals',v=>true,'#d97706'],
  ['Irrationals',v=>special.some(([sv])=>Math.abs(sv-v)<0.005),'#be185d'],
  ['R Reals',v=>true,'#3f3c58']];
 let marks=[];
 fams.forEach((f,i)=>{const b=document.createElement('button');b.className='tab';b.textContent=f[0];
  b.addEventListener('click',()=>{chips.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');show(f);api.touch()});
  chips.appendChild(b)});
 function show(f){
  marks.forEach(m=>m.remove());marks=[];
  const pred=f[1],col=f[2];
  irrg.style.opacity=(f[0]==='Irrationals')?1:0.25;
  if(f[0]==='R Reals'){
   marks.push(RC(X0,Y-3,XMAX-X0,6,{fill:'url(#realg)',opacity:.9}));
   const defs=NS('linearGradient',{id:'realg',x1:0,y1:0,x2:1,y2:0});
   ['','#6366f1','#a855f7','#ec4899'].forEach((c,i)=>{if(c){const st=NS('stop',{offset:(i/3)*100+'%','stop-color':c});defs.appendChild(st)}});
   s.appendChild(defs);
   readout(ctl,'Every single point on this line is a <b>Real number</b> — rationals and irrationals together, no gaps.');
   return;
  }
  if(f[0]==='Q Rationals'){
   for(let v=-5;v<=5.01;v+=0.25){const x=X0+(v+5)*DX;marks.push(CR(x,Y,3.4,{fill:col}))}
   readout(ctl,'Rationals are <b>everywhere dense</b> — between any two dots there is always another dot. Yet they still leave room for √2, √3, π…');
   return;
  }
  for(let v=-5;v<=5;v++){if(pred(v)){const x=X0+(v+5)*DX;marks.push(CR(x,Y,7,{fill:col,opacity:.95}))}}
  readout(ctl,'<b>'+f[0].split(' ')[0]+'</b> highlighted. Now drag the orange pin onto one of these dots — or somewhere else entirely!');
 }
 const btwn=document.createElement('div');btwn.className='ctlrow';btwn.style.marginTop='6px';ctl.appendChild(btwn);
 const b1=addBtn(btwn,'🎯 Drop pin at a random irrational','btn-g',()=>{setPin(pick(special)[0]+R(-2,3));api.touch()});
 readout(ctl,'Tap a family chip above to see which numbers belong to it. Drag the orange pin anywhere!');
 if(opts.mode==='between'){
  let count=0;const dots=[];
  const info=readout(ctl,'Two pins are placed. Insert midpoints — the gaps NEVER run out!');
  const bctl=document.createElement('div');bctl.className='ctlrow';ctl.appendChild(bctl);
  addBtn(bctl,'➕ Insert midpoint','btn-p',()=>{
   count++;
   const v=(pinv)/2+((count%2)?-1:1)*0;
   const nv=pinv+(pinv>0?-1:1)*Math.pow(0.5,count+1);
   const x=X0+(nv+5)*DX;
   const d=CR(x,Y,5,{fill:'#059669',opacity:.9});
   s.appendChild(d);dots.push(d);
   info.innerHTML='Inserted <b>'+count+'</b> midpoint'+(count>1?'s':'')+' — still infinitely many left. Density in action!';
   SFX.step();api.touch();
  });
  addBtn(bctl,'🧹 Reset','btn-g',()=>{dots.forEach(d=>d.remove());dots.length=0;count=0;info.innerHTML='Reset. Insert midpoints again!'});
 }
 if(opts.mode==='decimal'){

 });

/* ---------- 13. CONGRUENCE SNAP ---------- */
LABS.congr=function(box,ctl,opts,api){
 box.innerHTML='';const s=makeSVG(560,300);box.appendChild(s);
 let t1=[4,5,6],t2=[3,5,7];
 const g1=s.appendChild(NS('g',{})),g2=s.appendChild(NS('g',{}));
 const badge=T(280,286,'',{'font-size':16,'font-weight':800,fill:'#047857','font-family':'Outfit'});
 s.appendChild(badge);
 function drawTri(g,baseX,baseY,sc,tri,col,label){
  g.innerHTML='';
  const [s1,s2,s3]=tri;
  const x=(s2*s2+s1*s1-s3*s3)/(2*s1);
  const h2=s2*s2-x*x;
  if(h2<0)return false;
  const h=Math.sqrt(h2);
  const ax=baseX,ay=baseY,bx=baseX+s1*sc,by=baseY,cx=baseX+x*sc,cy=baseY-h*sc;
  g.appendChild(PT('M '+ax+' '+ay+' L '+bx+' '+by+' L '+cx+' '+cy+' Z',{fill:col.replace(')',', .12)').replace('rgb','rgba'),stroke:col,'stroke-width':2.6}));
  g.appendChild(T((ax+bx)/2,ay+16,'s1='+s1,{'font-size':11,fill:col}));
  g.appendChild(T((ax+cx)/2-16,(ay+cy)/2,'s2='+s2,{'font-size':11,fill:col}));
  g.appendChild(T((bx+cx)/2+16,(by+cy)/2,'s3='+s3,{'font-size':11,fill:col}));
  g.appendChild(T(baseX+s1*sc/2,baseY-8,label,{'font-size':13,'font-weight':800,fill:'#3f3c58','font-family':'Outfit'}));
  return true;
 }
 function draw(){
  const ok1=drawTri(g1,40,240,26,t1,'rgb(37,99,235)','Δ 1');
  const same=t1.slice().sort().join()===t2.slice().sort().join();
  const ok2=drawTri(g2,320,240,26,t2,'rgb(219,39,119)','Δ 2');
  if(!ok1||!ok2){badge.textContent='⚠️ those three sides cannot close — triangle inequality fails!';badge.setAttribute('fill','#dc2626');return}
  if(same){
   badge.textContent='CONGRUENT · SSS ✓ — CPCT unlocked: every angle & side matches!';
   badge.setAttribute('fill','#047857');
   if(!LABS.congr._cel){LABS.congr._cel=1;burst(40);SFX.win()}
  }else{badge.textContent='Different side sets → not congruent. Match all three!';badge.setAttribute('fill','#3f3c58')}
  api.touch();
 }
 addSlider(ctl,'Δ1 · side 1',2,9,t1[0],1,v=>{t1[0]=v;draw()});
 addSlider(ctl,'Δ1 · side 2',2,9,t1[1],1,v=>{t1[1]=v;draw()});
 addSlider(ctl,'Δ1 · side 3',2,9,t1[2],1,v=>{t1[2]=v;draw()});
 const hr=document.createElement('hr');hr.className='soft';hr.style.margin='2px 0';ctl.appendChild(hr);
 addSlider(ctl,'Δ2 · side 1',2,9,t2[0],1,v=>{t2[0]=v;draw()});
 addSlider(ctl,'Δ2 · side 2',2,9,t2[1],1,v=>{t2[1]=v;draw()});
 addSlider(ctl,'Δ2 · side 3',2,9,t2[2],1,v=>{t2[2]=v;draw()});
 draw();
 readout(ctl,'Set Δ2 equal to Δ1 (any order) and watch the SSS snap. Note: equal ANGLES alone (AAA) would never snap — size stays free!');
};

   const a1=Math.atan2(A.y-C.y,A.x-C.x)*180/Math.PI,a2=Math.atan2(B.y-C.y,B.x-C.x)*180/Math.PI;
   g.appendChild(ARC(C.x,C.y,26,a1,a2,{stroke:'#2563eb','stroke-width':2.6}));

   const node=CR(C.x,C.y,8,{fill:'#f97316',stroke:'#fff','stroke-width':2,style:'cursor:grab'});
   g.appendChild(node);
   makeDrag(s,node,p=>{let a=Math.atan2(CY-p.y,p.x-CX)*180/Math.PI;cphi=a;draw();api.touch()});
   info.innerHTML='Same arc AB: central angle at O = <b>'+cthl+'°</b>, inscribed angle at C = <b>'+(cthl/2)+'°</b> — always HALF. Drag C anywhere on the major arc: it never changes. (Arc is a semicircle → inscribed = 90°.)';
  }
  if(mode==='cyclic'){
   const pts=[P(p1),P(p2),P(p3),P(p4)];
   g.appendChild(PT('M '+pts[0].x+' '+pts[0].y+' L '+pts[1].x+' '+pts[1].y+' L '+pts[2].x+' '+pts[2].y+' L '+pts[3].x+' '+pts[3].y+' Z',{fill:'rgba(13,148,136,.08)',stroke:'#0f766e','stroke-width':2.4}));
   const ang=(P0,P1,P2)=>{const v1={x:P1.x-P0.x,y:P1.y-P0.y},v2={x:P2.x-P0.x,y:P2.y-P0.y};const dt=v1.x*v2.x+v1.y*v2.y,m1=Math.hypot(v1.x,v1.y),m2=Math.hypot(v2.x,v2.y);return Math.acos(clamp(dt/(m1*m2),-1,1))*180/Math.PI};
   const As=ang(pts[0],pts[1],pts[3]),Bs=ang(pts[1],pts[0],pts[2]),Cs=ang(pts[2],pts[1],pts[3]),Ds=ang(pts[3],pts[0],pts[2]);
   pts.forEach((pt,i)=>{
    const node=CR(pt.x,pt.y,8,{fill:'#f97316',stroke:'#fff','stroke-width':2,style:'cursor:grab'});

   });
   info.innerHTML='∠A = '+fmt(As)+'°, ∠C = '+fmt(Cs)+'° → A + C = <b>'+fmt(As+Cs)+'°</b> · ∠B + ∠D = <b>'+fmt(Bs+Ds)+'°</b>. Opposite angles of a cyclic quadrilateral ALWAYS sum to 180° — drag any corner!';
  }

 }
 if(mode==='parts'||mode==='chords'){

/* ---------- 18. HERON MACHINE ---------- */
LABS.heron=function(box,ctl,opts,api){
 box.innerHTML='';const s=makeSVG(520,270);box.appendChild(s);
 const g=s.appendChild(NS('g',{}));
 const core=opts.mode!=='field';
 let a=13,b=14,c=15,rate=5;
 const info=readout(ctl,'');
 function draw(){
  g.innerHTML='';
  const valid=a+b>c&&a+c>b&&b+c>a;
  const sc=Math.min(16,150/Math.max(a,b,c));
  const ax=70,ay=225,bx=ax+c*sc,by=225;
  if(valid){
   const x=(a*a+c*c-b*b)/(2*c);
   const h=Math.sqrt(Math.max(0,a*a-x*x));
   const cx2=ax+x*sc,cy2=225-h*sc;
   g.appendChild(PT('M '+ax+' '+ay+' L '+bx+' '+by+' L '+cx2+' '+cy2+' Z',{fill:'rgba(22,163,74,.1)',stroke:'#16a34a','stroke-width':2.6}));
   g.appendChild(T(ax-16,229,'a='+a,{'font-size':11,fill:'#14532d'}));
   g.appendChild(T((ax+bx)/2,241,'c='+c,{'font-size':11,fill:'#14532d'}));
   g.appendChild(T((bx+cx2)/2+18,(by+cy2)/2,'b='+b,{'font-size':11,fill:'#14532d'}));
   const sm=(a+b+c)/2;
   const A2=Math.sqrt(sm*(sm-a)*(sm-b)*(sm-c));
   info.innerHTML='s = ('+a+'+'+b+'+'+c+')/2 = <b>'+fmt(sm)+'</b> · s−a='+fmt(sm-a)+', s−b='+fmt(sm-b)+', s−c='+fmt(sm-c)+'<br>Area = √(s(s−a)(s−b)(s−c)) = √('+fmt(sm*(sm-a)*(sm-b)*(sm-c))+') = <b>'+fmt(A2)+(core?'':' m²')+'</b>'+(core?'':' · at ₹'+rate+'/m² → <b>₹'+fmt(A2*rate)+'</b>');
  }else{
   g.appendChild(LN(ax,ay,bx,by,{stroke:'#ef4444','stroke-width':3}));
   info.innerHTML='⚠️ '+a+', '+b+', '+c+' cannot form a triangle ('+(a+b)+' ≤ '+c+'). Heron needs a valid triangle — fix the sliders!';
  }
  api.touch();
 }
 addSlider(ctl,'side a',2,15,a,1,v=>{a=v;draw()});
 addSlider(ctl,'side b',2,15,b,1,v=>{b=v;draw()});
 addSlider(ctl,'side c',2,15,c,1,v=>{c=v;draw()});
 if(!core)addSlider(ctl,'rate ₹/m²',1,10,rate,1,v=>{rate=v;draw()});
 const bctl=document.createElement('div');bctl.className='ctlrow';ctl.appendChild(bctl);
 addBtn(bctl,'🏞️ Park 122-120-22','btn-s',()=>{a=15;b=15;c=3;draw()});

LABS.solid=function(box,ctl,opts,api){
 box.innerHTML='';const s=makeSVG(560,280);box.appendChild(s);
 const g=s.appendChild(NS('g',{}));
 const mode=opts.mode||'cone';
 let r=7,h=24,unroll=false;
 const info=readout(ctl,'');
 const PV=()=>(r%7===0)?22/7:PI;
 const pnote=()=>(r%7===0)?' (π=22/7)':'';
 function draw(){
  g.innerHTML='';
  const cx=170,base=235;
  if(mode==='cone'){
   const W=r*8,H=Math.min(h*6,170);
   g.appendChild(PT('M '+(cx-W)+' '+base+' L '+cx+' '+(base-H)+' L '+(cx+W)+' '+base+' Z',{fill:'rgba(8,145,178,.12)',stroke:'#0891b2','stroke-width':2.6}));
   g.appendChild(NS('ellipse',{cx:cx,cy:base,rx:W,ry:14,fill:'rgba(8,145,178,.15)',stroke:'#0891b2','stroke-width':2}));
   g.appendChild(LN(cx,base,cx,base-H,{stroke:'#3f3c58','stroke-dasharray':'4 3'}));
   g.appendChild(T(cx+4,base-H/2,'h='+h,{'font-size':11,fill:'#3f3c58'}));
   const l=Math.hypot(r,h);
   g.appendChild(T(cx+W/2+10,base-H/2,'l='+fmt(l),{'font-size':11,fill:'#0e7490','font-weight':800}));
   g.appendChild(T(cx,base+30,'r = '+r,{'font-size':12,fill:'#0f766e','font-weight':800}));
   if(unroll){
    const RL=l*4.4,sweep=360*r/l;
    const ex=cx+330+RL*Math.cos(sweep*Math.PI/180),ey=140-RL*Math.sin(sweep*Math.PI/180);
    g.appendChild(PT('M '+(cx+330)+' 140 L '+(cx+330+RL)+' 140 A '+RL+' '+RL+' 0 '+(sweep>180?1:0)+' 1 '+ex+' '+ey+' Z',{fill:'rgba(8,145,178,.1)',stroke:'#0891b2','stroke-width':2}));
    g.appendChild(T(cx+330,140,'O',{'font-size':12,fill:'#0e7490'}));
    g.appendChild(T(cx+330,258,'unrolled: sector radius l = '+fmt(l)+', arc = 2πr = '+fmt(2*PV()*r)+pnote(),{'font-size':11,fill:'#0e7490'}));
   }
   info.innerHTML='l² = r² + h² → l = '+fmt(l)+' · CSA = πrl = '+fmt(PV()*r*l)+pnote()+' · TSA = πr(l+r) = '+fmt(PV()*r*(l+r))+pnote()+' · V = ⅓πr²h = '+fmt(PV()*r*r*h/3)+pnote()+' · 3 cones fill 1 cylinder!';
  }
  if(mode==='cylinder'){
   const W=r*7,H=Math.min(h*5,160);
   g.appendChild(RC(cx-W,base-H,2*W,H,{fill:'rgba(8,145,178,.1)',stroke:'#0891b2','stroke-width':2.6,rx:6}));
   g.appendChild(NS('ellipse',{cx:cx,cy:base-H,rx:W,ry:12,fill:'rgba(8,145,178,.2)',stroke:'#0891b2','stroke-width':2}));
   g.appendChild(T(cx,base+26,'r = '+r+' · h = '+h,{'font-size':12,fill:'#0f766e','font-weight':800}));
   if(unroll){
    g.appendChild(RC(cx+130,60,2*PV()*r*3.4,H,{fill:'rgba(8,145,178,.08)',stroke:'#0891b2','stroke-width':2}));
    g.appendChild(T(cx+130+PV()*r*3.4,50,'width = 2πr = '+fmt(2*PV()*r)+pnote()+' × height h = '+h,{'font-size':11,fill:'#0e7490'}));
   }
   info.innerHTML='CSA = 2πrh = '+fmt(2*PV()*r*h)+pnote()+' · TSA = 2πr(r+h) = '+fmt(2*PV()*r*(r+h))+pnote()+' · V = πr²h = '+fmt(PV()*r*r*h)+pnote()+' = '+fmt(PV()*r*r*h/1000)+' L · the label peels into a 2πr × h rectangle!';
  }
  if(mode==='sphere'){
   const W=Math.min(r*7,110);
   g.appendChild(CR(cx,130,W,{fill:'rgba(8,145,178,.12)',stroke:'#0891b2','stroke-width':2.6}));
   g.appendChild(NS('ellipse',{cx:cx,cy:130,rx:W,ry:W*0.32,fill:'none',stroke:'#0891b2','stroke-width':1.4,'stroke-dasharray':'4 3'}));
   g.appendChild(T(cx,130+W+22,'r = '+r,{'font-size':12,fill:'#0f766e','font-weight':800}));
   info.innerHTML='Sphere SA = 4πr² = '+fmt(4*PV()*r*r)+pnote()+' · Hemisphere: CSA 2πr² = '+fmt(2*PV()*r*r)+', TSA 3πr² = '+fmt(3*PV()*r*r)+pnote()+' · V(sphere) = 4/3 πr³ = '+fmt(4*PV()*r*r*r/3)+pnote()+' · (r=7 classics: 616, 308, 462!)';
  }
  api.touch();
 }
 addTabs(ctl,['Cone','Cylinder','Sphere'],['cone','cylinder','sphere'].indexOf(mode),i=>{
  LABS.solid(box,ctl,{mode:['cone','cylinder','sphere'][i]},api);
 });

 addSlider(ctl,mode==='sphere'?'(sphere ignores h)':'height h',2,30,h,1,v=>{h=v;draw()});
 const bctl=document.createElement('div');bctl.className='ctlrow';ctl.appendChild(bctl);
 addBtn(bctl,'🪄 Unroll / fold','btn-p',()=>{unroll=!unroll;draw();SFX.step();api.touch()});
 draw();
};
